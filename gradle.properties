org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Huawei Health Kit (v6.5): the App ID of Attune's app in AppGallery Connect (a number, not a secret).
# Empty = the direct Huawei Health link is off; the app offers the Health Sync route instead.
attune.hmsAppId=
# v6.35: compileSdk 37 (Android 17) with AGP 8.9.1 — Google's Android 17 setup page asks for AGP 8.9.0-rc01 or newer; AGP 8.9 only
# warns that it was tested up to 36, which this line silences (AGP 9.1.1+ lists 37 as supported — a bigger upgrade for later)
android.suppressUnsupportedCompileSdk=37
