<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12151C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Yusr — Money &amp; Zakat</title>
<style>
/* Inside Attune: scrolling the ledger never drags the app around it. */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}

:root{--bg:#0F1218;--bg2:#12151C;--card:#1A1F2A;--card2:#212836;--line:#2A3140;--line2:#333c4d;--text:#EAEEF6;--muted:#8B95A7;--faint:#606A7C;--accent:#E7B24C;--expense:#F06A6A;--income:#4FBF8B;--blue:#5B9BD5;--purple:#B57BE0;--radius:18px;--radius-sm:12px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;--mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overscroll-behavior-y:none}
body{-webkit-user-select:none;user-select:none}
html[dir="rtl"] .num{direction:ltr}
input,textarea,select{font-family:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-top:var(--safe-t);position:relative}
.screen{display:none;padding:0 18px 130px;animation:fade .25s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
header{padding:22px 2px 12px;display:flex;align-items:flex-end;justify-content:space-between}
header h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-0.03em}
header .sub{color:var(--muted);font-size:13px;margin-top:2px}
.hbtns{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:17px}
.acct-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.acct-scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--card);color:var(--muted);font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.chip.active{background:var(--card2);color:var(--text);border-color:var(--line2)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.balance{background:linear-gradient(150deg,#20283A,#171C27);border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(231,178,76,.18),transparent 70%);pointer-events:none}
.balance .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.balance .big{font-size:38px;font-weight:800;margin:6px 0 2px;letter-spacing:-0.03em}
.balance .row{display:flex;gap:22px;margin-top:16px}
.balance .row .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.balance .row .v{font-size:17px;font-weight:700;margin-top:3px}
.up{color:var(--income)}.down{color:var(--expense)}.neu{color:var(--blue)}
.budget-bar{margin-top:16px}
.budget-bar .top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.budget-bar .track{height:9px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.budget-bar .fill{height:100%;border-radius:99px;transition:width .5s ease}
.alert{background:rgba(240,106,106,.14);border:1px solid rgba(240,106,106,.4);color:#ffbcbc;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;margin-bottom:14px;display:flex;gap:8px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.sec-head h2{margin:0;font-size:16px;font-weight:700}
.sec-head h3{margin:0;font-size:14px;font-weight:700}
.link{color:var(--accent);font-size:13px;font-weight:600}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;align-items:center}
.filters::-webkit-scrollbar{display:none}
.seg{display:inline-flex;background:var(--card);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--text)}
.search{flex:1;min-width:90px;background:var(--card);border:1px solid transparent;border-radius:11px;padding:9px 13px;color:var(--text);font-size:14px}
.search:focus{outline:none;border-color:var(--line2)}
.mini-btn{flex:0 0 auto;background:var(--card);border-radius:11px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.mini-btn.act{color:var(--accent)}
.tx-list{margin-top:2px}
.day-label{color:var(--faint);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 4px}
.tx{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid var(--line)}
.tx:active{background:var(--card);border-radius:10px;border-color:transparent}
.tx .emo{width:42px;height:42px;flex:0 0 auto;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:20px;position:relative;overflow:hidden}
.tx .emo img{width:100%;height:100%;object-fit:cover}
.tx .mid{flex:1;min-width:0}
.tx .cat{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .meta{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-size:16px;font-weight:700;flex:0 0 auto}
.empty{text-align:center;color:var(--faint);padding:44px 20px;font-size:14px;line-height:1.6}
.empty .big-emo{font-size:40px;display:block;margin-bottom:10px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px}
.stat .k{color:var(--muted);font-size:12px;font-weight:600}
.stat .v{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-0.02em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 8px;margin-top:14px}
.panel h3{margin:0 0 4px;font-size:14px;font-weight:700}
.panel .psub{color:var(--muted);font-size:12px;margin-bottom:10px}
.catbar{margin:11px 0}
.catbar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.catbar .top .l{display:flex;gap:8px;align-items:center;font-weight:600}
.catbar .track{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.catbar .fill{height:100%;border-radius:99px;transition:width .5s ease}
.catbar .pct{color:var(--muted);font-size:11px;margin:0 8px}
svg text{font-family:var(--font)}
.insight{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.insight:last-child{border:none}
.insight .ico{font-size:20px}
.insight b{font-weight:800}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:6px 0 12px}
.heat .cell{aspect-ratio:1;border-radius:5px;background:var(--card2);display:grid;place-items:center;font-size:9px;color:var(--faint)}
.heat .hd{font-size:10px;color:var(--faint);text-align:center;font-weight:700}
.acct-card,.list-row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;margin-bottom:11px;display:flex;align-items:center;gap:13px}
.acct-card{border-radius:var(--radius);padding:16px}
.acct-card .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px}
.list-row .info,.acct-card .info{flex:1;min-width:0}
.acct-card .nm,.list-row .t1{font-weight:700;font-size:15px}
.acct-card .bal,.list-row .t2{font-size:12px;color:var(--muted);margin-top:2px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.goal .gtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.goal .gname{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
.goal .gnum{font-size:13px;color:var(--muted)}
.goal .track{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin-bottom:10px}
.goal .fill{height:100%;border-radius:99px;transition:width .5s}
.goal .gact{display:flex;gap:8px}
.goal .gact button{flex:1;padding:9px;border-radius:10px;background:var(--card2);font-weight:700;font-size:13px;border:1px solid var(--line2)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:#1a1400;font-weight:800;font-size:15px;text-align:center;margin-top:12px}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line2)}
.btn.danger{background:transparent;color:var(--expense);border:1px solid var(--expense)}
.btn:active{transform:scale(.98)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--safe-b));width:60px;height:60px;border-radius:20px;background:var(--accent);color:#1a1400;font-size:30px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(231,178,76,.35);z-index:40}
.fab:active{transform:translateX(-50%) scale(.92)}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(16,18,24,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + var(--safe-b));z-index:35}
nav .max{max-width:520px;margin:0 auto;width:100%;display:flex}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--faint);font-size:8.5px;font-weight:600;padding:4px 1px;overflow:hidden}
nav button span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav button .ni{font-size:17px;line-height:1}
nav button.on{color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:50;display:none;align-items:flex-end}
.overlay.open{display:flex;animation:fade .2s}
.sheet{background:var(--bg2);width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:10px 20px calc(24px + var(--safe-b));max-height:92vh;overflow-y:auto;animation:slideup .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.grab{width:38px;height:4px;background:var(--line2);border-radius:99px;margin:6px auto 14px}
.sheet h2{margin:0 0 16px;font-size:20px;font-weight:800}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--text);font-size:16px;-webkit-appearance:none}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.amount-in{font-family:var(--mono);font-size:30px!important;font-weight:800;text-align:center;padding:16px!important}
.type-toggle{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.type-toggle button{flex:1;padding:12px 4px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.type-toggle button.exp.on{background:rgba(240,106,106,.16);color:var(--expense)}
.type-toggle button.inc.on{background:rgba(79,191,139,.16);color:var(--income)}
.type-toggle button.trf.on{background:rgba(91,155,213,.16);color:var(--blue)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.cat-opt .ce{font-size:22px;display:block;margin-bottom:4px}
.cat-opt.on{border-color:var(--accent);background:var(--card2);color:var(--text)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.del-link{text-align:center;color:var(--expense);font-weight:700;font-size:14px;padding:12px;margin-top:2px}
.dup-link{text-align:center;color:var(--accent);font-weight:700;font-size:14px;padding:12px 0 2px}
.emoji-pick{display:flex;gap:8px;flex-wrap:wrap}
.emoji-pick button{width:44px;height:44px;border-radius:12px;background:var(--card);font-size:22px;border:1px solid var(--line)}
.emoji-pick button.on{border-color:var(--accent);background:var(--card2)}
.bud-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bud-row .bl{flex:1;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.bud-row input{width:120px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font-size:15px;text-align:right}
.photo-thumb{width:100%;border-radius:12px;margin-top:10px;max-height:220px;object-fit:cover}
.toast{position:fixed;bottom:calc(155px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line2);color:var(--text);padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:70;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mini-help{color:var(--faint);font-size:12px;line-height:1.6;margin-top:10px}
a{color:var(--accent)}
.lang-toggle{display:flex;background:var(--card);border-radius:11px;padding:3px;gap:2px}
.lang-toggle button{flex:1;padding:11px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.lang-toggle button.on{background:var(--card2);color:var(--text)}
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.lock.open{display:flex}
.lock .logo{font-size:40px;margin-bottom:8px}
.lock h2{margin:0 0 6px;font-size:20px}
.lock .dots{display:flex;gap:14px;margin:22px 0 30px}
.lock .dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--muted)}
.lock .dot.f{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:16px}
.pad button{height:72px;border-radius:50%;background:var(--card);font-size:26px;font-weight:600}
.pad button:active{background:var(--card2)}
.pad .wide{background:none;font-size:15px;color:var(--muted)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:90vh;border-radius:12px}
html[data-theme="emerald"]{--bg:#0A130F;--bg2:#0E1A15;--card:#152520;--card2:#1D3029;--line:#24392F;--line2:#31493D;--text:#E9F3ED;--muted:#8BA89B;--faint:#5F7B6E;--accent:#D9B65C;--income:#5BC98F;--expense:#E8736F;--blue:#5AA5C4}
html[data-theme="ocean"]{--bg:#080F18;--bg2:#0C141F;--card:#131F2D;--card2:#1B2B3C;--line:#23364A;--line2:#31475E;--text:#E6EEF8;--muted:#8698B0;--faint:#5C6E85;--accent:#59A6DC;--income:#4FC79A;--expense:#F0736F;--blue:#7FB9E8}
html[data-theme="pearl"]{--bg:#F4F1EA;--bg2:#FFFFFF;--card:#FFFFFF;--card2:#F1EDE4;--line:#E4DFD3;--line2:#D2CBBB;--text:#191713;--muted:#6C6557;--faint:#968E7E;--accent:#A67C13;--income:#127A4E;--expense:#B3372F;--blue:#22648F}
html[data-theme="pearl"] nav{background:rgba(255,255,255,.94)}
html[data-theme="pearl"] .balance{background:linear-gradient(150deg,#FFFFFF,#F3EFE5)}
html[data-theme="pearl"] .balance::after{background:radial-gradient(circle,rgba(166,124,19,.13),transparent 70%)}
html[data-theme="pearl"] .btn{color:#fff}
html[data-theme="pearl"] .fab{color:#fff;box-shadow:0 8px 22px rgba(166,124,19,.3)}
html[data-theme="pearl"] .alert{color:#8a2b24}
html[data-theme="emerald"] .balance{background:linear-gradient(150deg,#1B3129,#101C17)}
html[data-theme="ocean"] .balance{background:linear-gradient(150deg,#17293C,#0D1721)}
html[data-theme="ocean"] .fab,html[data-theme="ocean"] .btn{color:#04121c}
html[data-fs="s"]{zoom:0.88}
html[data-fs="m"]{zoom:1}
html[data-fs="l"]{zoom:1.15}
@supports not (zoom:1){html[data-fs="s"] body{transform:scale(.88);transform-origin:top center}html[data-fs="l"] body{transform:scale(1.15);transform-origin:top center}}
.acc-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.acc-swatch{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.acc-swatch.on{border-color:var(--text)}
.gl{margin:0;padding-inline-start:18px}
.gl li{font-size:14px;line-height:1.75;color:var(--muted);margin-bottom:9px}
.gl li b{color:var(--text)}
.lock-badge{font-size:11px;margin-inline-start:6px}
.pw-hero{text-align:center;padding:6px 0 14px}
.pw-star{font-size:40px}
.pw-hero h3{margin:6px 0 0;font-size:19px}
.pw-plans{display:flex;gap:9px;margin:16px 0 10px}
.pw-plan{flex:1;border:2px solid var(--line);border-radius:14px;padding:14px 6px;background:var(--card);position:relative}
.pw-plan.best{border-color:var(--accent)}
.pw-plan .tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--accent);color:#1a1400;font-size:9px;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap}
.pw-plan .pn{font-size:12px;color:var(--muted);font-weight:700}
.pw-plan .pp{font-size:17px;font-weight:800;margin-top:3px}
.stat{cursor:pointer;position:relative}
.drill-hint{font-size:10px;color:var(--accent);font-weight:700;margin-top:6px;opacity:.85}
.catbar{cursor:pointer}
.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th{text-align:start;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:8px 6px;border-bottom:1px solid var(--line2)}
.dtable td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.dtable tr:active td{background:var(--card)}
.dtable .r{text-align:end;white-space:nowrap;font-family:var(--mono);font-weight:700}
.dtable .tn{color:var(--faint);font-size:11px;margin-top:2px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.cal-nav button{width:34px;height:34px;border-radius:10px;background:var(--card2);font-size:18px;color:var(--text)}
.cal-nav button:disabled{opacity:.3}
.cal-title{font-weight:800;font-size:15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-hd{text-align:center;font-size:10px;color:var(--faint);font-weight:800;padding-bottom:4px}
.cal-pad{aspect-ratio:1}
.cal-cell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid transparent;padding:0}
.cal-cell .cd{font-size:11px;font-weight:700;line-height:1}
.cal-cell .cv{font-size:8.5px;font-family:var(--mono);opacity:.85;line-height:1}
.cal-cell.l0{background:var(--card2);color:var(--faint)}
.cal-cell.l1{background:rgba(231,178,76,.22);color:var(--text)}
.cal-cell.l2{background:rgba(231,178,76,.42);color:var(--text)}
.cal-cell.l3{background:rgba(231,178,76,.68);color:#1a1400}
.cal-cell.l4{background:var(--accent);color:#1a1400}
.cal-cell.today{border-color:var(--text)}
.cal-cell:active{transform:scale(.93)}
.cal-legend{display:flex;align-items:center;gap:5px;justify-content:center;margin:12px 0 4px;font-size:10px;color:var(--faint)}
.cal-legend i{width:15px;height:15px;border-radius:4px;display:inline-block}
.cal-legend i.l0{background:var(--card2)}.cal-legend i.l1{background:rgba(231,178,76,.22)}.cal-legend i.l2{background:rgba(231,178,76,.42)}.cal-legend i.l3{background:rgba(231,178,76,.68)}.cal-legend i.l4{background:var(--accent)}

.todo-bar{height:5px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:9px}
.todo-bar i{display:block;height:100%;background:var(--income);border-radius:99px;transition:width .3s}
.item-edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}

/* ===== Motion & polish ===== */
*{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
@media (prefers-reduced-motion:no-preference){
  .screen{animation:pop .32s cubic-bezier(.22,.9,.28,1)}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
  .tx{animation:fadeRow .3s ease both}
  @keyframes fadeRow{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
button,.chip,.stat,.note-card,.acct-card,.list-row,.goal,.cal-cell,.tx,.cat-opt,.theme-opt,.pw-plan{
  transition:transform .16s cubic-bezier(.2,.8,.2,1),background .18s ease,border-color .18s ease,box-shadow .18s ease,opacity .18s ease}
button:active,.chip:active,.cat-opt:active,.theme-opt:active,.pw-plan:active{transform:scale(.96)}
.stat:active,.note-card:active,.acct-card:active,.list-row:active,.goal:active{transform:scale(.985)}
.panel,.stat,.acct-card,.note-card,.goal,details.acc{box-shadow:0 1px 2px rgba(0,0,0,.18)}
html[data-theme="pearl"] .panel,html[data-theme="pearl"] .stat,html[data-theme="pearl"] .acct-card,
html[data-theme="pearl"] .note-card,html[data-theme="pearl"] .goal,html[data-theme="pearl"] details.acc{box-shadow:0 1px 3px rgba(0,0,0,.07)}
.balance{box-shadow:0 6px 22px rgba(0,0,0,.24)}
html[data-theme="pearl"] .balance{box-shadow:0 6px 20px rgba(0,0,0,.08)}
.sheet{box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.fab{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease}
.fab:active{transform:translateX(-50%) scale(.9)}
nav button{transition:color .18s ease}
nav button .ni{transition:transform .22s cubic-bezier(.2,.9,.3,1.3)}
nav button.on .ni{transform:translateY(-2px) scale(1.12)}
.seg button,.type-toggle button{transition:background .2s ease,color .2s ease}
.track .fill,.todo-bar i,.budget-bar .fill{transition:width .55s cubic-bezier(.3,.9,.3,1)}
input,select,textarea{transition:border-color .18s ease,background .18s ease}
.tx:active,.dtable tr:active td{transition:none}
details.acc>summary{transition:background .18s ease}
details.acc[open]>summary{background:var(--card2)}
.cal-cell{will-change:transform}
.empty .big-emo{animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.toast{box-shadow:0 8px 26px rgba(0,0,0,.35)}
::-webkit-scrollbar{width:0;height:0}
.sheet{scrollbar-width:none}
/* nicer separators & rhythm */
.panel{border-radius:20px}
.tx{border-radius:12px;padding-inline:8px;margin-inline:-4px}
.day-label{margin-top:20px}
.balance .big{letter-spacing:-.035em}
h1{letter-spacing:-.032em}

.theme-row{display:flex;gap:10px;margin-top:4px}
.theme-opt{flex:1;border-radius:14px;padding:10px 6px;border:2px solid var(--line);background:var(--card);text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.theme-opt.on{border-color:var(--accent);color:var(--text)}
.theme-dot{width:100%;height:26px;border-radius:8px;margin-bottom:6px;display:block}
details.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-top:12px;overflow:hidden}
details.acc>summary{padding:15px 16px;font-size:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"\203A";color:var(--faint);font-size:20px;transform:rotate(90deg);transition:.2s}
details.acc[open]>summary::after{transform:rotate(-90deg)}
details.acc>.accb{padding:0 16px 12px}
.wiz{background:linear-gradient(150deg,#20283A,#171C27);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:14px}
html[data-theme="pearl"] .wiz{background:linear-gradient(150deg,#FFFFFF,#F3EFE5)}
.wiz h3{margin:0 0 4px;font-size:18px}
.wiz .step{color:var(--muted);font-size:13px;margin-bottom:14px}

.chkrow{display:flex;align-items:center;gap:11px;padding:12px 0;font-size:15px;font-weight:600;border-bottom:1px solid var(--line)}
.chkrow input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}
.ev-btn{width:18px;height:18px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);color:var(--accent);font-size:11px;font-weight:800;line-height:1;margin-inline-start:6px;font-style:italic}
.ev-ar{font-size:17px;line-height:2.1;direction:rtl;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.ev-src{color:var(--muted);font-size:13px;line-height:1.8;direction:rtl;text-align:right}
nav button{position:relative}
.nav-dot{position:absolute;top:1px;right:26%;width:9px;height:9px;border-radius:50%;background:var(--expense);box-shadow:0 0 0 2px var(--bg);z-index:2}
.taborow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.taborow:last-child{border:none}
.taborow.hidden .tablabel{opacity:.4}

.tabmove:disabled{opacity:.3}
.taborow .tablabel{flex:1;font-size:15px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taborow .tabshow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600;flex:0 0 auto}
.taborow .tabshow input{width:18px;height:18px}

.inv-itemrow button{width:38px;flex:0 0 auto;background:var(--card2);border:1px solid var(--line2);border-radius:9px;color:var(--expense);font-weight:700}
.onb{position:fixed;inset:0;z-index:120;background:var(--bg);display:none;flex-direction:column;padding:40px 26px calc(30px + var(--safe-b));overflow-y:auto}
.onb.open{display:flex}
.onb .step{margin:auto 0}

function isMetal(a){return !!(a&&(a.kind==='gold'||a.kind==='silver'));}
function metalPrice(kind){return kind==='gold'?(db.zakat.goldPrice||0):(db.zakat.silverPrice||0);}
function metalPurity(a){return a.kind==='gold'?((a.karat||24)/24):1;}
function metalValue(a){return accountBalance(a.id)*metalPurity(a)*metalPrice(a.kind);}
function acctValue(a){if(isLivestock(a))return 0;return isMetal(a)?metalValue(a):toDefault(accountBalance(a.id),a.currency);}
function fmtG(v){return (Math.round(v*1000)/1000).toLocaleString('en-US')+' '+t('gramsShort');}
function fmtAcct(a,v){if(isLivestock(a))return fmtHead(v);return isMetal(a)?fmtG(v):fmt(v,a.currency);}
function currOptions(sel){return CURRENCY_CODES.map(c=>'<option value="'+c+'"'+(sel===c?' selected':'')+'>'+c+' \u00b7 '+(CURR_EN[c]||CURR[c])+'</option>').join('');}
function countryOptions(sel){return '<option value="">\u2014</option>'+COUNTRIES.slice().sort((a,b)=>(db.lang==='ar'?a[2].localeCompare(b[2]):a[1].localeCompare(b[1]))).map(c=>'<option value="'+c[0]+'"'+(sel===c[0]?' selected':'')+'>'+(db.lang==='ar'?c[2]:c[1])+' \u00b7 '+c[3]+'</option>').join('');}
function countryCurrency(code){const c=COUNTRIES.find(x=>x[0]===code);return c?c[3]:null;}
function sym(c){return (db.lang==='ar'?CURR[c]:CURR_EN[c])||CURR[c]||c;}
function fmt(v,c){const s=sym(c||db.currency);const dec=(db.ui&&db.ui.dec===0)?0:2;const n=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:(dec&&v%1)?2:0,maximumFractionDigits:dec});return (v<0?'-':'')+s+' '+n;}
function acctById(id){return db.accounts.find(a=>a.id===id);}
function rate(c){return db.rates[c]||1;}
function toDefault(amount,c){return amount*rate(c);}
function viewCur(){return state.acct==='all'?db.currency:(acctById(state.acct)?.currency||db.currency);}
function inView(tx){const a=acctById(tx.account);if(isLivestock(a))return 0;if(isMetal(a))return tx.amount*metalPurity(a)*metalPrice(a.kind);const fc=a?a.currency:db.currency;return state.acct==='all'?toDefault(tx.amount,fc):tx.amount;}
function toISODate(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
function periodStart(p){const d=new Date();d.setHours(0,0,0,0);if(p==='week'){const wk=(db.ui&&db.ui.wk)||'mon';const off=wk==='sun'?0:(wk==='sat'?6:1);const day=(d.getDay()-off+7)%7;d.setDate(d.getDate()-day);}else if(p==='month')d.setDate(1);else if(p==='year')d.setMonth(0,1);else return new Date(0);return d;}
function accountBalance(id){const a=acctById(id);if(!a)return 0;let b=a.start||0;db.txns.forEach(x=>{if(x.type==='transfer'){if(x.account===id)b-=x.amount;if(x.toAccount===id)b+=x.amount;}else if(x.type==='debt'){if(x.account===id)b+=(x.flow==='borrow'||x.flow==='collect')?x.amount:-x.amount;}else if(x.type==='zakat'){if(x.account===id)b-=x.amount;}else if(x.account===id)b+=x.type==='income'?x.amount:-x.amount;});return b;}
function monthSpendByCat(){const start=periodStart('month');const out={total:0};db.txns.forEach(x=>{if(x.type!=='expense')return;if(new Date(x.date)<start)return;const a=acctById(x.account);const val=toDefault(x.amount,a?a.currency:db.currency);out.total+=val;out[x.cat]=(out[x.cat]||0)+val;});return out;}

/* ============ Recurring ============ */
function advance(d,f){const x=new Date(d);if(f==='weekly')x.setDate(x.getDate()+7);else if(f==='yearly')x.setFullYear(x.getFullYear()+1);else x.setMonth(x.getMonth()+1);return x;}
function processRecurring(){const today=startOfDay(new Date());let posted=0;(db.recurring||[]).forEach(r=>{if(!r.active)return;if(!acctById(r.account)){r.active=false;return;}let next=startOfDay(new Date(r.nextDate));let g=0;while(next<=today&&g<500){db.txns.push({id:uid(),created:Date.now(),type:r.type,amount:r.amount,cat:r.cat,account:r.account,date:toISODate(next),note:(r.note||'')+' ↻',recurring:true});posted++;next=advance(next,r.freq);g++;}r.nextDate=toISODate(next);});if(posted)save();return posted;}

function moveTab(k,dir){const o=db.ui.tabOrder;if(!o)return;const i=o.indexOf(k);if(i<0)return;const j=i+dir;if(j<0||j>=o.length)return;const tmp=o[i];o[i]=o[j];o[j]=tmp;save();applyUI();renderSettings();}

var navHist=[];

/* ============ Overview ============ */
function passesFilter(x){const f=state.filter;if(!f)return true;if(f.from&&x.date<f.from)return false;if(f.to&&x.date>f.to)return false;if(f.min!=null&&x.amount<f.min)return false;if(f.max!=null&&x.amount>f.max)return false;if(f.cat&&x.cat!==f.cat&&x.type!=='transfer')return false;if(f.cat&&x.type==='transfer')return false;return true;}
function txnsFor(acct,period){const start=periodStart(period);return db.txns.filter(x=>{if(acct!=='all'&&x.account!==acct&&x.toAccount!==acct)return false;if(state.filter){if(!passesFilter(x))return false;}else if(new Date(x.date)<start)return false;return true;}).sort((a,b)=>new Date(b.date)-new Date(a.date)||(b.created||0)-(a.created||0));}
function renderHome(){
  const chips=document.getElementById('acct-chips');chips.innerHTML='';
  const all=document.createElement('button');all.className='chip'+(state.acct==='all'?' active':'');all.innerHTML='<span class="dot" style="background:var(--accent)"></span>'+t('allAccounts');all.onclick=()=>{state.acct='all';renderHome();};chips.appendChild(all);
  db.accounts.forEach(a=>{const c=document.createElement('button');c.className='chip'+(state.acct===a.id?' active':'');c.textContent=a.emoji+' '+a.name;c.onclick=()=>{state.acct=a.id;renderHome();};chips.appendChild(c);});
  const cur=viewCur();
  let bal=state.acct==='all'?db.accounts.reduce((s,a)=>s+acctValue(a),0):accountBalance(state.acct);
  const _ba=state.acct==='all'?null:acctById(state.acct);document.getElementById('bal-amount').textContent=(_ba&&isMetal(_ba))?fmtG(bal):fmt(bal,cur);
  document.getElementById('bal-acct').textContent=state.acct==='all'?'· '+t('all'):'· '+acctById(state.acct).name;
  const list=txnsFor(state.acct,state.period);let inS=0,outS=0;
  list.forEach(x=>{if(x.type==='income')inS+=inView(x);else if(x.type==='expense')outS+=inView(x);});
  document.getElementById('sum-in').textContent='+'+fmt(inS,cur);document.getElementById('sum-out').textContent='-'+fmt(outS,cur);
  document.getElementById('home-sub').textContent=db.txns.length+' '+(db.lang==='ar'?'معاملة':'transactions');
  pushWidget(fmt(bal,cur),'+'+fmt(inS,cur),'-'+fmt(outS,cur));
  document.getElementById('filter-btn').classList.toggle('act',!!state.filter);
  const bb=document.getElementById('home-budget');
  if(db.budgets.overall>0){const sp=monthSpendByCat().total;const pct=Math.min(sp/db.budgets.overall*100,100);const over=sp>db.budgets.overall;bb.style.display='block';const fill=document.getElementById('home-budget-fill');fill.style.width=pct+'%';fill.style.background=over?'var(--expense)':pct>80?'var(--accent)':'var(--income)';const el=document.getElementById('home-budget-txt');el.innerHTML='<span class="num">'+fmt(sp,db.currency)+' / '+fmt(db.budgets.overall,db.currency)+'</span>';el.className=over?'down':'';}else bb.style.display='none';
  const al=document.getElementById('home-alert');const sp=monthSpendByCat();let ov=[];if(db.budgets.overall>0&&sp.total>db.budgets.overall)ov.push(t('overall'));Object.entries(db.budgets.cats||{}).forEach(([c,v])=>{if(v>0&&(sp[c]||0)>v)ov.push(catName(c));});const _dm=demoBanner();const zb=zakatDue()?'<div class="alert" style="background:rgba(231,178,76,.14);border-color:rgba(231,178,76,.5);color:#f0d090;align-items:center"><span style="flex:1;cursor:pointer" onclick="go(\'zakat\')">☪ '+t('zakatDueBanner')+'</span><button onclick="openPayZakat()" style="background:var(--accent);color:#1a1400;font-weight:800;font-size:12px;padding:7px 12px;border-radius:9px;white-space:nowrap;border:none">'+(db.lang==='ar'?'ادفع':'Pay')+'</button></div>':'';al.innerHTML=_dm+zb+(ov.length?'<div class="alert">⚠️ '+t('overBudgetMsg')+': '+ov.join('، ')+'</div>':'');
  const q=(document.getElementById('home-search').value||'').toLowerCase();
  renderTxList(document.getElementById('home-tx'),list.filter(x=>!q||catName(x.cat).toLowerCase().includes(q)||(x.note||'').toLowerCase().includes(q)));
}
function renderTxList(el,list){
  if(!list.length){el.innerHTML='<div class="empty"><span class="big-emo">📭</span>'+t('noTx')+'<br>'+t('tapAdd')+'</div>';return;}
  let html='',lastDay='';
  list.forEach(x=>{const d=new Date(x.date);const dk=d.toDateString();if(dk!==lastDay){lastDay=dk;html+='<div class="day-label">'+dayLabel(d)+'</div>';}
    const a=acctById(x.account);
    if(x.type==='transfer'){const to=acctById(x.toAccount);html+=`<div class="tx" onclick="openTx('${x.id}')"><div class="emo">⇄</div><div class="mid"><div class="cat">${t('transferLabel')}</div><div class="meta">${a?a.emoji+' '+esc(a.name):'—'} → ${to?to.emoji+' '+esc(to.name):'—'}</div></div><div class="amt num neu">${fmt(x.amount,a?a.currency:db.currency)}</div></div>`;}
    else if(x.type==='debt'){const inflow=(x.flow==='borrow'||x.flow==='collect');const lbl=x.flow==='lend'?t('lentTo'):x.flow==='borrow'?t('borrowedFrom'):x.flow==='collect'?t('collectedFrom'):t('repaidTo');const ic=x.flow==='lend'?'🫱':x.flow==='borrow'?'🫲':x.flow==='collect'?'🫰':'🤝';const sign=inflow?'+':'-';const col=inflow?'up':'down';html+=`<div class="tx" onclick="openDebtFromTx('${x.debtId}')"><div class="emo">${ic}</div><div class="mid"><div class="cat">${lbl}${x.person?' '+esc(x.person):''}${x.note?' · '+esc(x.note):''}</div><div class="meta">${a?a.emoji+' '+esc(a.name):'—'}</div></div><div class="amt num ${col}">${sign}${fmt(x.amount,a?a.currency:db.currency)}</div></div>`;}
    else if(x.type==='zakat'){html+=`<div class="tx" onclick="go('zakat')"><div class="emo">☪️</div><div class="mid"><div class="cat">${db.lang==='ar'?'زكاة مدفوعة':'Zakat paid'}${x.to?' · '+esc(x.to):''}</div><div class="meta">${a?a.emoji+' '+esc(a.name):'—'}</div></div><div class="amt num down">-${fmt(x.amount,a?a.currency:db.currency)}</div></div>`;}
    else{const c=CATMAP[x.cat]||CATMAP.other;const sign=x.type==='income'?'+':'-';const col=x.type==='income'?'up':'down';const emo=x.photo?`<img src="${x.photo}">`:c.e;const proj=x.project?(db.projects.find(p=>p.id===x.project)||{}).name:'';
      html+=`<div class="tx" onclick="openTx('${x.id}')"><div class="emo">${emo}</div><div class="mid"><div class="cat">${a&&isLivestock(a)?(livestockEmoji(a.kind)+' '+t('r_'+(x.reason||'bought').replace('slaught','slaught'))):catName(x.cat)}${x.note?' · '+esc(x.note):''}</div><div class="meta">${a?a.emoji+' '+esc(a.name):'—'}${proj?' · 🏗️ '+esc(proj):''}</div></div><div class="amt num ${col}">${sign}${a&&isLivestock(a)?fmtHead(x.amount):(a&&isMetal(a)?fmtG(x.amount):fmt(x.amount,a?a.currency:db.currency))}</div></div>`;}});
  el.innerHTML=html;
}
function dayLabel(d){const a=startOfDay(new Date()),b=startOfDay(d);const diff=Math.round((a-b)/864e5);if(diff===0)return t('today');if(diff===1)return t('yesterday');return d.toLocaleDateString(db.lang==='ar'?'ar-EG':undefined,{weekday:'short',day:'numeric',month:'short',year:diff>300?'numeric':undefined});}
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* ============ Trends ============ */
function rangeFor(p,offset){const now=new Date();let start,end;if(p==='week'){start=periodStart('week');start.setDate(start.getDate()-7*offset);end=new Date(start);end.setDate(end.getDate()+7);}else if(p==='month'){start=new Date(now.getFullYear(),now.getMonth()-offset,1);end=new Date(now.getFullYear(),now.getMonth()-offset+1,1);}else if(p==='year'){start=new Date(now.getFullYear()-offset,0,1);end=new Date(now.getFullYear()-offset+1,0,1);}else{start=new Date(0);end=new Date(8.64e15);}return{start,end};}
function spentInRange(r){let s=0;db.txns.forEach(x=>{if(x.type!=='expense')return;const d=new Date(x.date);if(d<r.start||d>=r.end)return;if(state.acct!=='all'&&x.account!==state.acct)return;s+=inView(x);});return s;}
function catSpendRange(r){const o={};db.txns.forEach(x=>{if(x.type!=='expense')return;const d=new Date(x.date);if(d<r.start||d>=r.end)return;if(state.acct!=='all'&&x.account!==state.acct)return;o[x.cat]=(o[x.cat]||0)+inView(x);});return o;}
function renderTrends(){
  const p=state.trPeriod,cur=viewCur();const list=txnsForTrends(p);
  let spent=0,earned=0;const byCat={};list.forEach(x=>{if(x.type==='income')earned+=inView(x);else if(x.type==='expense'){spent+=inView(x);byCat[x.cat]=(byCat[x.cat]||0)+inView(x);}});
  document.getElementById('tr-spent').textContent=fmt(spent,cur);document.getElementById('tr-earned').textContent=fmt(earned,cur);
  const net=earned-spent;const ne=document.getElementById('tr-net');ne.textContent=(net>=0?'+':'')+fmt(net,cur);ne.className='v num '+(net>=0?'up':'down');
  let days;if(p==='all'){const ds=list.map(x=>new Date(x.date).getTime());days=ds.length?Math.max(1,(Date.now()-Math.min(...ds))/864e5):1;}else days=Math.max(1,(Date.now()-periodStart(p))/864e5+1);
  document.getElementById('tr-avg').textContent=fmt(spent/days,cur);
  safe(()=>renderInsights(p,cur));safe(()=>drawTimeChart(list,p));safe(()=>drawHeatmap());safe(()=>renderBudgetPanel());safe(()=>renderProjectPanel(list,cur));
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const total=cats.reduce((s,c)=>s+c[1],0)||1;const colors=['#E7B24C','#F06A6A','#5B9BD5','#4FBF8B','#B57BE0','#E8965B','#5FB8C4','#D46A9F'];
  let ch=cats.length?'':'<div class="empty" style="padding:20px"><span class="big-emo">📊</span>'+t('noTx')+'</div>';
  cats.forEach((c,i)=>{const cat=CATMAP[c[0]]||CATMAP.other;const pct=Math.round(c[1]/total*100);ch+=`<div class="catbar" onclick="openDrill('spent','${c[0]}')"><div class="top"><span class="l">${cat.e} ${catName(c[0])}</span><span class="num">${fmt(c[1],cur)}<span class="pct">${pct}%</span></span></div><div class="track"><div class="fill" style="width:${pct}%;background:${colors[i%colors.length]}"></div></div></div>`;});
  document.getElementById('tr-cats').innerHTML=ch;
}
function txnsForTrends(p){const start=periodStart(p);return db.txns.filter(x=>{if(state.acct!=='all'&&x.account!==state.acct&&x.toAccount!==state.acct)return false;return new Date(x.date)>=start;});}
function renderInsights(p,cur){const el=document.getElementById('tr-insights');if(p==='all'){el.innerHTML='<div class="insight">'+t('noPrev')+'</div>';return;}
  const cur0=spentInRange(rangeFor(p,0)),prev=spentInRange(rangeFor(p,1));let html='';
  if(prev<=0){html+='<div class="insight">'+t('noPrev')+'</div>';}
  else{const diff=(cur0-prev)/prev*100;const up=diff>=0;html+=`<div class="insight"><span class="ico">${up?'📈':'📉'}</span><div>${t('spent')} <b class="${up?'down':'up'}">${Math.abs(diff).toFixed(0)}% ${up?(db.lang==='ar'?'أكثر':'more'):(db.lang==='ar'?'أقل':'less')}</b> ${t('vsPrev')} <span class="num">(${fmt(cur0,cur)} vs ${fmt(prev,cur)})</span></div></div>`;}
  const c0=catSpendRange(rangeFor(p,0)),c1=catSpendRange(rangeFor(p,1));let topCat=null,topDiff=-1;Object.keys(c0).forEach(c=>{const d=c0[c]-(c1[c]||0);if(d>topDiff){topDiff=d;topCat=c;}});
  if(topCat&&topDiff>0){const cc=CATMAP[topCat]||CATMAP.other;html+=`<div class="insight"><span class="ico">${cc.e}</span><div><b>${catName(topCat)}</b> ${db.lang==='ar'?'زاد أكثر':'rose the most'} <span class="num down">+${fmt(topDiff,cur)}</span></div></div>`;}
  el.innerHTML=html||'<div class="insight">'+t('noPrev')+'</div>';
}
function renderBudgetPanel(){const el=document.getElementById('tr-budgets');const sp=monthSpendByCat();const items=[];if(db.budgets.overall>0)items.push(['__o',db.budgets.overall,sp.total,t('overall'),'★']);Object.entries(db.budgets.cats||{}).forEach(([c,v])=>{if(v>0)items.push([c,v,sp[c]||0,catName(c),(CATMAP[c]||CATMAP.other).e]);});if(!items.length){el.innerHTML='<div class="psub">'+t('noBudget')+'</div>';return;}let html='';items.forEach(([id,lim,used,name,emo])=>{const pct=Math.min(used/lim*100,100);const over=used>lim;const rem=lim-used;const col=over?'var(--expense)':pct>80?'var(--accent)':'var(--income)';html+=`<div class="catbar"><div class="top"><span class="l">${emo} ${name}</span><span class="num" style="color:${over?'var(--expense)':'var(--muted)'}">${over?fmt(rem,db.currency)+' '+t('over'):fmt(rem,db.currency)+' '+t('left')}</span></div><div class="track"><div class="fill" style="width:${pct}%;background:${col}"></div></div></div>`;});el.innerHTML=html;}

function drawTimeChart(list,p){const sub=document.getElementById('tr-chart-sub'),el=document.getElementById('tr-chart');const exp=list.filter(x=>x.type==='expense');if(!exp.length){el.innerHTML='<div class="empty" style="padding:16px 0">—</div>';sub.textContent='—';return;}let buckets=[],labels=[];const now=new Date();

function dayTotals(y,m){
  const o={};db.txns.forEach(x=>{if(x.type!=='expense')return;const d=new Date(x.date);
    if(d.getFullYear()!==y||d.getMonth()!==m)return;
    if(state.acct!=='all'&&x.account!==state.acct)return;
    const a=acctById(x.account);if(isLivestock(a))return;
    o[d.getDate()]=(o[d.getDate()]||0)+inView(x);});
  return o;}
function heatShift(n){state.heatOff=(state.heatOff||0)+n;renderTrends();}
function drawHeatmap(){
  const el=document.getElementById('tr-heat');const cur=viewCur();
  const base=new Date();base.setDate(1);base.setMonth(base.getMonth()-(state.heatOff||0));
  const y=base.getFullYear(),m=base.getMonth();
  const dim=new Date(y,m+1,0).getDate();
  const wkStart=(db.ui&&db.ui.wk)==='sun'?0:((db.ui&&db.ui.wk)==='sat'?6:1);
  const firstDow=(new Date(y,m,1).getDay()-wkStart+7)%7;
  const spend=dayTotals(y,m);
  const vals=Object.values(spend);const max=Math.max(...vals,1);
  const total=vals.reduce((a,b)=>a+b,0);
  const activeDays=vals.length;
  const WD=db.lang==='ar'?['ح','ن','ث','ر','خ','ج','س']:['S','M','T','W','T','F','S'];
  const wd=[];for(let i=0;i<7;i++)wd.push(WD[(wkStart+i)%7]);
  const today=new Date();const isThisMonth=(today.getFullYear()===y&&today.getMonth()===m);
  let cells=wd.map(d=>'<div class="cal-hd">'+d+'</div>').join('');
  for(let i=0;i<firstDow;i++)cells+='<div class="cal-pad"></div>';
  for(let day=1;day<=dim;day++){
    const v=spend[day]||0;const int=v/max;
    const lvl=v<=0?0:(int<=0.25?1:int<=0.5?2:int<=0.75?3:4);
    const isToday=isThisMonth&&today.getDate()===day;
    const iso=toISODate(new Date(y,m,day));
    cells+='<button class="cal-cell l'+lvl+(isToday?' today':'')+'" onclick="openDayDrill(\''+iso+'\')">'
      +'<span class="cd">'+day+'</span>'+(v>0?'<span class="cv">'+shortNum(v)+'</span>':'')+'</button>';
  }
  const monthName=base.toLocaleDateString(db.lang==='ar'?'ar-EG':undefined,{month:'long',year:'numeric'});
  let best=null;Object.entries(spend).forEach(([d,v])=>{if(!best||v>best[1])best=[d,v];});
  el.innerHTML='<div class="cal-nav"><button onclick="heatShift(1)">\u2039</button><div class="cal-title">'+monthName+'</div>'
    +'<button onclick="heatShift(-1)" '+((state.heatOff||0)<=0?'disabled':'')+'>\u203a</button></div>'
    +'<div class="cal-grid">'+cells+'</div>'
    +'<div class="cal-legend"><span>'+t('legendLess')+'</span><i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>'+t('legendMore')+'</span></div>'
    +'<div class="cal-stats">'
      +'<div><div class="k">'+t('spent')+'</div><div class="v num">'+fmt(total,cur)+'</div></div>'
      +'<div><div class="k">'+t('busiestDay')+'</div><div class="v num">'+(best?best[0]+' \u00b7 '+fmt(best[1],cur):'\u2014')+'</div></div>'
      +'<div><div class="k">'+t('quietDays')+'</div><div class="v num">'+(dim-activeDays)+'</div></div>'
      +'<div><div class="k">'+t('avgPerActive')+'</div><div class="v num">'+(activeDays?fmt(total/activeDays,cur):'\u2014')+'</div></div>'
    +'</div>';
  const sub=document.getElementById('tr-heat-sub');if(sub)sub.textContent='';
}
function shortNum(v){const a=Math.abs(v);if(a>=1e6)return (v/1e6).toFixed(1)+'M';if(a>=1000)return Math.round(v/1000)+'k';return Math.round(v);}
function openDayDrill(iso){

/* ============ Transaction sheet ============ */
function openTx(id,prefill){state.editingTx=id||null;state.txPhoto=null;
  const accSel=document.getElementById('tx-account'),toSel=document.getElementById('tx-to-account'),projSel=document.getElementById('tx-project');
  const opts=db.accounts.map(a=>`<option value="${a.id}">${a.emoji} ${esc(a.name)}</option>`).join('');accSel.innerHTML=opts;toSel.innerHTML=opts;accSel.onchange=txAcctChanged;
  projSel.innerHTML='<option value="">'+t('none')+'</option>'+db.projects.map(p=>`<option value="${p.id}">🏗️ ${esc(p.name)}</option>`).join('');
  const src=id?db.txns.find(x=>x.id===id):prefill;
  if(id||prefill){state.txType=src.type;state.txCat=src.cat||'food';document.getElementById('tx-amount').value=src.amount;document.getElementById('tx-note').value=(src.note||'').replace(' ↻','');document.getElementById('tx-date').value=id?src.date.slice(0,10):toISODate(new Date());accSel.value=src.account;if(src.toAccount)toSel.value=src.toAccount;projSel.value=src.project||'';state.txPhoto=src.photo||null;}
  else{state.txType='expense';state.txCat='food';document.getElementById('tx-amount').value='';document.getElementById('tx-note').value='';document.getElementById('tx-date').value=toISODate(new Date());if(state.acct!=='all')accSel.value=state.acct;projSel.value='';}
  document.getElementById('tx-title').textContent=t(id?'editTx':'newTx');
  document.getElementById('tx-delete').style.display=id?'block':'none';document.getElementById('tx-dup').style.display=id?'block':'none';
  renderTxCats(state.txCat);
  renderPhoto();applyTxType();txAcctChanged();document.getElementById('tx-overlay').classList.add('open');setTimeout(()=>document.getElementById('tx-amount').focus(),300);}
function renderTxCats(sel){document.getElementById('tx-cats').innerHTML=allCats().map(c=>`<button class="cat-opt${c.id===sel?' on':''}" data-c="${c.id}" onclick="pickCat('${c.id}')"><span class="ce">${c.e}</span>${catName(c.id)}</button>`).join('')+`<button class="cat-opt" style="border-style:dashed;color:var(--accent)" onclick="openCat('tx')"><span class="ce">＋</span>${db.lang==='ar'?'جديد':'New'}</button>`;}
function txAcctChanged(){
  const a=acctById(document.getElementById('tx-account').value);
  const m=isMetal(a),lv=isLivestock(a);
  const amt=document.getElementById('tx-amount');amt.placeholder=lv?t('headUnit'):(m?t('addGrams'):'0.00');
  const h=document.getElementById('tx-gram-hint');if(h){h.style.display=(m||lv)?'block':'none';h.textContent=lv?t('headHelp'):t('metalHelp');}
  document.getElementById('tx-reason-field').style.display=lv?'block':'none';
  document.getElementById('tx-cost-field').style.display=lv?'block':'none';
  if(lv)fillReasons();
}
function fillReasons(){
  const inc=state.txType!=='expense';
  const opts=inc?[['bought','r_bought'],['born','r_born'],['gift','r_gift']]:[['sold','r_sold'],['died','r_died'],['slaught','r_slaught']];
  const sel=document.getElementById('tx-reason');
  sel.innerHTML=opts.map(([v,k])=>'<option value="'+v+'">'+t(k)+'</option>').join('');
  sel.onchange=reasonNote;reasonNote();
}
function reasonNote(){const v=document.getElementById('tx-reason').value;document.getElementById('tx-reason-note').textContent=(v==='born')?t('bornNote'):'';}
function applyTxType(){document.querySelectorAll('#tx-type button').forEach(b=>b.classList.toggle('on',b.dataset.t===state.txType));const isT=state.txType==='transfer';document.getElementById('tx-cat-field').style.display=isT?'none':'block';document.getElementById('tx-to-field').style.display=isT?'block':'none';document.getElementById('tx-note-field').style.display=isT?'none':'block';document.getElementById('tx-project-field').style.display=isT?'none':'block';document.getElementById('tx-photo-wrap').style.display=isT?'none':'block';document.getElementById('tx-account-lbl').textContent=isT?t('from'):t('account');}
function pickCat(id){state.txCat=id;document.querySelectorAll('#tx-cats .cat-opt').forEach(b=>b.classList.toggle('on',b.dataset.c===id));}
document.querySelectorAll('#tx-type button').forEach(b=>b.onclick=()=>{if(b.dataset.t==='debt'){document.getElementById('tx-overlay').classList.remove('open');openDebt();return;}state.txType=b.dataset.t;applyTxType();txAcctChanged();});
function onPhoto(ev){if(!requirePremium('photo')){ev.target.value='';return;}const f=ev.target.files[0];if(!f)return;if(!f.type||f.type.indexOf('image')!==0){toast(db.lang==='ar'?'اختر صورة':'Please pick an image');return;}compressImage(f,d=>{state.txPhoto=d;renderPhoto();toast('✓ '+(db.lang==='ar'?'أُضيفت الصورة':'Photo added'));});ev.target.value='';}
function compressImage(file,cb){const rd=new FileReader();rd.onerror=()=>toast(db.lang==='ar'?'تعذّر قراءة الملف':'Could not read file');rd.onload=()=>{const img=new Image();img.onerror=()=>toast(db.lang==='ar'?'تعذّر تحميل الصورة':'Could not load image');img.onload=()=>{try{const max=900;let w=img.width,h=img.height;if(w>h&&w>max){h*=max/w;w=max;}else if(h>max){w*=max/h;h=max;}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',0.55));}catch(e){toast('Image error');}};img.src=rd.result;};rd.readAsDataURL(file);}
function renderPhoto(){const img=document.getElementById('tx-photo'),rm=document.getElementById('tx-photo-remove');if(state.txPhoto){img.src=state.txPhoto;img.style.display='block';rm.style.display='block';}else{img.style.display='none';rm.style.display='none';}}
function removePhoto(){state.txPhoto=null;renderPhoto();}
function saveTx(){const amt=parseFloat(document.getElementById('tx-amount').value);if(!amt||amt<=0){toast(db.lang==='ar'?'أدخل المبلغ':'Enter an amount');return;}const from=document.getElementById('tx-account').value;let obj;
  if(state.txType==='transfer'){const to=document.getElementById('tx-to-account').value;if(from===to){toast(db.lang==='ar'?'حسابين مختلفين':'Pick two different accounts');return;}obj={type:'transfer',amount:amt,account:from,toAccount:to,cat:'other',date:document.getElementById('tx-date').value,note:''};}
  else{obj={type:state.txType,amount:amt,cat:state.txCat,account:from,date:document.getElementById('tx-date').value,note:document.getElementById('tx-note').value.trim(),project:document.getElementById('tx-project').value||null,photo:state.txPhoto||null};const _fa=acctById(from);if(isLivestock(_fa)){obj.reason=document.getElementById('tx-reason').value;obj.cost=parseFloat(document.getElementById('tx-cost').value)||0;obj.amount=Math.round(amt);}}
  let ref;
  if(state.editingTx){ref=db.txns.find(x=>x.id===state.editingTx);Object.assign(ref,obj);}else{obj.id=uid();obj.created=Date.now();db.txns.push(obj);ref=obj;}
  let ok=save(true),msg='✓ '+t('txSaved');
  if(!ok&&ref.photo){ref.photo=null;ok=save(true);if(ok)msg=db.lang==='ar'?'✓ حُفظت بدون الصورة (الذاكرة ممتلئة)':'✓ Saved without photo — storage full';}
  if(ok){closeSheets();toast(msg);refresh();}else{toast(db.lang==='ar'?'تعذّر الحفظ':'Could not save');}}
function duplicateTx(){const src=db.txns.find(x=>x.id===state.editingTx);const copy=Object.assign({},src);copy.id=uid();copy.created=Date.now();copy.date=toISODate(new Date());db.txns.push(copy);save();closeSheets();toast('✓');refresh();}
function repeatLast(){const last=[...db.txns].filter(x=>x.type!=='transfer').sort((a,b)=>(b.created||0)-(a.created||0))[0];if(!last){toast(t('noTx'));return;}openTx(null,last);}
function deleteTx(){if(!confirm(t('deleteTx')+'?'))return;db.txns=db.txns.filter(x=>x.id!==state.editingTx);save();closeSheets();toast('✓ '+t('deleted'));refresh();}

/* ============ Filter ============ */
function openFilter(){if(!requirePremium('filter'))return;const s=document.getElementById('f-cat');s.innerHTML='<option value="">'+t('anyCat')+'</option>'+allCats().map(c=>`<option value="${c.id}">${c.e} ${catName(c.id)}</option>`).join('');const f=state.filter||{};document.getElementById('f-from').value=f.from||'';document.getElementById('f-to').value=f.to||'';document.getElementById('f-min').value=f.min!=null?f.min:'';document.getElementById('f-max').value=f.max!=null?f.max:'';s.value=f.cat||'';document.getElementById('filter-overlay').classList.add('open');}

/* ============ Account sheet ============ */
function openAccount(id){state.editingAcct=id||null;document.getElementById('acct-title').textContent=t(id?'editAccount':'newAccount');const w=document.getElementById('acct-emojis');if(id){const a=acctById(id);state.acctEmoji=a.emoji;document.getElementById('acct-name').value=a.name;document.getElementById('acct-currency').innerHTML=currOptions(a.currency);document.getElementById('acct-kind').value=a.kind||'cash';document.getElementById('acct-graze').checked=a.grazing!==false;document.getElementById('acct-karat').value=a.karat||24;document.getElementById('acct-start').value=a.start||0;document.getElementById('acct-delete').style.display=db.accounts.length>1?'block':'none';}else{state.acctEmoji='💵';document.getElementById('acct-name').value='';document.getElementById('acct-currency').innerHTML=currOptions(db.currency);document.getElementById('acct-start').value='';document.getElementById('acct-delete').style.display='none';}w.innerHTML=ACCT_EMOJIS.map(e=>`<button class="${e===state.acctEmoji?'on':''}" onclick="pickAcctEmoji('${e}')">${e}</button>`).join('');acctKindChanged();document.getElementById('acct-overlay').classList.add('open');}
function acctKindChanged(){const k=document.getElementById('acct-kind').value;const live=(k==='camels'||k==='cattle'||k==='sheep');const nonCash=k!=='cash';document.getElementById('acct-karat-field').style.display=k==='gold'?'block':'none';document.getElementById('acct-graze-field').style.display=live?'block':'none';document.getElementById('acct-currency').parentElement.style.display=nonCash?'none':'block';const sb=document.getElementById('acct-start');if(sb)sb.parentElement.querySelector('label').textContent=live?t('headCount').replace('{n} ',''):t('startBal');}
function pickAcctEmoji(e){state.acctEmoji=e;document.querySelectorAll('#acct-emojis button').forEach(b=>b.classList.toggle('on',b.textContent===e));}
function saveAccount(){const _knd=document.getElementById('acct-kind').value;if(!state.editingAcct&&!isPremium()&&_knd==='cash'&&db.accounts.filter(a=>a.kind==='cash').length>=FREE_ACCOUNTS){openPaywall('accounts');return;}const name=document.getElementById('acct-name').value.trim();if(!name){toast(t('name'));return;}const cur=document.getElementById('acct-currency').value;const kind=document.getElementById('acct-kind').value;const obj={name,emoji:state.acctEmoji,currency:cur,kind,grazing:document.getElementById('acct-graze').checked,karat:parseInt(document.getElementById('acct-karat').value)||24,start:parseFloat(document.getElementById('acct-start').value)||0};if(state.editingAcct)Object.assign(acctById(state.editingAcct),obj);else{obj.id=uid();db.accounts.push(obj);}if(db.rates[cur]==null)db.rates[cur]=1;save();closeSheets();toast('✓');refresh();}
function deleteAccount(){if(db.accounts.length<=1){toast('!');return;}if(!confirm(t('deleteAccount')+'?'))return;db.txns=db.txns.filter(x=>x.account!==state.editingAcct&&x.toAccount!==state.editingAcct);db.accounts=db.accounts.filter(a=>a.id!==state.editingAcct);if(state.acct===state.editingAcct)state.acct='all';save();closeSheets();toast('✓ '+t('deleted'));refresh();}

function openBudget(){const el=document.getElementById('budget-inputs');let html=`<div class="bud-row"><div class="bl">★ ${t('overall')}</div><input class="num" id="bud-overall" type="text" inputmode="decimal" value="${db.budgets.overall||''}" placeholder="0"></div>`;allCats().filter(c=>c.id!=='salary').forEach(c=>{html+=`<div class="bud-row"><div class="bl">${c.e} ${catName(c.id)}</div><input class="num" data-cat="${c.id}" type="text" inputmode="decimal" value="${(db.budgets.cats&&db.budgets.cats[c.id])||''}" placeholder="0"></div>`;});el.innerHTML=html;document.getElementById('budget-overlay').classList.add('open');}

/* ============ Recurring ============ */
function openRecurring(id){state.editingRec=id||null;document.getElementById('rec-title').textContent=t(id?'editRec':'newRec');document.getElementById('rec-account').innerHTML=db.accounts.map(a=>`<option value="${a.id}">${a.emoji} ${esc(a.name)}</option>`).join('');if(id){const r=db.recurring.find(x=>x.id===id);state.recType=r.type;state.recCat=r.cat;document.getElementById('rec-amount').value=r.amount;document.getElementById('rec-account').value=r.account;document.getElementById('rec-freq').value=r.freq;document.getElementById('rec-next').value=r.nextDate;document.getElementById('rec-note').value=(r.note||'').replace(' ↻','');document.getElementById('rec-delete').style.display='block';}else{state.recType='expense';state.recCat='bills';document.getElementById('rec-amount').value='';document.getElementById('rec-note').value='';document.getElementById('rec-freq').value='monthly';document.getElementById('rec-next').value=toISODate(new Date());document.getElementById('rec-delete').style.display='none';}document.querySelectorAll('#rec-type button').forEach(b=>b.classList.toggle('on',b.dataset.t===state.recType));renderRecCats(state.recCat);document.getElementById('recurring-overlay').classList.add('open');}
function renderRecCats(sel){document.getElementById('rec-cats').innerHTML=allCats().map(c=>`<button class="cat-opt${c.id===sel?' on':''}" data-c="${c.id}" onclick="pickRecCat('${c.id}')"><span class="ce">${c.e}</span>${catName(c.id)}</button>`).join('')+`<button class="cat-opt" style="border-style:dashed;color:var(--accent)" onclick="openCat('rec')"><span class="ce">＋</span>${db.lang==='ar'?'جديد':'New'}</button>`;}
function pickRecCat(id){state.recCat=id;document.querySelectorAll('#rec-cats .cat-opt').forEach(b=>b.classList.toggle('on',b.dataset.c===id));}
document.querySelectorAll('#rec-type button').forEach(b=>b.onclick=()=>{state.recType=b.dataset.t;document.querySelectorAll('#rec-type button').forEach(x=>x.classList.toggle('on',x===b));});
function saveRecurring(){const amt=parseFloat(document.getElementById('rec-amount').value);if(!amt||amt<=0){toast('!');return;}const obj={type:state.recType,amount:amt,cat:state.recCat,account:document.getElementById('rec-account').value,freq:document.getElementById('rec-freq').value,nextDate:document.getElementById('rec-next').value,note:document.getElementById('rec-note').value.trim(),active:true};if(state.editingRec)Object.assign(db.recurring.find(x=>x.id===state.editingRec),obj);else{obj.id=uid();db.recurring.push(obj);}save();processRecurring();closeSheets();toast('✓');refresh();}
function deleteRecurring(){if(!confirm(t('deleteRec')+'?'))return;db.recurring=db.recurring.filter(r=>r.id!==state.editingRec);save();closeSheets();toast('✓');refresh();}

function openGoal(id){state.editingGoal=id||null;document.getElementById('goal-title').textContent=t(id?'editTx':'addGoal').replace('+ ','');const w=document.getElementById('goal-emojis');if(id){const g=db.goals.find(x=>x.id===id);state.goalEmoji=g.emoji;document.getElementById('goal-name').value=g.name;document.getElementById('goal-target').value=g.target;document.getElementById('goal-delete').style.display='block';}else{state.goalEmoji='🎯';document.getElementById('goal-name').value='';document.getElementById('goal-target').value='';document.getElementById('goal-delete').style.display='none';}w.innerHTML=GOAL_EMOJIS.map(e=>`<button class="${e===state.goalEmoji?'on':''}" onclick="pickGoalEmoji('${e}')">${e}</button>`).join('');document.getElementById('goal-overlay').classList.add('open');}
function pickGoalEmoji(e){state.goalEmoji=e;document.querySelectorAll('#goal-emojis button').forEach(b=>b.classList.toggle('on',b.textContent===e));}
function saveGoal(){const name=document.getElementById('goal-name').value.trim();const target=parseFloat(document.getElementById('goal-target').value);if(!name||!target){toast('!');return;}if(state.editingGoal){const g=db.goals.find(x=>x.id===state.editingGoal);g.name=name;g.target=target;g.emoji=state.goalEmoji;}else db.goals.push({id:uid(),name,target,emoji:state.goalEmoji,saved:0});save();closeSheets();toast('✓');refresh();}
function deleteGoal(){if(!confirm('?'))return;db.goals=db.goals.filter(g=>g.id!==state.editingGoal);save();closeSheets();toast('✓');refresh();}
function openPay(id){state.payDebt=id;const d=db.debts.find(x=>x.id===id);const rem=debtRemaining(d);
  document.getElementById('pay-title').textContent=t('payment')+' · '+d.person;
  document.getElementById('pay-sub').textContent=t('remaining')+': '+fmt(rem,db.currency)+' '+t('of')+' '+fmt(d.amount,db.currency);
  document.getElementById('pay-amount').value='';
  document.getElementById('pay-date').value=toISODate(new Date());
  document.getElementById('pay-note').value='';
  const owed=d.type==='owed_to_me';const pa=document.getElementById('pay-account');const cashAccts=db.accounts.filter(a=>!isMetal(a)&&!isLivestock(a));pa.innerHTML=cashAccts.map(a=>`<option value="${a.id}">${a.emoji} ${esc(a.name)}</option>`).join('');if(d.account&&cashAccts.some(a=>a.id===d.account))pa.value=d.account;document.getElementById('pay-acct-lbl').textContent=owed?t('toAccountL'):t('fromAccount');document.getElementById('pay-acct-field').style.display=cashAccts.length?'block':'none';
  renderPayHistory(d);
  document.getElementById('pay-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('pay-amount').focus(),300);}
function renderPayHistory(d){const el=document.getElementById('pay-history');const ps=(d.payments||[]).slice().reverse();
  if(!ps.length){el.innerHTML='<div class="mini-help">'+t('noPayments')+'</div>';return;}
  el.innerHTML='<div class="sec-head" style="margin:18px 2px 8px"><h3>'+t('payments')+'</h3></div>'+ps.map(p=>`<div class="list-row" style="margin-bottom:8px"><div class="info"><div class="t1 num">${fmt(p.amount,db.currency)}</div><div class="t2">${p.date?new Date(p.date).toLocaleDateString(db.lang==='ar'?'ar-EG':undefined,{day:'numeric',month:'short',year:'numeric'}):''}${p.note?' · '+esc(p.note):''}</div></div><button class="link" style="color:var(--expense)" onclick="undoPayment('${p.id}')">✕</button></div>`).join('');}
function payAll(){const d=db.debts.find(x=>x.id===state.payDebt);document.getElementById('pay-amount').value=debtRemaining(d);}
function savePayment(){const d=db.debts.find(x=>x.id===state.payDebt);const amt=parseFloat(document.getElementById('pay-amount').value);
  if(!amt||amt<=0){toast(db.lang==='ar'?'أدخل المبلغ':'Enter an amount');return;}
  const rem=debtRemaining(d);
  if(amt>rem+0.0001){toast(t('tooMuch')+': '+fmt(rem,db.currency));return;}
  const pdate=document.getElementById('pay-date').value||toISODate(new Date());
  const paField=document.getElementById('pay-account');const pacct=(paField&&paField.value)?paField.value:(d.account||null);const _pid=uid();d.payments=d.payments||[];d.payments.push({id:_pid,amount:amt,date:pdate,note:document.getElementById('pay-note').value.trim(),account:pacct});
  if(pacct){const pflow=d.type==='owed_to_me'?'collect':'repay';db.txns.push({id:uid(),created:Date.now(),type:'debt',flow:pflow,debtId:d.id,payId:_pid,amount:amt,account:pacct,person:d.person,date:pdate,note:''});}
  d.payments.sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(debtRemaining(d)<=0.0001)d.settled=true;
  save();
  if(d.settled){closeSheets();toast('🎉 '+t('fullyPaid'));}
  else{document.getElementById('pay-sub').textContent=t('remaining')+': '+fmt(debtRemaining(d),db.currency)+' '+t('of')+' '+fmt(d.amount,db.currency);document.getElementById('pay-amount').value='';document.getElementById('pay-note').value='';document.getElementById('pay-date').value=toISODate(new Date());renderPayHistory(d);toast('✓ '+fmt(amt,db.currency));}
  renderGoals();}
function undoPayment(pid){const d=db.debts.find(x=>x.id===state.payDebt);db.txns=db.txns.filter(x=>!(x.type==='debt'&&x.payId===pid));d.payments=(d.payments||[]).filter(p=>p.id!==pid);if(debtRemaining(d)>0.0001)d.settled=false;save();
  document.getElementById('pay-sub').textContent=t('remaining')+': '+fmt(debtRemaining(d),db.currency)+' '+t('of')+' '+fmt(d.amount,db.currency);renderPayHistory(d);renderGoals();toast('✓');}
function openContrib(id){state.contribGoal=id;document.getElementById('contrib-amount').value='';document.getElementById('contrib-overlay').classList.add('open');setTimeout(()=>document.getElementById('contrib-amount').focus(),300);}
function saveContrib(){const amt=parseFloat(document.getElementById('contrib-amount').value);if(!amt){toast('!');return;}const g=db.goals.find(x=>x.id===state.contribGoal);g.saved=(g.saved||0)+amt;save();closeSheets();if(g.saved>=g.target)toast('🎉 '+t('reached'));else toast('✓');refresh();}

/* ============ Debts ============ */
function debtTypeChanged(){const owed=state.debtType==='owed_to_me';const l=document.getElementById('debt-acct-lbl');if(l)l.textContent=owed?t('fromAccount'):t('toAccountL');const dr=document.getElementById('debt-doubtful-row');if(dr)dr.style.display=owed?'flex':'none';}
function openDebtFromTx(id){const d=db.debts.find(x=>x.id===id);if(d)openDebt(id);}
function openDebt(id){state.editingDebt=id||null;document.getElementById('debt-title').textContent=t(id?'editTx':'addDebt').replace('+ ','');const cashAccts=db.accounts.filter(a=>!isMetal(a)&&!isLivestock(a));const asel=document.getElementById('debt-account');asel.innerHTML=cashAccts.map(a=>`<option value="${a.id}">${a.emoji} ${esc(a.name)}</option>`).join('');document.getElementById('debt-acct-field').style.display=cashAccts.length?'block':'none';if(id){const d=db.debts.find(x=>x.id===id);state.debtType=d.type;document.getElementById('debt-person').value=d.person;document.getElementById('debt-amount').value=d.amount;document.getElementById('debt-note').value=d.note||'';document.getElementById('debt-doubtful').checked=!!d.doubtful;if(d.account)asel.value=d.account;document.getElementById('debt-delete').style.display='block';document.getElementById('debt-delete').textContent=t('deleteTx');}else{state.debtType='owed_to_me';document.getElementById('debt-person').value='';document.getElementById('debt-amount').value='';document.getElementById('debt-note').value='';document.getElementById('debt-doubtful').checked=false;if(state.acct!=='all'&&cashAccts.some(a=>a.id===state.acct))asel.value=state.acct;document.getElementById('debt-delete').style.display='none';}document.querySelectorAll('#debt-type button').forEach(b=>b.classList.toggle('on',b.dataset.t===state.debtType));debtTypeChanged();document.getElementById('debt-overlay').classList.add('open');}
document.querySelectorAll('#debt-type button').forEach(b=>b.onclick=()=>{state.debtType=b.dataset.t;document.querySelectorAll('#debt-type button').forEach(x=>x.classList.toggle('on',x===b));debtTypeChanged();});
function saveDebt(){const person=document.getElementById('debt-person').value.trim();const amount=parseFloat(document.getElementById('debt-amount').value);if(!person||!amount){toast('!');return;}const asel=document.getElementById('debt-account');const account=(asel&&asel.value)?asel.value:null;const doubtful=state.debtType==='owed_to_me'&&document.getElementById('debt-doubtful').checked;const flow=state.debtType==='owed_to_me'?'lend':'borrow';const note=document.getElementById('debt-note').value.trim();if(state.editingDebt){const d=db.debts.find(x=>x.id===state.editingDebt);d.type=state.debtType;d.person=person;d.amount=amount;d.note=note;d.doubtful=doubtful;d.payments=d.payments||[];d.settled=debtRemaining(d)<=0.0001;const pr=db.txns.find(x=>x.type==='debt'&&x.debtId===d.id&&x.principal);if(pr){pr.amount=amount;pr.flow=flow;pr.person=person;if(account)pr.account=account;d.account=pr.account;}}else{const id=uid();db.debts.push({id,type:state.debtType,person,amount,note,doubtful,settled:false,payments:[],account:account||null});if(account){db.txns.push({id:uid(),created:Date.now(),type:'debt',flow,debtId:id,principal:true,amount,account,person,date:toISODate(new Date()),note:''});}}save();closeSheets();toast('✓');refresh();}
function deleteDebt(){if(!confirm(t('deleteTx')+'?'))return;db.txns=db.txns.filter(x=>!(x.type==='debt'&&x.debtId===state.editingDebt));db.debts=db.debts.filter(x=>x.id!==state.editingDebt);save();closeSheets();toast('✓ '+t('deleted'));refresh();}

/* ============ Security (PIN) ============ */
function hashPin(p){let h=5381;for(const ch of p)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return ''+h;}
function togglePin(){if(db.pin){if(confirm(t('removePin')+'?')){db.pin=null;save();renderSettings();toast('✓');}}else{const p=prompt(t('setPin')+' (4+ digits)');if(p&&p.length>=4){db.pin=hashPin(p);save();renderSettings();toast('✓');}}}
function lockNow(){state.pinBuf='';renderDots();document.getElementById('lock').classList.add('open');}
function buildPad(){const pad=document.getElementById('pin-pad');const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];pad.innerHTML=keys.map(k=>k===''?'<div></div>':`<button class="${k==='⌫'?'wide':''}" onclick="pinKey('${k}')">${k}</button>`).join('');}
function renderDots(){const d=document.getElementById('pin-dots');d.innerHTML='';for(let i=0;i<Math.max(4,state.pinBuf.length);i++){const s=document.createElement('div');s.className='dot'+(i<state.pinBuf.length?' f':'');d.appendChild(s);}}
function pinKey(k){if(k==='⌫'){state.pinBuf=state.pinBuf.slice(0,-1);}else{state.pinBuf+=k;}renderDots();if(state.pinBuf.length>=4&&hashPin(state.pinBuf)===db.pin){document.getElementById('lock').classList.remove('open');state.pinBuf='';}else if(state.pinBuf.length>=8){state.pinBuf='';renderDots();toast(t('wrongPin'));}}

/* ============ Backup / export ============ */
function exportData(){dl(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'ledger-backup-'+toISODate(new Date())+'.json','application/json');}
async function shareBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const file=new File([blob],'ledger-backup.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Yusr backup'});}catch(e){}}else exportData();}
function exportCSV(){if(!requirePremium('csv'))return;let rows=[['Date','Type','Category','Account','ToAccount','Project','Amount','Currency','Note']];db.txns.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(x=>{const a=acctById(x.account);const to=acctById(x.toAccount);const pr=db.projects.find(p=>p.id===x.project);rows.push([x.date,x.type,(x.type==='transfer'||x.type==='debt')?(x.type==='debt'?(x.flow||''):''):catName(x.cat),a?a.name:'',to?to.name:'',pr?pr.name:'',x.amount,a?a.currency:db.currency,(x.note||'').replace(/,/g,';')]);});const csv=rows.map(r=>r.join(',')).join('\n');dl(new Blob(['\ufeff'+csv],{type:'text/csv'}),'ledger-'+toISODate(new Date())+'.csv','text/csv');}
function dl(blob,name,mime){
  if(window.Android&&window.Android.saveFile){
    const rd=new FileReader();
    rd.onload=()=>{try{const b64=rd.result.split(',')[1];window.Android.saveFile(name,b64,mime||'application/octet-stream');toast('\u2713 '+t('savedDownloads'));}catch(e){toast('Save failed');}};
    rd.readAsDataURL(blob);return;
  }
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast('\u2713');}catch(e){toast('Save failed');}
}

function invoicePaidSum(v){return (v.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);}
function invoiceRemaining(v){return Math.max(invoiceTotal(v).total-invoicePaidSum(v),0);}
function invStatus(v){const paid=invoicePaidSum(v),tot=invoiceTotal(v).total;if(paid>=tot-0.001&&paid>0)return 'paid';if(paid>0)return 'partial';return 'unpaid';}

/* ============ Zakat ============ */
function nisab(){const z=db.zakat;if(z.nisabBasis==='silver')return (z.silverPrice||0)*595;if(z.nisabBasis==='lower')return nisabLower();return nisabGoldAt(nisabCarat());}
function jewelryValue(){const z=db.zakat;return z.jewelryZakat?((z.jewelryGrams||0)*((z.jewelryKarat||24)/24)*(z.goldPrice||0)):0;}
function zakatIncluded(a){return a && !(db.zakat.excluded||[]).includes(a.id);}
function zakatCashTotal(){return db.accounts.filter(a=>zakatIncluded(a)&&!isMetal(a)).reduce((s,a)=>s+toDefault(accountBalance(a.id),a.currency),0);}
function zakatMetalValue(kind){return db.accounts.filter(a=>zakatIncluded(a)&&a.kind===kind).reduce((s,a)=>s+metalValue(a),0);}
function debtRemainingSum(type){return db.debts.filter(d=>d.type===type&&!d.settled&&!(type==='owed_to_me'&&d.doubtful)).reduce((s,d)=>s+debtRemaining(d),0);}
function zakatBreakdown(){const z=db.zakat;const cash=zakatCashTotal();const goldV=(z.goldGrams||0)*((z.goldKarat||24)/24)*(z.goldPrice||0)+zakatMetalValue('gold')+jewelryValue();const silverV=(z.silverGrams||0)*(z.silverPrice||0)+zakatMetalValue('silver');const recv=z.includeReceivables?debtRemainingSum('owed_to_me'):0;const owe=debtDeduction();return {cash,goldV,silverV,recv,owe,net:cash+goldV+silverV+recv-owe};}
function computeHawlStart(N){
  if(N<=0)return null;
  const z=db.zakat;const base=db.accounts.filter(zakatIncluded).reduce((s,a)=>s+toDefault(a.start||0,a.currency),0);
  const txns=db.txns.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)||(a.created||0)-(b.created||0));
  let run=base;let hawlStart=null;
  if(z.anniversary){hawlStart=z.anniversary;}            // user says: I reached nisab on this date
  else if(!txns.length){return base>=N?toISODate(new Date()):null;}
  else if(base>=N){hawlStart=txns[0].date;}
  for(const x of txns){
    if(x.type==='debt')continue;
    const a=acctById(x.account);const inc=a?zakatIncluded(a):false;
    if(x.type==='transfer'){if(inc)run-=toDefault(x.amount,a.currency);const to=x.toAccount?acctById(x.toAccount):null;if(to&&zakatIncluded(to))run+=toDefault(x.amount,to.currency);}
    else if(inc){run+=(x.type==='income'?1:-1)*toDefault(x.amount,a.currency);}
    if(z.anniversary && new Date(x.date)<new Date(z.anniversary))continue; // ignore before manual start
    if(run>=N){if(hawlStart===null)hawlStart=x.date;}
    else if(!hawlKeepsRunningOnDip(run)){hawlStart=null;} // dip below nisab -> restart (Shafi'i + Hanbali mu'tamad; the Hanafis check only the two ends)
  }
  return hawlStart;
}
function zakatDue(){try{if(livestockDueNow())return true;if(db.zakat.mode==='separate'){if(nisab()<=0)return false;return activePools().some(p=>poolStatus(p).isDue);}const st=zakatStatus();return !!(st&&st.isDue);}catch(e){return false;}}
async function fetchGoldPrice(silent){
  try{
    let usdOz=null;
    try{const r=await fetch('https://api.gold-api.com/price/XAU');const j=await r.json();if(j&&j.price)usdOz=j.price;}catch(e){}
    if(!usdOz){try{const r=await fetch('https://data-asg.goldprice.org/dbXRates/USD');const j=await r.json();if(j&&j.items&&j.items[0]&&j.items[0].xauPrice)usdOz=j.items[0].xauPrice;}catch(e){}}
    if(!usdOz)throw 0;
    const usdGram=usdOz/31.1034768;                       // 24k pure, per gram, USD
    let usdToLocal=1;
    if(db.currency!=='USD'){
      usdToLocal=db.rates['USD'];
      if(!usdToLocal){try{const r=await fetch('https://open.er-api.com/v6/latest/'+db.currency);const j=await r.json();if(j&&j.rates&&j.rates.USD){usdToLocal=1/j.rates.USD;db.rates['USD']=usdToLocal;}}catch(e){}}
    }
    if(!usdToLocal)throw 0;
    const prem=1+((db.zakat.goldPremium||0)/100);db.zakat.goldPrice=Math.round(usdGram*usdToLocal*prem*100)/100;
    db.zakat.goldPriceUpdated=Date.now();
    save();
    if(silent){refreshBadges();if(state.screen==='zakat')renderZakat();}
    else{const _g=goldSource();toast('\u2713 '+fmt(db.zakat.goldPrice,db.currency)+' /g'+(_g.tier==='check'?' \u00b7 '+t('priceMayDiffer'):' \u00b7 '+t('basisSpot')));refresh();}
    return true;
  }catch(e){if(!silent)toast(db.lang==='ar'?'\u062a\u0639\u0630\u0651\u0631 \u062c\u0644\u0628 \u0627\u0644\u0633\u0639\u0631 \u2014 \u0623\u062f\u062e\u0644\u0647 \u064a\u062f\u0648\u064a\u064b\u0627':'Could not fetch \u2014 enter price manually');return false;}
}
