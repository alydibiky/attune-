function poolNisab(pool){if(pool==='cash')return nisab();if(pool==='gold')return 85;return 595;}
function applyMadhhab(m){const z=db.zakat;z.madhhab=m;if(m==='hanafi'){z.nisabBasis='silver';z.jewelryZakat=true;}else{z.nisabBasis='gold';z.jewelryZakat=false;}z.mode=(m==='shafii')?'separate':'combined';}
function poolUnitsNow(pool){
  if(pool==='cash'){const z=db.zakat;return zakatCashTotal()+(z.includeReceivables?debtRemainingSum('owed_to_me'):0)-debtDeduction();}
  const z=db.zakat;
  if(pool==='gold')return db.accounts.filter(a=>zakatIncluded(a)&&a.kind==='gold').reduce((s,a)=>s+accountBalance(a.id)*metalPurity(a),0)+(z.goldGrams||0)*((z.goldKarat||24)/24);
  return db.accounts.filter(a=>zakatIncluded(a)&&a.kind==='silver').reduce((s,a)=>s+accountBalance(a.id),0)+(z.silverGrams||0);
}
function poolValue(pool){if(pool==='cash')return poolUnitsNow('cash');if(pool==='gold')return poolUnitsNow('gold')*(db.zakat.goldPrice||0);return poolUnitsNow('silver')*(db.zakat.silverPrice||0);}
function poolInPool(a,pool){if(!a)return false;if(!zakatIncluded(a))return false;if(pool==='cash')return !isMetal(a);return a.kind===pool;}
function poolHawlStart(pool){
  const N=poolNisab(pool);if(N<=0)return null;const z=db.zakat;
  const unit=(x,a)=>{if(pool==='gold')return x.amount*metalPurity(a);return pool==='cash'?toDefault(x.amount,a.currency):x.amount;};
  let run=db.accounts.filter(a=>poolInPool(a,pool)).reduce((s,a)=>s+(pool==='cash'?toDefault(a.start||0,a.currency):(a.start||0)*(pool==='gold'?metalPurity(a):1)),0);
  const txns=db.txns.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)||(a.created||0)-(b.created||0));
  let hs=null;
  if(z.anniversary)hs=z.anniversary; else if(!txns.length)return run>=N?toISODate(new Date()):null; else if(run>=N)hs=txns[0].date;
  for(const x of txns){
    if(x.type==='debt')continue;
    const a=acctById(x.account);const inc=poolInPool(a,pool);
    if(x.type==='transfer'){if(inc)run-=unit(x,a);const to=x.toAccount?acctById(x.toAccount):null;if(poolInPool(to,pool))run+=unit(x,to);}
    else if(inc)run+=(x.type==='income'?1:-1)*unit(x,a);
    if(z.anniversary&&new Date(x.date)<new Date(z.anniversary))continue;
    if(run>=N){if(hs===null)hs=x.date;}else hs=null;
  }
  return hs;
}
function poolStatus(pool){
  const N=poolNisab(pool);const units=poolUnitsNow(pool);const val=poolValue(pool);
  const below=units<N;let hs=poolHawlStart(pool),due=null,daysLeft=null,isDue=false;
  if(hs){const dd=new Date(hs);dd.setDate(dd.getDate()+354);due=toISODate(dd);const today=startOfDay(new Date());daysLeft=Math.ceil((startOfDay(dd)-today)/864e5);isDue=today>=startOfDay(dd)&&!below;}
  return {pool,N,units,val,below,hs,due,daysLeft,isDue,amount:val*0.025};
}
function activePools(){const out=['cash'];if(poolUnitsNow('gold')>0)out.push('gold');if(poolUnitsNow('silver')>0)out.push('silver');return out;}
function zakatStatus(){const N=nisab();if(N<=0)return {noPrice:true};const bd=zakatBreakdown();const belowNisab=bd.net<N;let anniv=computeHawlStart(N);let due=null,daysLeft=null,isDue=false;if(anniv){const _h=hawlEndISO(anniv);const dd=_h?new Date(_h):(function(){const x=new Date(anniv);x.setDate(x.getDate()+354);return x;})();due=toISODate(dd);const today=startOfDay(new Date());daysLeft=Math.ceil((startOfDay(dd)-today)/864e5);isDue=today>=startOfDay(dd)&&!belowNisab;}return {N,bd,belowNisab,anniv,due,daysLeft,isDue,amount:bd.net*0.025};}

function fmtDate(iso){return new Date(iso).toLocaleDateString(db.lang==='ar'?'ar-EG':undefined,{day:'numeric',month:'short',year:'numeric'});}
function hijri(iso){try{return new Intl.DateTimeFormat((db.lang==='ar'?'ar-SA':'en')+'-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date(iso));}catch(e){return '';}}

function renderZakatSeparate(el,cur){
  const pools=activePools();let html='';
  let totalDue=0,anyDue=false,combinedVal=0,combinedDue=false;
  pools.forEach(p=>{const st=poolStatus(p);combinedVal+=st.val;
    let body;
    if(st.below){body='<div class="psub">'+t('belowNisab')+' \u00b7 '+t('need')+' <b class="num">'+poolFmtUnits(p,st.N-st.units)+'</b> '+t('moreToReach')+'</div>';}
    else if(st.isDue){anyDue=true;totalDue+=st.amount;body='<div class="big num" style="color:var(--accent);font-size:26px;margin:4px 0">'+fmt(st.amount,cur)+'</div><div class="psub">2.5% '+t('of')+' '+fmt(st.val,cur)+'</div>';}
    else{body='<div class="psub">'+t('estZakat')+' <b class="num">'+fmt(st.amount,cur)+'</b> \u00b7 '+t('dueOn')+' '+fmtDate(st.due)+' ('+t('inDays').replace('{n}',st.daysLeft)+')</div>';}
    html+='<div class="panel"><div class="sec-head" style="margin:0 0 4px"><h3>'+poolEmoji(p)+' '+poolLabel(p)+'</h3><span class="num" style="color:var(--muted);font-size:13px">'+poolFmtUnits(p,st.units)+'</span></div>'+body
      +'<div class="psub" style="margin-top:8px;color:var(--faint)">'+(p==='cash'?t('nisab')+' '+fmt(st.N,cur):(p==='gold'?t('nisabWeight'):t('nisabSilverWeight')))
      +(st.hs?' \u00b7 '+t('anniversary')+' '+fmtDate(st.hs):'')+'</div></div>';});
  const Nc=nisab();if(Nc>0&&combinedVal>=Nc)combinedDue=true;
  let head=anyDue
    ? '<div class="balance" style="margin-top:6px"><div class="lbl">'+t('zakatDueNow')+'</div><div class="big num" style="color:var(--accent)">'+fmt(totalDue,cur)+'</div></div>'
    : '<div class="panel"><h3 class="up">'+t('noneDue')+'</h3></div>';
  let warn=(!anyDue&&combinedDue)?'<div class="alert" style="margin-top:12px">\u26a0\ufe0f '+t('combinedWouldBe')+'</div>':'';
  el.innerHTML=hijriBanner()+debtChooserHtml()+head+html+warn+fiqhPanels()+livestockPanel()+distributionPanel()+historyPanel()+calcGrid()+srcBtn()+zakatNote();
}

/* ============ Zakat calculators (livestock, crops, trade, rikaz, fitr) ============ */
function camelDue(n){
  if(n<5)return null;
  if(n<10)return [[1,'shah']];
  if(n<15)return [[2,'shah']];
  if(n<20)return [[3,'shah']];
  if(n<25)return [[4,'shah']];
  if(n<36)return [[1,'bintMakhad']];
  if(n<46)return [[1,'bintLabun']];
  if(n<61)return [[1,'hiqqah']];
  if(n<76)return [[1,'jadhaah']];
  if(n<91)return [[2,'bintLabun']];
  if(n<121)return [[2,'hiqqah']];
  return bestCombo(n,50,40,'hiqqah','bintLabun');
}
function cattleDue(n){ if(n<30)return null; if(n<40)return [[1,'tabi']]; if(n<60)return [[1,'musinnah']]; return bestCombo(n,40,30,'musinnah','tabi'); }
function sheepDue(n){ if(n<40)return null; if(n<121)return [[1,'shah']]; if(n<201)return [[2,'shah']]; if(n<400)return [[3,'shah']]; return [[Math.floor(n/100),'shah']]; }
function bestCombo(n,big,small,bigName,smallName){
  let best=-1,opts=[];
  for(let h=0;h*big<=n;h++){for(let l=0;h*big+l*small<=n;l++){const cov=h*big+l*small;if(cov>best){best=cov;opts=[[h,l]];}else if(cov===best&&!opts.some(o=>o[0]===h&&o[1]===l))opts.push([h,l]);}}
  return opts.slice(0,2).map(([h,l])=>{const r=[];if(h)r.push([h,bigName]);if(l)r.push([l,smallName]);return r;}).filter(r=>r.length);
}
function dueText(list){return list.map(([q,k])=>q+' \u00d7 '+t(k)).join(' + ');}
function livestockResult(kind,n){
  const f={camels:camelDue,cattle:cattleDue,sheep:sheepDue}[kind];
  const res=f(n);
  if(!res)return '<h3 class="up">'+t('noneDueLivestock')+'</h3>';
  const arr=Array.isArray(res[0])&&Array.isArray(res[0][0])?res:[res];
  const lines=arr.map(o=>'<div class="big num" style="font-size:20px;margin:4px 0">'+dueText(o)+'</div>').join('<div class="psub">'+t('orOption')+'</div>');
  return '<div class="lbl" style="color:var(--muted);font-size:12px;font-weight:600">'+t('due')+'</div>'+lines;
}
function calcInput(id,label,val,type){return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" inputmode="decimal" value="'+(val==null?'':val)+'" oninput="runCalc()"></div>';}
function openCalc(kind){
  state.calc=kind;
  const T={camels:'calcCamels',cattle:'calcCattle',sheep:'calcSheep',crops:'calcCrops',trade:'calcTrade',rikaz:'calcRikaz',fitr:'calcFitr'}[kind];
  document.getElementById('calc-title').textContent=t(T);
  const N={camels:'livestockCond',cattle:'livestockCond',sheep:'livestockCond',crops:'cropNote',trade:'tradeNote',rikaz:'rikazNote',fitr:'fitrNote'}[kind];
  document.getElementById('calc-note').textContent=t(N);const EK={camels:'camels',cattle:'cattle',sheep:'sheep',crops:'crops',trade:'trade',rikaz:'rikaz',fitr:'fitr'}[kind];document.getElementById('calc-title').innerHTML=t(T)+' '+evBtn(EK)+(['camels','cattle','sheep'].includes(kind)?' '+evBtn('saimah'):'');
  let b='';
  if(kind==='camels'||kind==='cattle'||kind==='sheep')b=calcInput('c-head',t('headCount'),'','number');
  else if(kind==='crops'){b=calcInput('c-kg',t('harvestKg'))
    +'<div class="field"><label>'+t('irrigation')+'</label><select id="c-irr" onchange="runCalc()"><option value="10">'+t('rain')+'</option><option value="5">'+t('irrigated')+'</option></select></div>'
    +calcInput('c-nis',t('cropNisab'),612);}
  else if(kind==='trade')b=calcInput('c-stock',t('stockValue'))+calcInput('c-cash',t('tradeCash'))+calcInput('c-recv',t('tradeRecv'))+calcInput('c-pay',t('tradePay'));
  else if(kind==='rikaz')b=calcInput('c-val',t('treasureValue'));
  else if(kind==='fitr')b=calcInput('c-ppl',t('people'),1,'number')+calcInput('c-per',t('fitrPerPerson'));
  document.getElementById('calc-body').innerHTML=b;
  runCalc();
  document.getElementById('calc-overlay').classList.add('open');
}
function gv(id){const e=document.getElementById(id);return e?(parseFloat(e.value)||0):0;}
function runCalc(){
  const k=state.calc,cur=db.currency;const R=document.getElementById('calc-result');if(!R)return;
  if(k==='camels'||k==='cattle'||k==='sheep'){R.innerHTML=livestockResult(k,Math.floor(gv('c-head')));return;}
  if(k==='crops'){const kg=gv('c-kg'),rate=gv('c-irr')||10,nis=gv('c-nis')||612;
    if(kg<nis){R.innerHTML='<h3 class="up">'+t('belowNisab')+'</h3><div class="psub">'+t('need')+' <b class="num">'+(nis-kg).toLocaleString()+' kg</b></div>';return;}
    R.innerHTML='<div class="lbl" style="color:var(--muted);font-size:12px;font-weight:600">'+t('due')+'</div><div class="big num" style="font-size:26px;color:var(--accent)">'+(Math.round(kg*rate/100*100)/100).toLocaleString()+' kg</div><div class="psub">'+rate+'%</div>';return;}
  if(k==='trade'){const net=gv('c-stock')+gv('c-cash')+gv('c-recv')-gv('c-pay');const N=nisab();
    if(N<=0){R.innerHTML='<div class="psub">'+t('setGoldFirst')+'</div>';return;}
    if(net<N){R.innerHTML='<h3 class="up">'+t('belowNisab')+'</h3><div class="psub">'+t('need')+' <b class="num">'+fmt(N-net,cur)+'</b> '+t('moreToReach')+'</div>';return;}
    R.innerHTML='<div class="lbl" style="color:var(--muted);font-size:12px;font-weight:600">'+t('due')+'</div><div class="big num" style="font-size:26px;color:var(--accent)">'+fmt(net*0.025,cur)+'</div><div class="psub">2.5% '+t('of')+' '+fmt(net,cur)+'</div>';return;}
  if(k==='rikaz'){const v=gv('c-val');R.innerHTML='<div class="lbl" style="color:var(--muted);font-size:12px;font-weight:600">'+t('due')+'</div><div class="big num" style="font-size:26px;color:var(--accent)">'+fmt(v*0.2,cur)+'</div><div class="psub">20%</div>';return;}
  if(k==='fitr'){const tot=gv('c-ppl')*gv('c-per');R.innerHTML='<div class="lbl" style="color:var(--muted);font-size:12px;font-weight:600">'+t('totalDueCalc')+'</div><div class="big num" style="font-size:26px;color:var(--accent)">'+fmt(tot,cur)+'</div><div class="psub">'+gv('c-ppl')+' \u00d7 '+fmt(gv('c-per'),cur)+'</div>';return;}
}
function calcGrid(){
  const items=[['camels','\ud83d\udc2a','calcCamels'],['cattle','\ud83d\udc04','calcCattle'],['sheep','\ud83d\udc11','calcSheep'],['crops','\ud83c\udf3e','calcCrops'],['trade','\ud83c\udfea','calcTrade'],['rikaz','\ud83d\udc8e','calcRikaz'],['fitr','\ud83c\udf19','calcFitr']];
  return '<details class="acc"><summary>'+t('moreCalc')+'</summary><div class="accb"><div class="cat-grid" style="margin-top:4px">'
    +items.map(([k,e,l])=>'<button class="cat-opt" onclick="openCalc(\''+k+'\')"><span class="ce">'+e+'</span>'+t(l)+'</button>').join('')
    +'</div></div></details>';
}

function showEvidence(k){const e=EVID[k];if(!e)return;
  document.getElementById('ev-title').textContent=db.lang==='ar'?e.t.ar:e.t.en;
  document.getElementById('ev-body').innerHTML='<div class="ev-ar">'+e.ar+'</div><div class="ev-src">'+e.src+'</div>';
  document.getElementById('ev-overlay').classList.add('open');}
function evBtn(k){return '<button class="ev-btn" onclick="event.stopPropagation();showEvidence(\''+k+'\')">i</button>';}
function openSources(){
  const rows=Object.keys(EVID).map(k=>'<div class="list-row" onclick="showEvidence(\''+k+'\')"><div class="info"><div class="t1">'+(db.lang==='ar'?EVID[k].t.ar:EVID[k].t.en)+'</div></div><div style="color:var(--faint)">›</div></div>').join('');
  document.getElementById('src-body').innerHTML='<div class="panel" style="margin-top:0"><div class="psub" style="margin:0;line-height:1.7">'+t('zakatMethod')+'</div></div><p class="mini-help">'+t('reviewNote')+'</p>'+rows;
  document.getElementById('src-overlay').classList.add('open');}

/* ============ Hijri helpers ============ */
function hijriParts(d){try{const f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'});const o={};f.formatToParts(d||new Date()).forEach(p=>{if(p.type!=='literal')o[p.type]=parseInt(p.value);});return o;}catch(e){return null;}}
function isRamadan(){const h=hijriParts();return !!(h&&h.month===9);}
function hijriBanner(){if(!isRamadan())return '';
  return '<div class="alert" style="background:rgba(79,191,139,.14);border-color:rgba(79,191,139,.45);color:#9fe3c0;cursor:pointer" onclick="openCalc(\'fitr\')">\u263e '+t('ramadanNow')+'</div>';}

/* ============ Distribution (8 asnaf) ============ */
function zakatPaidTotal(){return (db.zakatPayments||[]).reduce((s,p)=>s+p.amount,0);}
function currentDueAmount(){try{if(db.zakat.mode==='separate'){return activePools().filter(p=>poolStatus(p).isDue).reduce((s,p)=>s+poolStatus(p).amount,0);}const st=zakatStatus();return (st&&st.isDue)?st.amount:0;}catch(e){return 0;}}
function distributionPanel(){
  const cur=db.currency;const paid=zakatPaidTotal();const due=currentDueAmount();
  const rem=Math.max(due-paid,0);const pct=due>0?Math.min(paid/due*100,100):0;
  let bars='';
  if(due>0){bars='<div class="track" style="height:9px;background:var(--card2);border-radius:99px;overflow:hidden;margin:10px 0"><div style="height:100%;width:'+pct+'%;background:'+(rem<=0?'var(--income)':'var(--accent)')+'"></div></div>'
    +'<div class="psub">'+t('paidSoFar')+' <b class="num">'+fmt(paid,cur)+'</b> \u00b7 '+(rem>0?t('remainingDue')+' <b class="num">'+fmt(rem,cur)+'</b>':'<span class="up">'+t('fullyPaidZakat')+'</span>')+'</div>';}
  const list=(db.zakatPayments||[]).slice().reverse().slice(0,8).map(pm=>
    '<div class="insight"><div style="flex:1">'+t('a_'+pm.cat)+(pm.to?' \u00b7 '+esc(pm.to):'')+'<div style="color:var(--faint);font-size:11px">'+pm.date+'</div></div><div class="num">'+fmt(pm.amount,cur)+'</div></div>').join('');
  return '<div class="panel"><div class="sec-head" style="margin:0 0 4px"><h3>'+t('distribution')+' '+evBtn('asnaf')+'</h3><button class="link" onclick="openPayZakat()">'+t('addPayment')+'</button></div>'
    +bars+list+'<button class="btn ghost" onclick="closeZakatYear()" style="margin-top:10px">'+t('closeYear')+'</button></div>';}
function openPayZakat(){
  document.getElementById('pz-cat').innerHTML=ASNAF.map(a=>'<option value="'+a+'">'+t('a_'+a)+'</option>').join('');
  document.getElementById('pz-amount').value='';document.getElementById('pz-to').value='';
  document.getElementById('pz-date').value=toISODate(new Date());
  document.getElementById('pz-account-lbl').textContent=db.lang==='ar'?'ادفع من':'Pay from';
  {const _ca=db.accounts.filter(a=>!isMetal(a)&&!isLivestock(a));document.getElementById('pz-account').innerHTML=_ca.map(a=>`<option value="${a.id}">${a.emoji} ${esc(a.name)}</option>`).join('')+`<option value="">${db.lang==='ar'?'بدون حساب (تسجيل فقط)':'No account (record only)'}</option>`;}
  document.getElementById('pz-overlay').classList.add('open');}
function savePayZakat(){const amt=parseFloat(document.getElementById('pz-amount').value);if(!amt||amt<=0){toast('!');return;}
  const pid=uid(),pacct=document.getElementById('pz-account').value,pcat=document.getElementById('pz-cat').value,pto=document.getElementById('pz-to').value.trim(),pdate=document.getElementById('pz-date').value||toISODate(new Date());
  db.zakatPayments.push({id:pid,amount:amt,cat:pcat,to:pto,date:pdate,account:pacct});
  if(pacct)db.txns.push({id:uid(),type:'zakat',amount:amt,account:pacct,cat:pcat,to:pto,date:pdate,zpayId:pid});
  save();document.getElementById('pz-overlay').classList.remove('open');toast('\u2713');refresh();}

/* ============ History + certificate ============ */
function closeZakatYear(){
  const due=currentDueAmount(),paid=zakatPaidTotal();
  if(due<=0&&paid<=0){toast('!');return;}
  const h=hijriParts()||{};
  db.zakatHistory.push({id:uid(),date:toISODate(new Date()),hijri:(h.year?h.year+'H':''),due:due,paid:paid,currency:db.currency,
    payments:(db.zakatPayments||[]).map(p=>({cat:p.cat,amount:p.amount,to:p.to,date:p.date}))});
  db.zakatPayments=[];db.zakat.anniversary=toISODate(new Date());
  save();toast('\u2713');refresh();}
function historyPanel(){
  const rows=(db.zakatHistory||[]).slice().reverse().map(h=>
    '<div class="list-row" onclick="zakatCertificate(\''+h.id+'\')"><div class="info"><div class="t1 num">'+fmt(h.paid,h.currency)+'</div><div class="t2">'+h.date+(h.hijri?' \u00b7 '+h.hijri:'')+'</div></div><div style="color:var(--accent);font-size:13px;font-weight:600">'+t('certificate')+'</div></div>').join('');
  return '<details class="acc"><summary>'+t('zakatHistory')+'</summary><div class="accb">'+(rows||'<div class="psub">'+t('noHistory')+'</div>')+'</div></details>';}
function zakatCertificate(id){
  const h=(db.zakatHistory||[]).find(x=>x.id===id);if(!h)return;
  const rows=(h.payments||[]).map(p=>'<tr><td>'+t('a_'+p.cat)+'</td><td>'+(p.to?p.to:'')+'</td><td>'+p.date+'</td><td class="r">'+fmt(p.amount,h.currency)+'</td></tr>').join('');
  const html='<html dir="'+(db.lang==='ar'?'rtl':'ltr')+'"><head><meta charset="utf-8"><style>'
   +'body{font-family:Helvetica,Arial,sans-serif;padding:40px;color:#111}'
   +'.hd{text-align:center;border-bottom:3px double #C9A227;padding-bottom:14px;margin-bottom:22px}'
   +'h1{margin:0;font-size:24px;color:#8a6d1b}.bism{font-size:15px;color:#666;margin-bottom:6px}'
   +'.big{font-size:30px;font-weight:bold;text-align:center;margin:18px 0;color:#111}'
   +'table{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px}'
   +'th{background:#f6f1e0;text-align:'+(db.lang==='ar'?'right':'left')+';padding:7px;border-bottom:1px solid #ddd}'
   +'td{padding:6px 7px;border-bottom:1px solid #eee}.r{text-align:'+(db.lang==='ar'?'left':'right')+'}'
   +'.ft{margin-top:26px;font-size:11px;color:#777;text-align:center;border-top:1px solid #eee;padding-top:12px}'
   +'</style></head><body><div class="hd"><div class="bism">\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u0651\u064e\u0647\u0650 \u0627\u0644\u0631\u0651\u064e\u062d\u0652\u0645\u064e\u0670\u0646\u0650 \u0627\u0644\u0631\u0651\u064e\u062d\u0650\u064a\u0645\u0650</div><h1>'+t('certTitle')+'</h1></div>'
   +'<div style="text-align:center;color:#666;font-size:13px">'+t('amountPaid')+'</div><div class="big">'+fmt(h.paid,h.currency)+'</div>'
   +'<table><tr><th>'+t('amountDue')+'</th><td class="r">'+fmt(h.due,h.currency)+'</td></tr>'
   +'<tr><th>'+t('date')+'</th><td class="r">'+h.date+(h.hijri?' / '+h.hijri:'')+'</td></tr></table>'
   +(rows?'<table><tr><th>'+t('asnaf')+'</th><th>'+t('recipient')+'</th><th>'+t('date')+'</th><th class="r">'+t('amount')+'</th></tr>'+rows+'</table>':'')
   +'<div class="ft">'+t('issuedBy')+' \u00b7 '+t('reviewNote')+'</div></body></html>';
  if(window.Android&&window.Android.printHtml){window.Android.printHtml(html,'Zakat-Certificate-'+h.date);return;}
  const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),400);}else{dl(new Blob([html],{type:'text/html'}),'zakat-certificate.html','text/html');}}

 g_recur:["<b>More \u2192 Recurring \u2192 + Add</b> for rent, salary, subscriptions.","Choose weekly, monthly or yearly and the next date.","The app posts them by itself when they fall due \u2014 even for dates you missed. They are marked with \u21bb."],
 g_goals:["<b>Goals</b> tab. Add a savings goal with a target, then tap <b>\uff0b Add to goal</b> as you save.","<b>Debts</b>: record who owes you and who you owe.","Someone paying you back in parts? Tap <b>Record payment</b>, enter the amount and the date it happened. You see what is left, and it closes itself when fully paid."],
 g_zakat:["Open the <b>Zakat</b> tab. First time, answer three things: your country, your school (madhhab), and the gold price \u2014 there is a button to fetch it for you.","After that it is automatic. When your wealth reaches ni\u1e63\u0101b the year starts by itself, and when the lunar year completes you get a banner and a red dot.","Tap <b>What counts</b> to see exactly what was added up, and <b>Dates & ni\u1e63\u0101b</b> for the ni\u1e63\u0101b and your Zakat anniversary.","<b>Other Zakat calculators</b> covers camels, cattle, sheep, crops, trade goods, buried treasure and Zakat al-Fitr.","Record what you give in <b>Where you paid it</b> against the eight categories, then <b>Record this year as paid</b> to archive it and get a certificate.","Every ruling has a small <b>i</b> button showing the hadith and its source."],
 g_reports:["On the overview, <b>\u2b07\ufe0e PDF</b> exports exactly what you are looking at \u2014 that period, account or filter \u2014 as a full report.","<b>\u2699 Filter</b> lets you narrow by date range, amount range and category.","<b>More \u2192 Export CSV</b> opens in Excel."],
 g_backup:["Your data is only on this phone. If you uninstall the app, it is gone.","<b>More \u2192 Export backup</b> saves a file to your Downloads. Do this from time to time.","To move to another phone: <b>Share backup</b> on the old one, then <b>Import backup</b> on the new one.","Before installing a new version, export a backup first, and install over the old app rather than uninstalling it."],
 g_custom:["<b>More \u2192 Customize</b>: four themes, seven accent colours, and three text sizes.","Hide any tabs you do not use.","Set your default period, which day your week starts, and whether to show decimals.","Zakat rules themselves cannot be edited \u2014 ni\u1e63\u0101b, 2.5% and the livestock tables are fixed by Shar\u012b\u02bfah."],
 g_trouble:["<b>Photo or live prices not working?</b> They cannot work in a preview window \u2014 use the installed app.","<b>Live price failed?</b> You need internet at that moment. You can always type the price by hand.","<b>Gold price looks wrong?</b> In some countries the international rate differs from the local market. Tap <b>Verify & correct</b> to check your local source and type the real price.","<b>Storage full?</b> Receipt photos take space. The app always saves the transaction even if it must drop the photo."]

 g_start:["\u0627\u0636\u063a\u0637 \u0632\u0631 <b>+</b> \u0627\u0644\u0643\u0628\u064a\u0631 \u0644\u062a\u0633\u062c\u064a\u0644 \u0623\u064a \u0645\u0635\u0631\u0648\u0641 \u0623\u0648 \u062f\u062e\u0644.","\u0623\u0645\u0648\u0627\u0644\u0643 \u0641\u064a <b>\u0627\u0644\u062d\u0633\u0627\u0628\u0627\u062a</b> \u2014 \u0646\u0642\u062f\u060c \u0628\u0646\u0643\u060c \u0628\u0637\u0627\u0642\u0629. \u062a\u0628\u062f\u0623 \u0628\u062d\u0633\u0627\u0628 \u0648\u0627\u062d\u062f \u0648\u064a\u0645\u0643\u0646\u0643 \u0625\u0636\u0627\u0641\u0629 \u0627\u0644\u0645\u0632\u064a\u062f.","\u0643\u0644 \u0634\u064a\u0621 \u0645\u062d\u0641\u0648\u0638 \u0639\u0644\u0649 \u0647\u0630\u0627 \u0627\u0644\u0647\u0627\u062a\u0641 \u0641\u0642\u0637\u060c \u0648\u064a\u0639\u0645\u0644 \u0628\u062f\u0648\u0646 \u0625\u0646\u062a\u0631\u0646\u062a."],
 g_tx:["\u0627\u0636\u063a\u0637 <b>+</b>\u060c \u0627\u062e\u062a\u0631 <b>\u0645\u0635\u0631\u0648\u0641</b> \u0623\u0648 <b>\u062f\u062e\u0644</b>\u060c \u0627\u0643\u062a\u0628 \u0627\u0644\u0645\u0628\u0644\u063a \u0648\u0627\u062e\u062a\u0631 \u0627\u0644\u062a\u0635\u0646\u064a\u0641 \u062b\u0645 \u0627\u062d\u0641\u0638.","\u0627\u0636\u063a\u0637 \u0639\u0644\u0649 \u0623\u064a \u0645\u0639\u0627\u0645\u0644\u0629 \u0644\u062a\u0639\u062f\u064a\u0644\u0647\u0627 \u0623\u0648 \u062d\u0630\u0641\u0647\u0627.","\u0627\u0633\u062a\u062e\u062f\u0645 <b>\u062a\u0643\u0631\u0627\u0631</b> \u0644\u0646\u0633\u062e \u0645\u0639\u0627\u0645\u0644\u0629 \u0644\u0644\u064a\u0648\u0645\u060c \u0623\u0648 <b>\u21bb \u0643\u0631\u0651\u0631 \u0627\u0644\u0623\u062e\u064a\u0631</b>.","\u064a\u0645\u0643\u0646\u0643 \u0625\u0631\u0641\u0627\u0642 <b>\u0635\u0648\u0631\u0629 \u0625\u064a\u0635\u0627\u0644</b> \u2014 \u0627\u0636\u063a\u0637 \u0639\u0644\u064a\u0647\u0627 \u0644\u0627\u062d\u0642\u064b\u0627 \u0644\u0639\u0631\u0636\u0647\u0627 \u0643\u0627\u0645\u0644\u0629.","\u062a\u062d\u062a\u0627\u062c \u062a\u0635\u0646\u064a\u0641\u064b\u0627 \u062c\u062f\u064a\u062f\u064b\u0627\u061f \u0627\u0636\u063a\u0637 \u0645\u0631\u0628\u0639 <b>\uff0b \u062c\u062f\u064a\u062f</b> \u0648\u0623\u0646\u0634\u0626 \u0645\u0627 \u062a\u0634\u0627\u0621 \u0628\u0644\u0627 \u062d\u062f."],
 g_acct:["<b>\u0627\u0644\u062d\u0633\u0627\u0628\u0627\u062a \u2190 \u0625\u0636\u0627\u0641\u0629 \u062d\u0633\u0627\u0628</b>. \u0627\u062e\u062a\u0631 <b>\u0646\u0642\u062f</b> \u0644\u0644\u0645\u0627\u0644 \u0627\u0644\u0639\u0627\u062f\u064a.","\u0627\u062e\u062a\u0631 <b>\u0630\u0647\u0628</b> \u0623\u0648 <b>\u0641\u0636\u0629</b> \u0644\u0645\u062a\u0627\u0628\u0639\u0629 \u0627\u0644\u0645\u0639\u0627\u062f\u0646\u060c \u0648\u062d\u062f\u062f \u0627\u0644\u0639\u064a\u0627\u0631 (\u0662\u0664\u060c \u0662\u0662\u060c \u0662\u0661\u060c \u0661\u0668).","\u0641\u064a \u062d\u0633\u0627\u0628 \u0627\u0644\u0630\u0647\u0628 \u062a\u062f\u062e\u0644 <b>\u0627\u0644\u062c\u0631\u0627\u0645\u0627\u062a</b> \u0644\u0627 \u0627\u0644\u0645\u0627\u0644. \u0627\u0634\u062a\u0631\u064a\u062a \u0665 \u062c\u0631\u0627\u0645\u061f \u0627\u0643\u062a\u0628 \u0665.","\u064a\u0639\u0631\u0636 \u0627\u0644\u062d\u0633\u0627\u0628 \u0627\u0644\u062c\u0631\u0627\u0645\u0627\u062a \u0648\u0642\u064a\u0645\u062a\u0647\u0627 \u0627\u0644\u064a\u0648\u0645\u060c \u0648\u062a\u062f\u062e\u0644 \u062a\u0644\u0642\u0627\u0626\u064a\u064b\u0627 \u0641\u064a \u0632\u0643\u0627\u062a\u0643."],
 g_transfer:["\u0646\u0642\u0644 \u0627\u0644\u0645\u0627\u0644 \u0628\u064a\u0646 \u062d\u0633\u0627\u0628\u0627\u062a\u0643 \u0644\u064a\u0633 \u0645\u0635\u0631\u0648\u0641\u064b\u0627.","\u0627\u0636\u063a\u0637 <b>+</b> \u062b\u0645 <b>\u062a\u062d\u0648\u064a\u0644</b> \u0648\u0627\u062e\u062a\u0631 \u0645\u0646 \u0648\u0625\u0644\u0649.","\u062a\u0638\u0647\u0631 \u0628\u0627\u0644\u0623\u0632\u0631\u0642 \u0648\u0644\u0627 \u062a\u064f\u062d\u0633\u0628 \u0636\u0645\u0646 \u0627\u0644\u0645\u0635\u0631\u0648\u0641\u0627\u062a."],
 g_budget:["<b>\u0627\u0644\u062a\u062d\u0644\u064a\u0644 \u2190 \u0627\u0644\u0645\u064a\u0632\u0627\u0646\u064a\u0627\u062a \u2190 \u062a\u0639\u062f\u064a\u0644</b>.","\u062d\u062f\u062f \u062d\u062f\u064b\u0627 \u0634\u0647\u0631\u064a\u064b\u0627 \u0625\u062c\u0645\u0627\u0644\u064a\u064b\u0627 \u0623\u0648 \u0644\u0643\u0644 \u062a\u0635\u0646\u064a\u0641.","\u064a\u062a\u062d\u0648\u0644 \u0627\u0644\u0634\u0631\u064a\u0637 \u0644\u0644\u0630\u0647\u0628\u064a \u0639\u0646\u062f \u0668\u0660\u066a \u0648\u0644\u0644\u0623\u062d\u0645\u0631 \u0639\u0646\u062f \u0627\u0644\u062a\u062c\u0627\u0648\u0632."],
 g_recur:["<b>\u0627\u0644\u0645\u0632\u064a\u062f \u2190 \u0627\u0644\u0645\u062a\u0643\u0631\u0631 \u2190 \u0625\u0636\u0627\u0641\u0629</b> \u0644\u0644\u0625\u064a\u062c\u0627\u0631 \u0648\u0627\u0644\u0631\u0627\u062a\u0628 \u0648\u0627\u0644\u0627\u0634\u062a\u0631\u0627\u0643\u0627\u062a.","\u0627\u062e\u062a\u0631 \u0623\u0633\u0628\u0648\u0639\u064a \u0623\u0648 \u0634\u0647\u0631\u064a \u0623\u0648 \u0633\u0646\u0648\u064a \u0648\u0627\u0644\u062a\u0627\u0631\u064a\u062e \u0627\u0644\u0642\u0627\u062f\u0645.","\u064a\u0633\u062c\u0644\u0647\u0627 \u0627\u0644\u062a\u0637\u0628\u064a\u0642 \u062a\u0644\u0642\u0627\u0626\u064a\u064b\u0627 \u0639\u0646\u062f \u0645\u0648\u0639\u062f\u0647\u0627 \u0648\u062a\u064f\u0639\u0644\u0645 \u0628\u0640 \u21bb."],
 g_goals:["\u062a\u0628\u0648\u064a\u0628 <b>\u0627\u0644\u0623\u0647\u062f\u0627\u0641</b>: \u0623\u0636\u0641 \u0647\u062f\u0641\u064b\u0627 \u0628\u0645\u0628\u0644\u063a \u062b\u0645 <b>\uff0b \u0625\u0636\u0627\u0641\u0629 \u0644\u0644\u0647\u062f\u0641</b>.","<b>\u0627\u0644\u062f\u064a\u0648\u0646</b>: \u0633\u062c\u0644 \u0645\u0646 \u0644\u0643 \u0648\u0645\u0646 \u0639\u0644\u064a\u0643.","\u064a\u062f\u0641\u0639 \u0623\u062d\u062f\u0647\u0645 \u0639\u0644\u0649 \u062f\u0641\u0639\u0627\u062a\u061f \u0627\u0636\u063a\u0637 <b>\u062a\u0633\u062c\u064a\u0644 \u062f\u0641\u0639\u0629</b> \u0645\u0639 \u0627\u0644\u0645\u0628\u0644\u063a \u0648\u0627\u0644\u062a\u0627\u0631\u064a\u062e\u060c \u0648\u062a\u0631\u0649 \u0627\u0644\u0645\u062a\u0628\u0642\u064a."],
 g_zakat:["\u0627\u0641\u062a\u062d \u062a\u0628\u0648\u064a\u0628 <b>\u0627\u0644\u0632\u0643\u0627\u0629</b>. \u0623\u0648\u0644 \u0645\u0631\u0629 \u062a\u062c\u064a\u0628 \u0639\u0646 \u062b\u0644\u0627\u062b\u0629: \u0628\u0644\u062f\u0643\u060c \u0645\u0630\u0647\u0628\u0643\u060c \u0648\u0633\u0639\u0631 \u0627\u0644\u0630\u0647\u0628 \u2014 \u0648\u0647\u0646\u0627\u0643 \u0632\u0631 \u0644\u062c\u0644\u0628\u0647.","\u0628\u0639\u062f\u0647\u0627 \u0643\u0644 \u0634\u064a\u0621 \u062a\u0644\u0642\u0627\u0626\u064a. \u0639\u0646\u062f \u0628\u0644\u0648\u063a \u0627\u0644\u0646\u0635\u0627\u0628 \u064a\u0628\u062f\u0623 \u0627\u0644\u062d\u0648\u0644\u060c \u0648\u0639\u0646\u062f \u062a\u0645\u0627\u0645\u0647 \u064a\u0638\u0647\u0631 \u062a\u0646\u0628\u064a\u0647.","\u0627\u0636\u063a\u0637 <b>\u0645\u0627 \u064a\u064f\u062d\u0633\u0628</b> \u0644\u062a\u0631\u0649 \u0627\u0644\u062a\u0641\u0627\u0635\u064a\u0644\u060c \u0648<b>\u0627\u0644\u062a\u0648\u0627\u0631\u064a\u062e \u0648\u0627\u0644\u0646\u0635\u0627\u0628</b> \u0644\u0645\u0639\u0631\u0641\u0629 \u0645\u0648\u0639\u062f \u062d\u0648\u0644\u0643.","<b>\u062d\u0627\u0633\u0628\u0627\u062a \u0623\u062e\u0631\u0649</b> \u062a\u0634\u0645\u0644 \u0627\u0644\u0625\u0628\u0644 \u0648\u0627\u0644\u0628\u0642\u0631 \u0648\u0627\u0644\u063a\u0646\u0645 \u0648\u0627\u0644\u0632\u0631\u0648\u0639 \u0648\u0639\u0631\u0648\u0636 \u0627\u0644\u062a\u062c\u0627\u0631\u0629 \u0648\u0627\u0644\u0631\u0643\u0627\u0632 \u0648\u0632\u0643\u0627\u0629 \u0627\u0644\u0641\u0637\u0631.","\u0633\u062c\u0644 \u0645\u0627 \u0623\u062e\u0631\u062c\u062a\u0647 \u0641\u064a <b>\u0623\u064a\u0646 \u0635\u0631\u0641\u062a\u0647\u0627</b> \u0639\u0644\u0649 \u0627\u0644\u0645\u0635\u0627\u0631\u0641 \u0627\u0644\u062b\u0645\u0627\u0646\u064a\u0629\u060c \u062b\u0645 \u0633\u062c\u0644 \u0627\u0644\u0639\u0627\u0645 \u0644\u062a\u062d\u0635\u0644 \u0639\u0644\u0649 \u0634\u0647\u0627\u062f\u0629.","\u0644\u0643\u0644 \u062d\u0643\u0645 \u0632\u0631 <b>i</b> \u064a\u0639\u0631\u0636 \u0627\u0644\u062f\u0644\u064a\u0644 \u0648\u0645\u0635\u062f\u0631\u0647."],
 g_reports:["\u0641\u064a \u0627\u0644\u0631\u0626\u064a\u0633\u064a\u0629\u060c <b>\u2b07\ufe0e PDF</b> \u064a\u0635\u062f\u0631 \u0645\u0627 \u062a\u0631\u0627\u0647 \u0627\u0644\u0622\u0646 \u0643\u062a\u0642\u0631\u064a\u0631 \u0643\u0627\u0645\u0644.","<b>\u062a\u0635\u0641\u064a\u0629</b> \u062a\u062a\u064a\u062d \u0627\u0644\u062a\u062d\u062f\u064a\u062f \u0628\u0627\u0644\u062a\u0627\u0631\u064a\u062e \u0648\u0627\u0644\u0645\u0628\u0644\u063a \u0648\u0627\u0644\u062a\u0635\u0646\u064a\u0641.","<b>\u0627\u0644\u0645\u0632\u064a\u062f \u2190 \u062a\u0635\u062f\u064a\u0631 CSV</b> \u064a\u0641\u062a\u062d \u0641\u064a \u0625\u0643\u0633\u0644."],
 g_backup:["\u0628\u064a\u0627\u0646\u0627\u062a\u0643 \u0639\u0644\u0649 \u0647\u0630\u0627 \u0627\u0644\u0647\u0627\u062a\u0641 \u0641\u0642\u0637\u060c \u0648\u062a\u0636\u064a\u0639 \u0625\u0646 \u062d\u0630\u0641\u062a \u0627\u0644\u062a\u0637\u0628\u064a\u0642.","<b>\u0627\u0644\u0645\u0632\u064a\u062f \u2190 \u062a\u0635\u062f\u064a\u0631 \u0646\u0633\u062e\u0629</b> \u064a\u062d\u0641\u0638 \u0645\u0644\u0641\u064b\u0627 \u0641\u064a \u0627\u0644\u062a\u0646\u0632\u064a\u0644\u0627\u062a. \u0643\u0631\u0631 \u0630\u0644\u0643 \u062f\u0648\u0631\u064a\u064b\u0627.","\u0644\u0644\u0627\u0646\u062a\u0642\u0627\u0644 \u0644\u0647\u0627\u062a\u0641 \u0622\u062e\u0631: <b>\u0645\u0634\u0627\u0631\u0643\u0629 \u0627\u0644\u0646\u0633\u062e\u0629</b> \u062b\u0645 <b>\u0627\u0633\u062a\u064a\u0631\u0627\u062f</b>.","\u0642\u0628\u0644 \u062a\u062b\u0628\u064a\u062a \u0625\u0635\u062f\u0627\u0631 \u062c\u062f\u064a\u062f: \u0635\u062f\u0651\u0631 \u0646\u0633\u062e\u0629 \u0623\u0648\u0644\u0627\u064b\u060c \u0648\u062b\u0628\u0651\u062a \u0641\u0648\u0642 \u0627\u0644\u0642\u062f\u064a\u0645 \u0648\u0644\u0627 \u062a\u062d\u0630\u0641\u0647."],
 g_custom:["<b>\u0627\u0644\u0645\u0632\u064a\u062f \u2190 \u0627\u0644\u062a\u062e\u0635\u064a\u0635</b>: \u0623\u0631\u0628\u0639\u0629 \u0645\u0638\u0627\u0647\u0631 \u0648\u0633\u0628\u0639\u0629 \u0623\u0644\u0648\u0627\u0646 \u0648\u062b\u0644\u0627\u062b\u0629 \u0623\u062d\u062c\u0627\u0645 \u0644\u0644\u062e\u0637.","\u0623\u062e\u0641\u0650 \u0623\u064a \u062a\u0628\u0648\u064a\u0628 \u0644\u0627 \u062a\u0633\u062a\u062e\u062f\u0645\u0647.","\u062d\u062f\u062f \u0627\u0644\u0641\u062a\u0631\u0629 \u0627\u0644\u0627\u0641\u062a\u0631\u0627\u0636\u064a\u0629 \u0648\u0628\u062f\u0627\u064a\u0629 \u0627\u0644\u0623\u0633\u0628\u0648\u0639 \u0648\u0625\u0638\u0647\u0627\u0631 \u0627\u0644\u0643\u0633\u0648\u0631.","\u0623\u062d\u0643\u0627\u0645 \u0627\u0644\u0632\u0643\u0627\u0629 \u0644\u0627 \u062a\u064f\u0639\u062f\u0644 \u2014 \u0627\u0644\u0646\u0635\u0627\u0628 \u0648\u0662\u066b\u0665\u066a \u0648\u062c\u062f\u0627\u0648\u0644 \u0627\u0644\u0623\u0646\u0639\u0627\u0645 \u062b\u0627\u0628\u062a\u0629 \u0634\u0631\u0639\u064b\u0627."],

/* ============ Livestock Zakat (per account, with hawl) ============ */
function livestockNisab(kind){return kind==='camels'?5:(kind==='cattle'?30:40);}
function livestockDueFor(kind,n){return kind==='camels'?camelDue(n):(kind==='cattle'?cattleDue(n):sheepDue(n));}
/* Offspring follow the mothers' hawl (natij al-sa'imah): a birth adds to the count
   but never starts a new hawl. Dropping below nisab breaks the hawl. */
function livestockHawlStart(acc){
  const N=livestockNisab(acc.kind);
  let run=acc.start||0,hs=null;
  const txns=db.txns.filter(x=>x.account===acc.id).sort((a,b)=>new Date(a.date)-new Date(b.date)||(a.created||0)-(b.created||0));
  if(run>=N&&txns.length)hs=txns[0].date;
  for(const x of txns){
    run+=(x.type==='income'?1:-1)*x.amount;
    if(run>=N){if(hs===null)hs=x.date;}else hs=null;
  }
  return run>=N?hs:null;
}
function livestockStatus(acc){
  const N=livestockNisab(acc.kind);const count=accountBalance(acc.id);
  const below=count<N;const hs=below?null:livestockHawlStart(acc);
  let due=null,daysLeft=null,isDue=false;
  if(hs){const dd=new Date(hs);dd.setDate(dd.getDate()+354);due=toISODate(dd);
    const today=startOfDay(new Date());daysLeft=Math.ceil((startOfDay(dd)-today)/864e5);isDue=today>=startOfDay(dd);}
  return {acc,N,count,below,hs,due,daysLeft,isDue,owed:below?null:livestockDueFor(acc.kind,Math.floor(count))};
}
function livestockAccounts(){return db.accounts.filter(a=>isLivestock(a)&&zakatIncluded(a)&&a.grazing!==false);}
function livestockDueNow(){return livestockAccounts().some(a=>livestockStatus(a).isDue);}
function livestockPanel(){
  const accs=db.accounts.filter(a=>isLivestock(a));
  if(!accs.length)return '';
  let html='';
  accs.forEach(a=>{
    const emo=livestockEmoji(a.kind);
    if(a.grazing===false){html+='<div class="insight"><span class="ico">'+emo+'</span><div style="flex:1">'+esc(a.name)+'<div style="color:var(--faint);font-size:11px">'+t('notGrazing')+'</div></div><div class="num">'+fmtHead(accountBalance(a.id))+'</div></div>';return;}
    const st=livestockStatus(a);
    let line;
    if(st.below)line='<div style="color:var(--muted);font-size:12px">'+t('noHawlYet')+' \u00b7 '+t('nisab')+' '+st.N+'</div>';
    else if(st.isDue)line='<div class="num" style="color:var(--accent);font-weight:800;font-size:15px">'+dueText(Array.isArray(st.owed[0])?st.owed[0]:st.owed)+'</div>';
    else line='<div style="color:var(--muted);font-size:12px">'+t('hawlRunning')+' \u00b7 '+t('dueOn')+' '+fmtDate(st.due)+' ('+t('inDays').replace('{n}',st.daysLeft)+')</div>';
    html+='<div class="insight"><span class="ico">'+emo+'</span><div style="flex:1">'+esc(a.name)+' \u00b7 <span class="num">'+fmtHead(st.count)+'</span>'+line+'</div></div>';
  });
  return '<details class="acc"><summary>'+t('livestockZakat')+' '+evBtn('saimah')+'</summary><div class="accb">'+html+'</div></details>';
}


/* ============ Trends drill-down table ============ */
function drillList(kind,cat){
  if(state.drill&&state.drill.day){return db.txns.filter(x=>x.date===state.drill.day&&x.type==='expense'&&(state.acct==='all'||x.account===state.acct));}
  const list=txnsForTrends(state.trPeriod).filter(x=>{
    if(cat&&x.cat!==cat)return false;
    if(kind==='earned')return x.type==='income';
    if(kind==='spent')return x.type==='expense';
    if(kind==='net')return x.type==='income'||x.type==='expense';
    return true;
  });
  return list.sort((a,b)=>new Date(b.date)-new Date(a.date)||(b.created||0)-(a.created||0));
}

  state.drill={kind:kind,cat:cat||null,day:null};

  let tot=0;list.forEach(x=>{tot+=(x.type==='income'?1:-1)*inView(x);});

    +'<div class="big num" style="font-size:26px;color:'+(kind==='spent'?'var(--expense)':(kind==='earned'?'var(--income)':(tot>=0?'var(--income)':'var(--expense)')))+'">'
    +(kind==='net'&&tot>=0?'+':'')+fmt(shown,cur)+'</div><div class="psub">'+list.length+' \u00b7 '+t('txnTable')+'</div>';
  if(!list.length){document.getElementById('dr-body').innerHTML='<div class="empty">'+t('noneInPeriod')+'</div>';}

      +list.map(x=>{const a=acctById(x.account);const c=CATMAP[x.cat]||CATMAP.other;const sign=x.type==='income'?'+':'-';
        const amt=a&&isLivestock(a)?fmtHead(x.amount):(a&&isMetal(a)?fmtG(x.amount):fmt(x.amount,a?a.currency:db.currency));
        return '<tr onclick="closeSheets();openTx(\''+x.id+'\')"><td>'+x.date.slice(5)+'</td><td>'+c.e+' '+catName(x.cat)+(x.note?'<div class="tn">'+esc(x.note)+'</div>':'')+'</td><td>'+(a?esc(a.name):'')+'</td><td class="r '+(x.type==='income'?'up':'down')+'">'+sign+amt+'</td></tr>';}).join('')

function renderNotes(){
  const q=(document.getElementById('notes-search').value||'').toLowerCase();
  let list=(db.notes||[]).filter(n=>{
    if(!q)return true;
    const items=(n.items||[]).map(i=>i.text).join(' ');
    return (n.title||'').toLowerCase().includes(q)||(n.body||'').toLowerCase().includes(q)||items.toLowerCase().includes(q);
  });
  list=list.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.updated||0)-(a.updated||0));
  const el=document.getElementById('notes-list');
  if(!list.length){el.innerHTML='<div class="empty"><span class="big-emo">\ud83d\udcdd</span>'+t('noNotes')+'</div>';return;}
  el.innerHTML=list.map(n=>{
    let inner='';
    if(n.type==='todo'){
      const items=n.items||[];const done=items.filter(i=>i.done).length;
      const pct=items.length?done/items.length*100:0;
      inner=items.slice(0,6).map(i=>'<label class="todo-row'+(i.done?' done':'')+'" onclick="event.stopPropagation()"><input type="checkbox" '+(i.done?'checked':'')+' onchange="toggleItem(\''+n.id+'\',\''+i.id+'\')"><span>'+esc(i.text)+'</span></label>').join('')
        +(items.length>6?'<div class="note-meta">+'+(items.length-6)+'</div>':'')
        +'<div class="todo-bar"><i style="width:'+pct+'%"></i></div>'
        +'<div class="note-meta">'+(items.length&&done===items.length?'\u2705 '+t('allDone'):t('doneCount').replace('{a}',done).replace('{b}',items.length))+'</div>';
    }else{
      inner='<div class="note-body">'+esc(n.body||'')+'</div>';
    }
    const due=n.due?'<span>\u23f0 '+fmtDate(n.due)+'</span>':'';
    return '<div class="note-card'+(n.pinned?' pin':'')+'" onclick="openNote(\''+n.id+'\')">'
      +'<div class="note-top"><div style="font-size:17px">'+(n.type==='todo'?'\u2611':'\ud83d\udcdd')+'</div>'

/* ============ ATTUNE BRIDGE ============
   Added for running Yusr inside Attune. Entirely additive: this block wraps
   three existing handlers and adds a message listener. No existing line is
   modified, and with no host present nothing here ever runs.

   Rules enforced on this side:
   - Attune may PROPOSE a transaction. The user confirms it in the normal tx
     sheet, picking the account themselves. Attune can never write to db.
   - Zakāt figures are sent OUT for display only. Nothing Zakāt-related is
     ever accepted IN — there is no branch for it.
*/
(function(){
  var NS='yusr-bridge', V=1;
  function host(){ try{ return (window.parent&&window.parent!==window)?window.parent:null; }catch(e){ return null; } }
  function send(type,data){ var h=host(); if(!h) return; try{ h.postMessage({ns:NS,v:V,type:type,data:data||{}},'*'); }catch(e){} }

  function unitOf(a){ return isLivestock(a)?'head':(isMetal(a)?'g':'money'); }

  function snapshot(kind){
    var accs=[], cash=0;
    try{
      db.accounts.forEach(function(a){
        var b=accountBalance(a.id);
        accs.push({id:a.id,name:a.name,balance:b,unit:unitOf(a),
                   kind:a.kind||'cash',currency:isMetal(a)||isLivestock(a)?null:(a.currency||db.currency)});
        // Only money is totalled. Grams and head are not money and are never
        // added into a single figure.
        if(!isMetal(a)&&!isLivestock(a)){ try{ cash+=toDefault(b,a.currency); }catch(e){ cash+=b; } }
      });
    }catch(e){}
    var z=null;
    try{
      var st=zakatStatus();
      // No live metal price means no niṣāb, so there is nothing to report.
      // Say that explicitly instead of sending nothing — "we don't know yet"
      // and "you owe nothing" are very different answers.
      if(st&&st.noPrice){
        z={noPrice:true,due:false,amount:null,nisab:null,base:null,hawlEndsISO:null,
           madhhab:(db.zakat&&db.zakat.madhhab)||'majority',
           basis:(db.lang==='ar'
             ? 'لا يمكن تحديد النصاب بدون سعر الذهب أو الفضة. افتح تبويب الزكاة وحدّث السعر.'
             : 'The niṣāb cannot be determined without a gold or silver price. Open the Zakāt tab and refresh the price.'),
           sources:[]};
      } else if(st){
        z={due:!!st.isDue, amount:(st.amount==null?null:Math.round(st.amount*100)/100),
           nisab:st.N, base:(st.bd?st.bd.net:null), hawlEndsISO:st.due||null,
           madhhab:(db.zakat&&db.zakat.madhhab)||'majority',
           basis:(db.lang==='ar'
             ? 'تجب الزكاة إذا بلغ المال النصاب وحال عليه الحول. النصاب قيمة 85 جرامًا من الذهب أو 595 جرامًا من الفضة، والمقدار ربع العشر (2.5%). هذه الأرقام حسبها تطبيق يُسر.'
             : 'Zakāt is due when wealth reaches the niṣāb and a full ḥawl passes over it. Niṣāb is the value of 85g of gold or 595g of silver; the rate is 2.5% (ربع العشر). These figures were calculated by Yusr.'),
           sources:['Islamweb fatwa 108367','Dorar 2153']};
      }
    }catch(e){}
    send('snapshot',{kind:kind||'summary',currency:db.currency,cashTotal:cash,
                     income:null,expense:null,accounts:accs,zakat:z,
                     share:(db.shareAttune||'unset')});
  }

  // First run shows the onboarding overlay on top of everything. A payment
  // shared before onboarding finishes would open the tx sheet UNDERNEATH it —
  // visible, prefilled, and impossible to touch. So a proposal that arrives
  // during onboarding is held and applied the moment it closes.
  var _pending=null,_waits=0;
  function onboarding(){ var o=document.getElementById('onboard'); return !!(o&&o.classList.contains('open')); }
  function drain(){
    if(!_pending)return;
    if(onboarding()){ if(_waits++<240){ setTimeout(drain,500); } return; }
    var d=_pending; _pending=null; _waits=0; openProposal(d);
  }

  // A proposal opens the ordinary transaction sheet, prefilled. Deliberately
  // no account is set: the user picks it, exactly as when adding by hand.
  function propose(d){
    if(!d||typeof d.amount!=='number'||!(d.amount>0))return;
    if(d.direction!=='in'&&d.direction!=='out')return;
    if(onboarding()){ _pending=d; drain(); return; }
    openProposal(d);
  }
  function openProposal(d){
    var note=[d.party||'',d.ref?('#'+d.ref):''].filter(Boolean).join(' · ');
    try{
      openTx(null,{type:d.direction==='out'?'expense':'income',amount:d.amount,
                   cat:d.direction==='out'?'other':'other',note:note,
                   date:toISODate(d.ts?new Date(d.ts):new Date())});
      toast(db.lang==='ar'?'راجِع المعاملة واختر الحساب':'Check it and pick the account');
    }catch(e){}
  }

  addEventListener('message',function(e){
    var m=e.data;
    if(!m||typeof m!=='object'||m.ns!==NS||m.v!==V)return;
    if(m.type==='propose-txn'){ propose(m.data); return; }
    if(m.type==='request'){
      if(m.data&&m.data.kind==='ready') send('ready',{app:'yusr'});
      else snapshot(m.data&&m.data.kind);
      return;
    }
    // Anything else is ignored on purpose. In particular there is no branch
    // that accepts a Zakāt figure from outside.
  });

  // Tell Attune when the user confirms something. Wrapping, not editing.
  var _saveTx=saveTx;
  saveTx=function(){
    var before=db.txns.length;
    var r=_saveTx.apply(this,arguments);
    try{ if(db.txns.length>before){ var x=db.txns[db.txns.length-1];
      send('txn-added',{id:x.id,type:x.type,amount:x.amount,
        currency:(acctById(x.account)||{}).currency||db.currency,
        account:x.account,party:'',note:x.note||'',ts:Date.parse(x.date)||Date.now(),ref:''}); } }catch(e){}
    return r;
  };
  var _savePayZakat=savePayZakat;
  savePayZakat=function(){
    var before=(db.zakatPayments||[]).length;
    var r=_savePayZakat.apply(this,arguments);
    try{ if((db.zakatPayments||[]).length>before){ var p=db.zakatPayments[db.zakatPayments.length-1];
      send('zakat-paid',{amount:p.amount,to:p.to||'',date:p.date}); } }catch(e){}
    return r;
  };

  window.YusrBridge={snapshot:snapshot,send:send};
  // Announce, and keep answering if the host attached late.
  try{ send('ready',{app:'yusr'}); }catch(e){}
})();

/* ==========================================================================
   FIQH PASS — September 2026
   Every rule below was re-verified against the source page, not remembered.
   Where scholars differ, the app ASKS instead of choosing, and shows who
   holds what. Nothing here computes zakat differently on its own: the one
   behavioural change is that an unanswered question now deducts NOTHING
   rather than silently deducting everything.
   ========================================================================== */

var FIQH_AR = function(){ return db.lang==='ar'; };

/* --- 1. Debt deduction ----------------------------------------------------
   The old default was deductDebts:true. A user with a 25-year mortgage
   deducted the whole outstanding principal, landed below nisab, and was told
   they owe no zakat — every year, forever. Two of the scholars this app cites
   hold the opposite.

   Ibn Baz: "والدين لا يمنع الزكاة ... والأرجح من الأقوال الثلاثة: أنه لا يمنعها مطلقًا"
     binbaz.org.sa/fatwas/1481/حكم-الزكاة-مع-وجود-الدين (the numeric URL 404s without the Arabic slug)
   Ibn 'Uthaymin, Sharh al-Mumti' 5/33-40: "والذي أرجحه أن الزكاة واجبة مطلقاً"
   IslamQA 120371: "من ملك نصابا وحال عليه الحول وجب عليه أن يزكيه، مهما كان دَيْنُه"
   Islamweb 124533: deduction is the jumhur view; no-deduction is "أحوطها".
   Islamweb 73955: the jumhur deduction applies to الأموال الباطنة (cash,
     trade goods) — that page does NOT name the Hanbalis or Malikis, so the
     app does not claim it does.
   Islamweb is not of one mind here (142533 says the opposite of 124533), so
   the app never says "Islamweb says".                                       */
var DEBT_POLICIES = [
  { id:'none', en:'Do not deduct debts',
    ar:'لا تُخصم الديون',
    whoEn:'Ibn Bāz · Ibn ʿUthaymīn · Shāfiʿī (qawl jadīd) · IslamQA — and the view Islamweb calls the more prudent (الأحوط)',
    whoAr:'ابن باز · ابن عثيمين · الشافعي (القول الجديد) · الإسلام سؤال وجواب — وهو ما سماه إسلام ويب «الأحوط»',
    src:['binbaz.org.sa/fatwas/1481/حكم-الزكاة-مع-وجود-الدين','islamqa.info/ar/answers/120371','islamweb.net/ar/fatwa/124533'] },
  { id:'year', en:'Deduct only what falls due this year',
    ar:'اخصم ما يستحق خلال هذا العام فقط',
    whoEn:'some contemporary scholars — a middle position; you enter the amount yourself',
    whoAr:'قول بعض المعاصرين — موقف وسط، وتُدخل المبلغ بنفسك',
    src:['islamqa.info/ar/answers/120371'] },
  { id:'all', en:'Deduct the whole debt',
    ar:'اخصم الدين كله',
    whoEn:'the jumhūr, for hidden wealth (الأموال الباطنة) such as cash and trade goods',
    whoAr:'الجمهور، في الأموال الباطنة كالنقود وعروض التجارة',
    src:['islamweb.net/ar/fatwa/73955','islamweb.net/ar/fatwa/124533'] },
];

// The single place debt is subtracted. Unanswered means subtract NOTHING —
// the prudent side — and the app asks loudly rather than guessing.
function debtDeduction(){
  var z=db.zakat, p=z.debtPolicy, owed=debtRemainingSum('i_owe');
  if(p==='all') return owed;
  if(p==='year') return Math.min(parseFloat(z.debtYearAmount)||0, owed);
  return 0;                                  // 'none', or not chosen yet
}
function debtPolicyNeeded(){
  return !db.zakat.debtPolicy && debtRemainingSum('i_owe') > 0;
}
function setDebtPolicy(p){
  db.zakat.debtPolicy=p;
  db.zakat.deductDebts=(p!=='none');         // legacy field kept in step
  save(); closeSheets&&0; toast('✓'); refresh();
}
function debtChooserHtml(){
  if(!debtPolicyNeeded()) return '';
  var ar=FIQH_AR(), owed=debtRemainingSum('i_owe');
  var h='<div class="panel" style="border:1px solid var(--accent)">'
   +'<h3 class="up">'+(ar?'سؤال واحد قبل حساب الزكاة':'One question before your zakāt is calculated')+'</h3>'
   +'<p class="mini-help">'+(ar
     ?('عليك دين قدره '+fmt(owed,db.currency)+'. اختلف العلماء: هل يُخصم الدين من المال الذي تُزكّيه؟ هذا اختيارك أنت، والتطبيق لا يختار عنك. وإلى أن تختار فلن يُخصم شيء.')
     :('You owe '+fmt(owed,db.currency)+'. Scholars differ on whether debt is subtracted from the wealth you pay zakāt on. This is your choice, not the app’s. Until you choose, nothing is subtracted.'))
   +'</p>';
  for(var i=0;i<DEBT_POLICIES.length;i++){ var o=DEBT_POLICIES[i];
    h+='<button class="btn ghost" style="text-align:start;display:block;width:100%;margin-top:8px" onclick="setDebtPolicy(\''+o.id+'\')">'
      +'<b>'+(ar?o.ar:o.en)+'</b><br><span class="mini-help">'+(ar?o.whoAr:o.whoEn)+'</span></button>';
  }
  h+='<p class="mini-help" style="margin-top:10px">'+(ar
    ?'يمكنك تغيير هذا في أي وقت من إعدادات الزكاة.'
    :'You can change this any time in Zakāt settings.')+'</p></div>';
  return h;
}

/* --- 2. Hanafi: only the two ends of the year are checked -----------------
   Islamweb 391351: "وَذَهَبَ الْحَنَفِيَّةُ إِلَى أَنَّ الْمُعْتَبَرَ طَرَفَا الْحَوْل، فَإِنْ تَمَّ
   النِّصَابُ فِي أَوَّلِهِ وَآخِرِهِ، وَجَبَتِ الزَّكَاةُ وَلَوْ نَقَصَ الْمَال عَنِ النِّصَابِ فِي أَثْنَائِهِ،
   مَا لَمْ يَنْعَدِمِ الْمَال كُلِّيَّةً" — note the proviso: unless the wealth is gone
   entirely. The app restarted the hawl on any dip, which is the Shafi'i and
   Hanbali (mu'tamad) rule, not the Hanafi one. A Hanafi user who dipped
   mid-year was being told they owe nothing when their school says they owe. */
function hawlKeepsRunningOnDip(runningBalance){
  if((db.zakat.madhhab||'jumhur')!=='hanafi') return false;
  return runningBalance > 0;                 // ما لم ينعدم المال كلية
}

/* --- 3. Nisab carat: 24k or 21k ------------------------------------------
   Islamweb 205648: "العيار الذي يعتمد في تحديد نصاب الزكاة هو عيار 24".
   Dar al-Ifta al-Misriyyah 11653: "نصاب زكاة المال خمسة وثمانون جرامًا من
   الذهب من عيار واحد وعشرين" — and 21692 explains why.
   21k is ~87.5% fine, so the Egyptian threshold is about 12.5% LOWER in
   money. For an Egyptian user that is not a footnote, so the app shows both
   figures and names the authority beside each.                              */
function nisabCarat(){ var c=parseInt(db.zakat.nisabCarat||24); return (c===21?21:24); }
function nisabGoldAt(carat){ return (db.zakat.goldPrice||0)*85*(carat/24); }
function caratNoteHtml(){
  var ar=FIQH_AR(), g=db.zakat.goldPrice||0; if(!g) return '';
  var c=nisabCarat();
  return '<div class="panel"><h3 class="up">'+(ar?'عيار النصاب':'Which carat sets the niṣāb')+'</h3>'
   +'<p class="mini-help">'+(ar
     ?'النصاب 85 جرامًا من الذهب باتفاق، لكن من أي عيار؟ إسلام ويب: عيار 24. ودار الإفتاء المصرية: عيار 21. العيار 21 أقل بنحو 12.5% بالمال، أي أن عددًا أكبر يبلغ النصاب.'
     :'85 g of gold is agreed; the question is which carat. Islamweb says 24k. Dār al-Iftāʾ al-Miṣriyyah says 21k. The 21k threshold is about 12.5% lower in money, so more people reach it.')+'</p>'
   +zrow((ar?'عيار 24 — إسلام ويب':'24k — Islamweb')+(c===24?' ✓':''), fmt(nisabGoldAt(24),db.currency))
   +zrow((ar?'عيار 21 — دار الإفتاء المصرية':'21k — Dār al-Iftāʾ (Egypt)')+(c===21?' ✓':''), fmt(nisabGoldAt(21),db.currency))
   +'<p class="mini-help">'+(ar?'المستخدم الآن: عيار ':'In use: ')+c+(ar?'':'k')
   +' · islamweb.net/ar/fatwa/205648 · dar-alifta.org/ar/fatwa/details/11653</p></div>';
}

/* --- 4. Jewellery: name the dissent --------------------------------------
   Dorar 2134: exemption for worn jewellery is the jumhur. Malikis: the
   school's jumhur. Shafi'is: the asahh of two qawls (al-Shafi'i also has a
   qawl obliging it). Hanbalis: the madhhab, with a riwaya from Ahmad
   obliging it. Dorar names Ibn Hazm, al-San'ani, Ibn Baz and Ibn 'Uthaymin
   as choosing the obliging view.
   Ibn Baz: "الصواب من قولي العلماء أن الزكاة واجبة في الحلي إذا بلغ النصاب وحال
   عليه الحول" — binbaz.org.sa/fatwas/7766/القول-الراجح-في-زكاة-الحلي-المباح (Arabic slug required).
   Dar al-Ifta 22484: "لا زكاة على المرأة في الذهب الذي تملكه بقصد استعمالها
   إياه في التزيُّنِ به".
   So a user who follows Ibn Baz but set the app to Shafi'i was told their
   jewellery is exempt while their own marja' says otherwise. One note fixes
   it; the app does not change their setting for them.                       */
function jewelryNoteHtml(){
  if(db.zakat.jewelryZakat) return '';
  var ar=FIQH_AR();
  return '<div class="panel"><h3 class="up">'+(ar?'حلي الزينة — تنبيه':'Worn jewellery — worth knowing')+'</h3>'
   +'<p class="mini-help">'+(ar
     ?'إعدادك الحالي: لا زكاة في الحلي المُعدّ للّبس، وهو قول الجمهور وعليه دار الإفتاء المصرية. لكن ابن باز وابن عثيمين يريان وجوب الزكاة فيه إذا بلغ النصاب. إن كنت تقلّد أحدهما فَعَلِّم خيار «زكاة الحلي» في الإعدادات.'
     :'Your setting: no zakāt on jewellery kept to wear — the jumhūr view, and Dār al-Iftāʾ al-Miṣriyyah’s. But Ibn Bāz and Ibn ʿUthaymīn both hold it IS zakatable once it reaches niṣāb. If you follow either of them, turn on “zakāt on jewellery” in settings.')+'</p>'
   +'<p class="mini-help">dorar.net/feqhia/2134 · binbaz.org.sa/fatwas/7766/القول-الراجح-في-زكاة-الحلي-المباح · dar-alifta.org/ar/fatwa/details/22484</p></div>';
}

/* --- 5. The silver basis was mislabelled as Hanafi ------------------------
   Taking whichever metal gives the LOWER threshold is الأحظ للفقراء, and
   Islamweb 362137 puts it with the jumhur — the Hanbalis and Abu Hanifa in
   one narration — "والأظهر هو قول الجمهور، وهو الذي اختارته اللجنة الدائمة للإفتاء".
   The dissenters are Abu Yusuf (himself a Hanafi) and the Shafi'is. And
   Islamweb 325735 applies it to paper money generally, not as a Hanafi-only
   setting: "نصاب زكاة المال من الأوراق النقدية ... يرجع في تقديره إلى الأحظ للفقراء".
   So it is offered to everyone, under its own name.                          */
function nisabLower(){
  var g=nisabGoldAt(nisabCarat()), s=(db.zakat.silverPrice||0)*595;
  if(g>0&&s>0) return Math.min(g,s);
  return g>0?g:s;
}
function basisLabel(b){
  var ar=FIQH_AR();
  if(b==='silver') return ar?'الفضة (595 جم)':'Silver (595 g)';
  if(b==='lower')  return ar?'الأحظ للفقراء — الأقل من النصابين':'Whichever is lower (al-aḥaẓ li’l-fuqarāʾ)';
  return ar?'الذهب (85 جم)':'Gold (85 g)';
}

/* --- 6. Debts owed TO you: deferred, not forgiven -------------------------
   Islamweb 121282: on collecting from a debtor who was insolvent or denying,
   the jumhur charge zakat for ALL elapsed years; the Malikis (and Ibn
   'Uthaymin's choice) one year; Abu Hanifa starts a fresh hawl.
   The app said such debts were "excluded", which reads as forgiven.
   Note: Islamweb 348592 frames the two cases as solvent-and-acknowledging
   vs insolvent-or-denying. It does NOT use the words المرجو / غير المرجو, so
   the app does not put that phrasing in its mouth.                          */
function doubtfulNoteHtml(){
  var n=db.debts.filter(function(d){return d.type==='owed_to_me'&&!d.settled&&d.doubtful;}).length;
  if(!n) return '';
  var ar=FIQH_AR();
  return '<div class="panel"><h3 class="up">'+(ar?'ديون لك مؤجّلة الزكاة':'Debts owed to you — deferred, not written off')+'</h3>'
   +'<p class="mini-help">'+(ar
     ?('استبعدنا '+n+' من حساب هذا العام لأن المدين معسر أو منكر. هذا تأجيل لا إسقاط: إذا قبضتها فالجمهور يوجب زكاة كل السنين الماضية، والمالكية (واختاره ابن عثيمين) سنة واحدة، وأبو حنيفة يستأنف حولًا جديدًا.')
     :('We left '+n+' out of this year’s figure because the debtor is insolvent or denies the debt. That is a deferral, not a write-off: if you collect, the jumhūr charge zakāt for every elapsed year, the Mālikīs (and Ibn ʿUthaymīn’s choice) for one year, and Abū Ḥanīfa starts a fresh ḥawl.'))+'</p>'
   +'<p class="mini-help">islamweb.net/ar/fatwa/121282 · islamweb.net/ar/fatwa/348592</p></div>';
}

/* --- 7. The hawl is counted in hijri months, not days ---------------------
   Islamweb 10550: "الزكاة يعتبر حولها بالسنة القمرية وشهورها، وليس بالسنة الشمسية".
   That page gives NO day count, so the app stops attributing 354 to it.
   Dar al-Ifta 19862 is where a number is actually sourced: the solar year is
   ~11 days longer, and solar accounting is permitted only at 2.577%
   (= 2.5% x 365 / 354).                                                      */
function hawlEndISO(startISO){
  var d=new Date(startISO); if(isNaN(d)) return null;
  try{
    // One hijri year on, by the calendar itself rather than a day counter,
    // which drifts about a third of a day every year.
    var f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{year:'numeric',month:'numeric',day:'numeric'});
    var p=f.formatToParts(d), y=0,m=0,dd=0;
    for(var i=0;i<p.length;i++){ if(p[i].type==='year')y=parseInt(p[i].value);
      else if(p[i].type==='month')m=parseInt(p[i].value); else if(p[i].type==='day')dd=parseInt(p[i].value); }
    if(y&&m&&dd){
      // Walk forward day by day until the hijri year has advanced by one and
      // the month/day match or pass. Cheap, exact, and no calendar maths.
      var probe=new Date(d.getTime()), guard=0;
      while(guard++ < 400){
        probe.setDate(probe.getDate()+1);
        var q=f.formatToParts(probe), qy=0,qm=0,qd=0;
        for(var j=0;j<q.length;j++){ if(q[j].type==='year')qy=parseInt(q[j].value);
          else if(q[j].type==='month')qm=parseInt(q[j].value); else if(q[j].type==='day')qd=parseInt(q[j].value); }
        if(qy>y && (qm>m || (qm===m && qd>=dd))) return toISODate(probe);
      }
    }
  }catch(e){}
  var f2=new Date(d); f2.setDate(f2.getDate()+354); return toISODate(f2);   // fallback
}

/* --- Talking to Attune ----------------------------------------------------
   Yusr has no model and never will. When it needs one it asks across the
   bridge and Attune runs it. Inference lives in exactly one place, so there
   is one prompt to audit rather than two, and Yusr keeps working normally
   when no model is loaded — it just does not offer the draft button.        */
var AI_BRIDGE = { up:false, waiting:{} , seq:0 };

function aiAvailable(){ return !!AI_BRIDGE.up; }

// Ask Attune for something. `cb(result)` runs when the answer comes back, or
// with {ok:false} if nothing answers in time. A silent hang is worse than a
// refusal, so every request has a deadline.
function aiAsk(kind, text, cb){
  if(!aiAvailable()){ cb({ok:false, why: db.lang==='ar'
    ? 'الذكاء الاصطناعي غير متاح الآن — افتح Attune وحمّل نموذجًا.'
    : 'No model available — open Attune and load one.'}); return; }
  var id = 'y'+(++AI_BRIDGE.seq)+'_'+Date.now();
  AI_BRIDGE.waiting[id] = { cb: cb, at: Date.now() };
  try{
    parent.postMessage({ ns:'yusr-bridge', v:1, type:'ai-request',
      data:{ kind:kind, text:String(text||'').slice(0,4000), id:id, currency:db.currency } }, '*');
  }catch(e){ delete AI_BRIDGE.waiting[id]; cb({ok:false, why:String(e.message||e)}); return; }
  setTimeout(function(){
    var w = AI_BRIDGE.waiting[id]; if(!w) return;
    delete AI_BRIDGE.waiting[id];
    w.cb({ok:false, why: db.lang==='ar' ? 'لم يرد النموذج في الوقت المتاح.' : 'The model did not answer in time.'});
  }, 90000);
}
function aiDeliver(msg){
  var d = msg && msg.data; if(!d || !d.id) return;
  var w = AI_BRIDGE.waiting[d.id]; if(!w) return;
  delete AI_BRIDGE.waiting[d.id];
  w.cb(d.result || {ok:false, why:'empty result'});
}

/* --- AI invoice drafting --------------------------------------------------
   He types the job the way he'd say it down the phone. Attune's model splits
   it into lines. EVERY NUMBER is checked against his own words before it
   reaches the form — a model that turns 12,000 into 12,500 produces an
   invoice that looks right, gets sent, and is wrong by 500 a day.
   Nothing is saved by this. It fills the form; he edits and saves.          */
function bizDraftUi(){
  var ar = db.lang==='ar';
  return '<div class="field" id="inv-ai-wrap">'
   +'<label>'+(ar?'اكتب الشغلانة بكلامك':'Describe the job in your own words')+'</label>'
   +'<textarea id="inv-ai-text" rows="2" placeholder="'
   +(ar?'فاتورة لشركة النور، 3 أيام ونش 50 طن بـ 12000 في اليوم، خصم 5%'
       :'Invoice Al Nour, 3 days 50t crane at 12000 a day, 5% discount')+'"></textarea>'
   +'<button class="btn ghost" id="inv-ai-go" onclick="bizDraft()">'
   +(ar?'اكتبها لي':'Draft it for me')+'</button>'
   +'<p class="mini-help" id="inv-ai-note">'+(ar
     ?'يملأ النموذج فقط — تراجع كل سطر وتعدّله قبل الحفظ. لن يُستخدم أي رقم لم تكتبه أنت.'
     :'This only fills the form — you check and edit every line before saving. No number you didn\'t write will be used.')
   +'</p></div>';
}
function bizDraft(){
  var ar = db.lang==='ar';
  var box = document.getElementById('inv-ai-text');
  var note = document.getElementById('inv-ai-note');
  var btn = document.getElementById('inv-ai-go');
  var text = (box && box.value || '').trim();
  if(!text){ toast(ar?'اكتب الشغلانة الأول':'Describe the job first'); return; }
  btn.disabled = true; btn.textContent = ar?'جارٍ الكتابة…':'Drafting…';
  aiAsk('invoice-draft', text, function(res){
    btn.disabled = false; btn.textContent = ar?'اكتبها لي':'Draft it for me';
    if(!res || !res.ok){
      // When every line was refused, the WARNINGS are the useful part — they
      // name the number that was wrong. Showing only "nothing could be read"
      // would hide exactly what he needs to fix.
      var msg = [];
      if(res && res.warnings && res.warnings.length) msg = msg.concat(res.warnings);
      else if(res && res.why) msg.push(res.why);
      else msg.push(ar?'تعذّر إنشاء المسودة.':'Could not draft that.');
      note.innerHTML = msg.map(function(l){ return esc(l); }).join('<br>');
      return;
    }
    bizApplyDraft(res);
  });
}
function bizApplyDraft(d){
  var ar = db.lang==='ar';
  if(d.client){ var c=document.getElementById('inv-client'); if(c && !c.value) c.value=d.client; }
  if(d.items && d.items.length){
    state.invItems = d.items.map(function(it){
      return { name:String(it.name||''), qty:Number(it.qty)||1, price:Number(it.price)||0 };
    });
    renderInvItems();
  }
  if(d.discount){ var dis=document.getElementById('inv-discount'); if(dis) dis.value=d.discount; }
  if(d.taxPct){ var tx=document.getElementById('inv-tax'); if(tx) tx.value=d.taxPct; }
  // Anything the check threw out is said out loud. A silently shortened
  // invoice is the failure this whole design is avoiding.
  var note = document.getElementById('inv-ai-note');
  var lines = [];
  lines.push(ar?('تمت كتابة '+(d.items?d.items.length:0)+' سطر — راجعها وعدّلها.')
               :((d.items?d.items.length:0)+' line(s) drafted — check and edit them.'));
  if(d.warnings && d.warnings.length) lines = lines.concat(d.warnings);
  if(d.note) lines.push((ar?'لم يُوضَع: ':'Not placed: ')+d.note);
  note.innerHTML = lines.map(function(l){ return esc(l); }).join('<br>');
  toast('✓');
}

   +'<p class="mini-help">'+(ar
     ?'لو شغّلته، المعاملات اللي تأكّدها هنا تتحفظ في ذاكرة Attune، فتقدر تسأل «صرفت كام على شغل مدينة نصر؟» بعد شهور. كل ده على جهازك، ولا يخرج منه. تقدر تغيّره في أي وقت.'
     :'With it on, transactions you confirm here are kept in Attune’s memory, so months later you can ask “how much did I spend on the Nasr City job?”. All of it stays on this device. You can change it any time.')
   +'</p>'
   +'<button class="btn" onclick="setShare(\'on\')">'+(ar?'اربطهما':'Link them')+'</button>'
   +'<button class="btn ghost" onclick="setShare(\'off\')" style="margin-top:8px">'
   +(ar?'خلّي يُسر لوحده':'Keep Yusr to itself')+'</button></div>';

// The child half of the bridge already listens for propose-txn; ai-result
// arrives on the same channel and is routed to whoever asked for it.
(function(){
  var prior = window.onmessage;
  window.addEventListener('message', function(e){
    var m = e && e.data;
    if(!m || m.ns !== 'yusr-bridge' || m.v !== 1) return;
    // Attune announcing itself is how Yusr learns a model is reachable.
    if(m.type === 'request' || m.type === 'propose-txn' || m.type === 'ai-result') AI_BRIDGE.up = true;
    if(m.type === 'ai-result') aiDeliver(m);
  });
})();

/* ==========================================================================
   INVOICE TEMPLATES
   --------------------------------------------------------------------------
   A business does not send one kind of invoice. A crane company bills day
   rates, mobilisation, overtime and waiting time; the same company also
   bills a bare "monthly retainer". Retyping that every time is the reason
   people go back to Excel.

   A template holds: the business's own header (name, phone, tax number,
   address), its colour, its terms and payment line, its default tax and
   discount, and its usual line items with prices. Applying one fills the
   whole form. Everything stays editable, and a template never touches an
   invoice that is already saved.
   ========================================================================== */

function tmplAll(){ db.invTemplates = db.invTemplates || []; return db.invTemplates; }
function tmplById(id){ return tmplAll().find(function(t){ return t.id===id; }) || null; }

// Reads the CURRENT state of the invoice sheet. Saving a template is "keep
// what I just typed", which is how anyone would expect it to work.
function tmplFromSheet(name){
  var g = function(id){ var e=document.getElementById(id); return e?e.value:''; };
  return {
    id: uid(), name: String(name||'').trim().slice(0,60),
    trade: g('inv-trade'),
    taxPct: parseFloat(g('inv-tax'))||0,
    discount: parseFloat(g('inv-discount'))||0,
    items: (state.invItems||[]).filter(function(it){ return it.name; })
             .map(function(it){ return { name:it.name, qty:Number(it.qty)||1, price:Number(it.price)||0 }; }),
    // Branding, which is the part people actually want.
    biz: {
      name: (db.bizName||''), phone: (db.bizPhone||''), taxNo: (db.bizTaxNo||''),
      address: (db.bizAddress||''), colour: (db.bizColour||'#14b8a6'),
    },
    terms: (db.invTerms||''),
    ts: Date.now(),
  };
}
function tmplSave(){
  var ar = db.lang==='ar';
  var name = (document.getElementById('inv-tmpl-name')||{}).value || '';
  if(!name.trim()){ toast(ar?'اكتب اسم القالب':'Name the template'); return; }
  var t = tmplFromSheet(name);
  if(!t.items.length){ toast(ar?'أضف صنفًا واحدًا على الأقل':'Add at least one item first'); return; }
  // Same name replaces, so saving twice doesn't quietly make a second copy.
  var list = tmplAll().filter(function(x){ return x.name !== t.name; });
  db.invTemplates = [t].concat(list).slice(0, 40);
  save(); toast('✓'); tmplRenderPicker();
}
function tmplApply(id){
  var t = tmplById(id); if(!t) return;
  var set = function(el,v){ var e=document.getElementById(el); if(e && v!=null) e.value=v; };
  set('inv-trade', t.trade);
  set('inv-tax', t.taxPct||'');
  set('inv-discount', t.discount||'');
  if(t.items && t.items.length){
    state.invItems = JSON.parse(JSON.stringify(t.items));
    renderInvItems();
  }
  if(t.biz){
    db.bizName=t.biz.name; db.bizPhone=t.biz.phone; db.bizTaxNo=t.biz.taxNo;
    db.bizAddress=t.biz.address; db.bizColour=t.biz.colour;
  }
  if(t.terms!=null) db.invTerms=t.terms;
  save();
  var n=document.getElementById('inv-tmpl-name'); if(n) n.value=t.name;
  toast('✓');
}
function tmplDelete(id){
  db.invTemplates = tmplAll().filter(function(t){ return t.id!==id; });
  save(); toast('✓'); tmplRenderPicker();
}
function tmplPickerHtml(){
  var ar = db.lang==='ar', list = tmplAll();
  var h = '<div class="field" id="inv-tmpl-wrap">'
   +'<label>'+(ar?'القوالب':'Templates')+'</label>'
   +'<div id="inv-tmpl-list"></div>'
   +'<input id="inv-tmpl-name" placeholder="'+(ar?'اسم القالب — مثلاً: إيجار ونش يومي':'Template name — e.g. Daily crane hire')+'">'
   +'<button class="btn ghost" onclick="tmplSave()">'
   +(ar?'احفظ الفاتورة الحالية كقالب':'Save this invoice as a template')+'</button>'
   +'<p class="mini-help">'+(ar
     ?'القالب يحفظ الأصناف والأسعار وبيانات شركتك وشروط الدفع. تطبيقه يملأ الفاتورة، وكل حاجة تفضل قابلة للتعديل.'
     :'A template keeps your items and prices, your business details and your payment terms. Applying one fills the invoice, and everything stays editable.')
   +'</p></div>';
  return h;
}
function tmplRenderPicker(){
  var el = document.getElementById('inv-tmpl-list'); if(!el) return;
  var ar = db.lang==='ar', list = tmplAll();
  if(!list.length){
    el.innerHTML = '<p class="mini-help">'+(ar?'لا قوالب بعد.':'No templates yet.')+'</p>';
    return;
  }
  el.innerHTML = list.map(function(t){
    return '<div class="chkrow" style="gap:8px">'
      +'<button class="btn ghost" style="flex:1;text-align:start" onclick="tmplApply(\''+t.id+'\')">'
      +esc(t.name)+' <span class="mini-help">· '+(t.items||[]).length+(ar?' صنف':' item(s)')+'</span></button>'
      +'<button class="btn ghost" onclick="tmplDelete(\''+t.id+'\')" aria-label="delete">✕</button>'
      +'</div>';
  }).join('');
}

/* --- the business header, which is what makes an invoice look like yours -- */
function bizHeaderHtml(){
  var ar = db.lang==='ar';
  return '<div class="field"><label>'+(ar?'بيانات شركتك على الفاتورة':'Your business, as it appears on the invoice')+'</label>'
   +'<input id="biz-name" placeholder="'+(ar?'اسم الشركة':'Business name')+'" value="'+esc(db.bizName||'')+'" oninput="bizSave()">'
   +'<input id="biz-phone" placeholder="'+(ar?'تليفون':'Phone')+'" value="'+esc(db.bizPhone||'')+'" oninput="bizSave()">'
   +'<input id="biz-taxno" placeholder="'+(ar?'الرقم الضريبي':'Tax number')+'" value="'+esc(db.bizTaxNo||'')+'" oninput="bizSave()">'
   +'<input id="biz-address" placeholder="'+(ar?'العنوان':'Address')+'" value="'+esc(db.bizAddress||'')+'" oninput="bizSave()">'
   +'<input id="inv-terms" placeholder="'+(ar?'شروط الدفع — مثلاً: الدفع خلال 15 يوم':'Payment terms — e.g. payable within 15 days')+'" value="'+esc(db.invTerms||'')+'" oninput="bizSave()">'
   +'<p class="mini-help">'+(ar?'يظهر أعلى كل فاتورة، ويُحفظ في القالب.':'Appears at the top of every invoice, and is kept in the template.')+'</p></div>';
}
function bizSave(){
  var g=function(id){ var e=document.getElementById(id); return e?e.value:''; };
  db.bizName=g('biz-name'); db.bizPhone=g('biz-phone'); db.bizTaxNo=g('biz-taxno');
  db.bizAddress=g('biz-address'); db.invTerms=g('inv-terms');
  save(true);                       // silent: this fires on every keystroke
}
