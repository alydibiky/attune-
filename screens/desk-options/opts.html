<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#111416;color:#E7EAEA;width:1440px;height:900px;display:flex;overflow:hidden}
.side{width:260px;background:#15191b;border-right:1px solid #262C2F;padding:18px 14px;font-size:14px;color:#c9d0d0}.side b{display:block;font-size:17px;margin-bottom:18px;color:#fff}.side div{padding:9px 10px;border-radius:9px}.side .on{background:#1d2427;color:#fff}
.main{flex:1;padding:28px 36px;overflow:hidden}
h1{font-size:24px;font-weight:700}.sub{color:#9AA3A5;font-size:13.5px;margin-top:4px}
.card{background:#181C1F;border:1px solid #262C2F;border-radius:16px;padding:18px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9AA3A5;font-weight:600;margin-bottom:8px}
.ta{background:#111416;border:1px solid #2b3337;border-radius:12px;height:150px;padding:12px;color:#6b7578;font-size:14px}
.btn{background:#4FC2AF;color:#0B1A17;border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px;display:inline-block}
.ghost{border:1px solid #2b3337;border-radius:10px;padding:10px 14px;font-size:14px;display:inline-block;color:#c9d0d0}
.row{display:flex;gap:10px;align-items:center}.big{font-size:30px;font-weight:700}.pos{color:#5BC48A}.warn{color:#E3A44A}.neg{color:#F07A6E}
.li{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid #262C2F;font-size:14px}.li:first-child{border-top:0}
.chip{font-size:12px;border:1px solid #2b3337;border-radius:99px;padding:5px 10px;color:#c9d0d0}
.tag{position:absolute;top:10px;right:16px;background:#4FC2AF;color:#0B1A17;font-weight:700;padding:6px 12px;border-radius:99px;font-size:14px}
</style></head><body>
<div class="side"><b>Attune</b><div>Home</div><div>Chat</div><div class="on">Tools</div><div>Mind</div><div>Money</div><div>Business</div></div>
<div class="main" id="m"></div>
<script>
const opt = location.hash.slice(1);
const head = `<h1>🛡 Deal Check</h1><p class="sub">Before you pay or sign: paste the offer — Attune works out the real cost, checks the price and looks for scam signs.</p>`;
const input = `<div class="card"><div class="lbl">The offer</div><div class="ta">“iPhone 15 Pro 256GB, like new, 38,000 EGP, deposit on Vodafone Cash to hold it”</div><div class="row" style="margin-top:12px"><span class="ghost">📷 Screenshot</span><span class="btn">Check this deal</span></div></div>`;
const result = `<div class="card"><div class="lbl">Verdict</div><div class="big warn">Risky — don't send a deposit</div><p class="sub" style="margin-top:6px">Market price for this phone used: 33,000–36,000 EGP. Deposits on Vodafone Cash can't be reversed.</p>
<div style="margin-top:14px"><div class="li"><span>Asking price</span><b>38,000 EGP</b></div><div class="li"><span>Usual price (used, 256GB)</span><b>33,000–36,000</b></div><div class="li"><span>Deposit before seeing it</span><b class="neg">Scam sign</b></div><div class="li"><span>Real cost if paid in 3 instalments</span><b>39,900 EGP</b></div></div></div>`;
const reply = `<div class="card"><div class="lbl">Your reply</div><p style="font-size:14px;line-height:1.6">“Thanks — I'd like to see it in person and pay on handover. Would 35,000 work?”</p><div class="row" style="margin-top:10px"><span class="ghost">Copy</span><span class="ghost">Send on WhatsApp</span></div></div>`;
const history = `<div class="card"><div class="lbl">Recent checks</div><div class="li"><span>Used Corolla 2019</span><span class="pos">Fair</span></div><div class="li"><span>Flat rent — Nasr City</span><span class="warn">A bit high</span></div><div class="li"><span>valU 12 months</span><span class="neg">Costly</span></div></div>`;
let html = "";
if (opt === "A") html = `<span class="tag">A · Two panels</span>${head}<div style="display:grid;grid-template-columns:440px 1fr;gap:20px;margin-top:20px"><div style="display:flex;flex-direction:column;gap:16px">${input}${history}</div><div style="display:flex;flex-direction:column;gap:16px">${result}${reply}</div></div>`;
if (opt === "B") html = `<span class="tag">B · Centre column + side rail</span><div style="display:grid;grid-template-columns:1fr 300px;gap:24px;max-width:1080px;margin:0 auto"><div style="display:flex;flex-direction:column;gap:16px">${head}${input}${result}${reply}</div><div style="display:flex;flex-direction:column;gap:16px;padding-top:70px">${history}<div class="card"><div class="lbl">Tips</div><p class="sub">Never pay a deposit before you see the item. Ask for a video call.</p></div></div></div>`;
if (opt === "C") html = `<span class="tag">C · Dashboard cards</span>${head}<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:20px"><div style="grid-column:span 2">${input}</div>${history}<div style="grid-column:span 2">${result}</div>${reply}</div>`;
document.getElementById("m").innerHTML = html; document.getElementById("m").style.position = "relative";
</script></body></html>
