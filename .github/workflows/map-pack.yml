name: Build a country map

# v6.15/6.16 — whole-country offline maps for Attune (Maps → Offline maps). For each country in
# tools/map_countries.json (44 packs, ~50 countries):
#   map-<code>/<code>.pmtiles         the vector map: cut from the newest daily OpenStreetMap build by Protomaps
#   map-<code>/<code>-places.sqlite   offline search: every named place, street, shop (Geofabrik's daily extract)
#   map-<code>/<code>-manifest.json   date, sizes, SHA-256 — the app compares the date to offer an update
# Files over 1.9 GB are published in parts (<name>.001 …); the phone joins them. Once: map-assets/ (fonts, icons).
# Every Friday it rebuilds ALL countries (4 at a time) so the maps stay up to date; run it by hand for some only
# (countries = "eg tr"), or "all". Data © OpenStreetMap contributors (ODbL).

on:
  schedule:
    - cron: "17 2 * * 5"
  workflow_dispatch:
    inputs:
      countries:
        description: "Country codes, space-separated (see tools/map_countries.json), or all"
        default: "eg"
      maxzoom:
        description: "Most detailed zoom; empty = the country's own (15, or 13–14 for the biggest)"
        default: ""
      assets:
        description: "Rebuild the fonts and icons too? (yes/no)"
        default: "no"
      world:
        description: "Rebuild the world overview map (every country, low zoom) too? (yes/no)"
        default: "yes"
      world_maxzoom:
        description: "Most detailed zoom of the world overview"
        default: "6"

permissions:
  contents: write

concurrency:
  group: map-pack
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          codes="${{ github.event.inputs.countries }}"
          if [ -z "$codes" ] || [ "$codes" = "all" ]; then list=$(python3 tools/build_map_pack.py all)
          else list=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' "$codes"); fi
          echo "list=$list" >> $GITHUB_OUTPUT; echo "$list"

  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fonts and icons (only when missing, or asked)
        run: |
          if gh release view map-assets >/dev/null 2>&1 && [ "${{ github.event.inputs.assets }}" != "yes" ]; then echo "map-assets already published"; exit 0; fi
          A=https://protomaps.github.io/basemaps-assets
          mkdir -p fonts sprites/v4 out
          for font in "Noto Sans Regular" "Noto Sans Medium" "Noto Sans Italic"; do
            mkdir -p "fonts/$font"
            # Latin (with Turkish), Greek, Cyrillic, Arabic + supplements, punctuation, Arabic presentation forms
            for s in 0 256 512 768 1024 1280 1536 1792 2048 7680 7936 8192 8448 8704 64256 64512 64768 65024 65280; do
              r="$s-$((s+255))"
              curl -sfL "$A/fonts/${font// /%20}/$r.pbf" -o "fonts/$font/$r.pbf" || rm -f "fonts/$font/$r.pbf"
            done
          done
          for s in dark light; do for v in "" "@2x"; do for e in json png; do
            curl -sfL "$A/sprites/v4/$s$v.$e" -o "sprites/v4/$s$v.$e"
          done; done; done
          du -sh fonts sprites
          python3 tools/build_map_pack.py assets fonts sprites out
          gh release view map-assets >/dev/null 2>&1 || gh release create map-assets --title "Offline maps: fonts and icons" --notes "Fonts (Noto Sans, SIL OFL) and icons for Attune's offline maps (Protomaps basemaps-assets)."
          gh release upload map-assets out/map-assets.zip out/assets-manifest.json --clobber

  # v6.27: the world overview (map-wld) — every country at low zoom, so the app never needs OpenStreetMap's own tile
  # servers (they forbid apps: 403 on the desktop). The app downloads it by itself on Wi-Fi when no map is installed.
  world:
    needs: [assets]
    if: github.event_name == 'schedule' || github.event.inputs.world != 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          gh release download -R protomaps/go-pmtiles -p "go-pmtiles_*_Linux_x86_64.tar.gz" -O pm.tgz
          tar xzf pm.tgz pmtiles && sudo mv pmtiles /usr/local/bin/ && pmtiles version
      - name: The newest OpenStreetMap build
        id: b
        run: |
          for i in $(seq 0 14); do
            d=$(date -u -d "-$i day" +%Y%m%d)
            if curl -sfI "https://build.protomaps.com/$d.pmtiles" >/dev/null; then echo "date=$d" >> $GITHUB_OUTPUT; echo "build $d"; exit 0; fi
          done
          echo "No Protomaps build found in the last 2 weeks"; exit 1
      - name: The world overview (vector tiles, whole planet, low zoom)
        run: |
          mkdir -p out
          mz="${{ github.event.inputs.world_maxzoom }}"; [ -z "$mz" ] && mz=6
          pmtiles extract "https://build.protomaps.com/${{ steps.b.outputs.date }}.pmtiles" out/wld.pmtiles --maxzoom="$mz" --download-threads=8
          ls -la out
      - name: Publish
        run: |
          d="${{ steps.b.outputs.date }}"; date="${d:0:4}-${d:4:2}-${d:6:2}"
          python3 tools/build_map_pack.py manifest wld "World" "$date" out wld.pmtiles > uploads.txt
          cat uploads.txt
          gh release view map-wld >/dev/null 2>&1 || gh release create map-wld --title "Offline map: World overview" --notes "Attune's world overview map (every country, low zoom). Data © OpenStreetMap contributors (ODbL); tiles: Protomaps build. Rebuilt every week."
          xargs -a uploads.txt -d '\n' gh release upload map-wld --clobber
          { echo "### World overview — data of $date"; ls -la out | sed 's/^/    /'; } >> $GITHUB_STEP_SUMMARY

  country:
    needs: [plan, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        code: ${{ fromJSON(needs.plan.outputs.list) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Room on the disk (the biggest countries need ~40 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - name: Which country
        id: c
        run: |
          IFS=$'\t' read -r gf name mz < <(python3 tools/build_map_pack.py country "${{ matrix.code }}")
          [ -n "${{ github.event.inputs.maxzoom }}" ] && mz="${{ github.event.inputs.maxzoom }}"
          echo "gf=$gf" >> $GITHUB_OUTPUT; echo "name=$name" >> $GITHUB_OUTPUT; echo "maxzoom=$mz" >> $GITHUB_OUTPUT
          echo "$name ($gf), zoom up to $mz"
      - name: Tools
        run: |
          sudo apt-get install -y -qq osmium-tool >/dev/null
          pip install osmium
          gh release download -R protomaps/go-pmtiles -p "go-pmtiles_*_Linux_x86_64.tar.gz" -O pm.tgz
          tar xzf pm.tgz pmtiles && sudo mv pmtiles /usr/local/bin/ && pmtiles version
      - name: The newest OpenStreetMap build
        id: b
        run: |
          for i in $(seq 0 14); do
            d=$(date -u -d "-$i day" +%Y%m%d)
            if curl -sfI "https://build.protomaps.com/$d.pmtiles" >/dev/null; then echo "date=$d" >> $GITHUB_OUTPUT; echo "build $d"; exit 0; fi
          done
          echo "No Protomaps build found in the last 2 weeks"; exit 1
      - name: The map (vector tiles, cut to the country)
        run: |
          mkdir -p out
          curl -sfL "https://download.geofabrik.de/${{ steps.c.outputs.gf }}.poly" -o region.poly
          python3 tools/build_map_pack.py region region.poly region.geojson
          pmtiles extract "https://build.protomaps.com/${{ steps.b.outputs.date }}.pmtiles" "out/${{ matrix.code }}.pmtiles" \
            --region=region.geojson --maxzoom="${{ steps.c.outputs.maxzoom }}" --download-threads=8
          ls -la out
      - name: The search index (every named place, street and shop)
        run: |
          curl -sfL "https://download.geofabrik.de/${{ steps.c.outputs.gf }}-latest.osm.pbf" -o country.osm.pbf
          ls -la country.osm.pbf
          # keep only what has a name (and the points of named roads): the USA's 11 GB becomes small enough for memory
          osmium tags-filter country.osm.pbf nwr/name nwr/name:ar nwr/name:en -o named.osm.pbf --overwrite
          rm -f country.osm.pbf; ls -la named.osm.pbf
          python3 tools/build_map_pack.py places named.osm.pbf "out/${{ matrix.code }}-places.sqlite"
          rm -f named.osm.pbf; ls -la out
      - name: More places (Overture Maps — shops, clinics, compounds OpenStreetMap doesn't have)
        run: |
          pip install pyarrow
          # a failure here keeps the OpenStreetMap index as it is (the map is still published)
          python3 tools/build_map_pack.py overture "${{ matrix.code }}" region.geojson "out/${{ matrix.code }}-places.sqlite" || echo "Overture step failed — publishing without it"
          ls -la out
      - name: Offline directions (the road network as a route file, read by web-src/route.js)
        run: |
          # an optional download in the app; a country too big for the runner is published without it
          timeout 120m python3 tools/build_route_graph.py "${{ matrix.code }}" region.geojson "out/${{ matrix.code }}-route.bin" || { echo "Directions step failed — publishing without them"; rm -f "out/${{ matrix.code }}-route.bin"; }
          ls -la out
      - name: Publish (the app offers it as an update)
        run: |
          d="${{ steps.b.outputs.date }}"; date="${d:0:4}-${d:4:2}-${d:6:2}"
          extra=""; [ -f "out/${{ matrix.code }}-route.bin" ] && extra="${{ matrix.code }}-route.bin"
          python3 tools/build_map_pack.py manifest "${{ matrix.code }}" "${{ steps.c.outputs.name }}" "$date" out "${{ matrix.code }}.pmtiles" "${{ matrix.code }}-places.sqlite" $extra > uploads.txt
          cat uploads.txt
          tag="map-${{ matrix.code }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Offline map: ${{ steps.c.outputs.name }}" --notes "Attune offline map of ${{ steps.c.outputs.name }}. Data © OpenStreetMap contributors (ODbL); more places from Overture Maps Foundation (CDLA-Permissive-2.0 and others). Rebuilt every week."
          xargs -a uploads.txt -d '\n' gh release upload "$tag" --clobber
          { echo "### ${{ steps.c.outputs.name }} — data of $date"; ls -la out | sed 's/^/    /'; } >> $GITHUB_STEP_SUMMARY
