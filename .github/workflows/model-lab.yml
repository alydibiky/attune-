name: Model lab (speed, memory, prompt cache, real trials)

# v6.18 — Ali: "bring models faster, stronger and more efficient, using the phone's storage to be less heavy; look at Chinese models".
# On an ARM runner (the phone's chip family) this measures, for each candidate model:
#   speed (reading / writing tokens a second, with flash attention and the 8-bit KV cache the phone uses, and with half the threads = less heat),
#   memory (mapped vs copied weights), and what a saved prompt cache on storage would save after a reload (tests/models/lab.py);
#   then the app's own real trials (tests/trials/run2.sh: Arabic, maths, code, translation, photos off) — checks by code.
# The baseline is the Qwen3.5 4B the app ships; Ling-3.0-tiny (7.9B MoE, ~1.3B active) and MiniCPM5-2B are the Chinese-lab candidates.
# Run by hand; results are in each job's summary and in the uploaded reports.

on:
  workflow_dispatch:
    inputs:
      sections:
        description: "Trial sections (comma list; max.mjs names: deal,xray,action,fit,math,travel,business,code,translate,instant,mind,assistants)"
        default: "math,code,translate,deal,business"
      only:
        description: "Run only this candidate (codebench = the code bench, then sections = JSON list of code.js commits, head = this one; qwen35-4b, ling3-tiny, minicpm5-2b); empty = all"
        default: ""

jobs:
  lab:
    if: ${{ github.event.inputs.only != 'codebench' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: qwen35-4b,   search: "Qwen3.5-4B-GGUF",       quants: "Q4_K_M,IQ4_XS", need: "qwen3.5-4b", draft: "yes" }
          - { name: qwen35-9b,   search: "Qwen3.5-9B-GGUF",       quants: "IQ4_NL,Q4_K_M,IQ4_XS", need: "qwen3.5-9b", draft: "yes" }
          - { name: qwen35-4b-mtp, search: "Qwen3.5-4B-MTP",      quants: "Q4_K_M,IQ4_XS", need: "mtp 4b" }
          - { name: qwen35-9b-mtp, search: "Qwen3.5-9B-MTP",      quants: "IQ4_NL,Q4_K_M,IQ4_XS", need: "mtp 9b" }
          - { name: ling3-tiny,  search: "Ling-3.0-tiny",         quants: "Q4_K_M,IQ4_XS,Q4_0,Q3_K_M,Q8_0", need: "ling" }
          - { name: minicpm5-2b, search: "MiniCPM5-2B",           quants: "Q4_K_M,IQ4_XS,Q4_0,Q8_0", need: "minicpm5" }
          - { name: mimo-9b,     search: "MiMo-V2.6-Distill-Qwen-9B-GGUF", quants: "IQ4_XS,Q4_K_M,Q4_0", need: "mimo" }
          - { name: gemma4-e4b,  search: "gemma-4-E4B-it-GGUF",   quants: "Q4_0,Q4_K_M,IQ4_XS", need: "e4b" }
          - { name: gemma4-12b,  search: "gemma-4-12b-it-GGUF",   quants: "Q4_0,IQ4_XS,Q4_K_M", need: "12b" }
          - { name: granite42-8b, search: "granite-4.2-8b-GGUF",  quants: "IQ4_XS,Q4_K_M,Q4_0", need: "granite" }
          - { name: gemma4-e2b,  search: "gemma-4-E2B-it-GGUF",   quants: "Q4_0,Q4_K_M,IQ4_XS", need: "e2b" }
          - { name: lfm25-2b6,   search: "LFM2.5-2.6B-GGUF",      quants: "Q4_K_M,Q4_0,IQ4_XS", need: "lfm2.5" }
          - { name: lfm25-1b2,   search: "LFM2.5-1.2B-Instruct-GGUF", quants: "Q4_K_M,Q4_0", need: "lfm2.5" }
          - { name: lfm2-8b-a1b, search: "LFM2-8B-A1B",           quants: "Q4_K_M,IQ4_XS,Q4_0,Q8_0", need: "lfm2" }
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == matrix.name }}
      - uses: actions/setup-node@v4
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == matrix.name }}
        with: { node-version: 22 }
      - name: Build llama.cpp (the app's pinned commit, tuned for this processor)
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == matrix.name }}
        run: |
          git clone -q https://github.com/ggml-org/llama.cpp ~/llama.cpp
          cd ~/llama.cpp && git checkout -q 7ab4ee7baad2d920464cbacfad4f4b07cf111fd2
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DLLAMA_CURL=OFF > /dev/null
          cmake --build build --target llama-server llama-bench -j"$(nproc)" > /dev/null
          mkdir -p $GITHUB_WORKSPACE/tests/build-dl && cp -r build/bin $GITHUB_WORKSPACE/tests/build-dl/
          ls $GITHUB_WORKSPACE/tests/build-dl/bin | head
      - name: Find and download the model
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == matrix.name }}
        run: |
          read REPO FILE < <(python3 tests/models/resolve_hf.py "${{ matrix.search }}" "${{ matrix.quants }}" ${{ matrix.need }})
          echo "Model: $REPO / $FILE" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sSL --retry 5 -o ~/model.gguf "https://huggingface.co/$REPO/resolve/main/$FILE"
          ls -la ~/model.gguf
      - name: The 0.8B draft model (same family only)
        if: ${{ matrix.draft == 'yes' && (github.event.inputs.only == '' || github.event.inputs.only == matrix.name) }}
        run: curl -sSL --retry 5 -o ~/draft.gguf https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf && ls -la ~/draft.gguf
      - name: Lab — speed, memory, prompt cache, speculative decoding
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == matrix.name }}
        run: DRAFT_MODEL=$HOME/draft.gguf python3 tests/models/lab.py ~/model.gguf "$GITHUB_WORKSPACE/tests/build-dl/bin" "${{ matrix.name }}"
      - name: Real trials (the app's own prompts and checks)
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == matrix.name }}
        run: |
          cd tests/trials
          # run2.sh starts llama-server like the phone and then run.mjs + max.mjs; only the chosen sections of max.mjs here
          cd ../..
          export LD_LIBRARY_PATH="$PWD/tests/build-dl/bin"
          tests/build-dl/bin/llama-server -m ~/model.gguf --host 127.0.0.1 --port 8099 -c 8192 -t "$(nproc)" -np 1 --jinja --no-ui -fa on -ctk q8_0 -ctv q8_0 --cache-ram 0 > /tmp/server.log 2>&1 &
          for i in $(seq 1 600); do curl -s 127.0.0.1:8099/health | grep -q ok && break; sleep 1; done
          export MODEL_NAME="${{ matrix.name }}"
          TRIAL_REPORT="./max-${{ matrix.name }}.md" node tests/trials/max.mjs "${{ github.event.inputs.sections || 'math,code,translate,deal,business' }}" || true
          { echo; echo "### Real trials: ${{ matrix.name }}"; echo; tail -40 tests/trials/max-${{ matrix.name }}.md; } >> "$GITHUB_STEP_SUMMARY"
          # v6.12 the big test: ~170 cases in 15 categories (knowledge, reasoning, maths, instructions, extraction, long context, honesty, safety, common sense, memory, writing, translation, 12 languages, Egyptian Arabic, code)
          FULL_REPORT="$PWD/full-${{ matrix.name }}.md" node tests/trials/full.mjs || true
          { echo; echo "### Full test: ${{ matrix.name }}"; echo; head -30 "full-${{ matrix.name }}.md"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-lab-${{ matrix.name }}
          path: |
            lab-*.md
            tests/trials/max-*.md
            full-*.md
            full-*.json
  codebench:
    if: ${{ github.event.inputs.only == 'codebench' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event.inputs.sections) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build llama.cpp (pinned commit)
        run: |
          git clone -q https://github.com/ggml-org/llama.cpp ~/llama.cpp
          cd ~/llama.cpp && git checkout -q 7ab4ee7baad2d920464cbacfad4f4b07cf111fd2
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DLLAMA_CURL=OFF > /dev/null
          cmake --build build --target llama-server -j"$(nproc)" > /dev/null
          mkdir -p $GITHUB_WORKSPACE/tests/build-dl && cp -r build/bin $GITHUB_WORKSPACE/tests/build-dl/
      - name: Model
        run: |
          read REPO FILE < <(python3 tests/models/resolve_hf.py "Qwen3.5-4B-MTP" "Q4_K_M" mtp 4b)
          echo "Model: $REPO / $FILE" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sSL --retry 5 -o ~/model.gguf "https://huggingface.co/$REPO/resolve/main/$FILE"
      - name: Bench
        run: |
          V="${{ matrix.variant }}"; V="${V%%~*}"   # "abc123~2" = a repeat of abc123
          if [ "$V" != "head" ]; then git show "$V:web-src/code.js" > web-src/code.js; fi
          export LD_LIBRARY_PATH="$PWD/tests/build-dl/bin"
          tests/build-dl/bin/llama-server -m ~/model.gguf --host 127.0.0.1 --port 8099 -c 8192 -t "$(nproc)" -np 1 --jinja --no-ui -fa on --cache-ram 0 --spec-type draft-mtp --spec-draft-n-max 3 > /tmp/server.log 2>&1 &
          for i in $(seq 1 600); do curl -s 127.0.0.1:8099/health | grep -q ok && break; sleep 1; done
          CODE_THINK="${{ '' }}" MODEL_NAME="${{ matrix.variant }}" CODE_REPORT="$PWD/codebench-${{ matrix.variant }}.json" node tests/trials/codebench.mjs | tee codebench-${{ matrix.variant }}.log
          { echo '```'; cat codebench-${{ matrix.variant }}.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codebench-${{ matrix.variant }}
          path: codebench-*
  # only=quant: quality per GB. sections = JSON list of {"name","repo","file","sampling"(JSON string, optional),"cats"(optional),"extra"(server flags, optional)}.
  # Each one runs the full test (tests/trials/full.mjs) and records the server's peak memory (RSS).
  quant:
    if: ${{ github.event.inputs.only == 'quant' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        c: ${{ fromJSON(github.event.inputs.sections) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build llama.cpp (pinned commit)
        run: |
          git clone -q https://github.com/ggml-org/llama.cpp ~/llama.cpp
          cd ~/llama.cpp && git checkout -q 7ab4ee7baad2d920464cbacfad4f4b07cf111fd2
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DLLAMA_CURL=OFF > /dev/null
          cmake --build build --target llama-server -j"$(nproc)" > /dev/null
          mkdir -p $GITHUB_WORKSPACE/tests/build-dl && cp -r build/bin $GITHUB_WORKSPACE/tests/build-dl/
      - name: Model
        run: curl -sSL --retry 5 -o ~/model.gguf "https://huggingface.co/${{ matrix.c.repo }}/resolve/main/${{ matrix.c.file }}" && ls -la ~/model.gguf
      - name: Full test and peak memory
        run: |
          export LD_LIBRARY_PATH="$PWD/tests/build-dl/bin"
          /usr/bin/time -v -o /tmp/rss.txt tests/build-dl/bin/llama-server -m ~/model.gguf --host 127.0.0.1 --port 8099 -c 8192 -t "$(nproc)" -np 1 --jinja --no-ui -fa on -ctk q8_0 -ctv q8_0 --cache-ram 0 ${{ matrix.c.extra }} > /tmp/server.log 2>&1 &
          for i in $(seq 1 600); do curl -s 127.0.0.1:8099/health | grep -q ok && break; sleep 1; done
          FULL_SAMPLING='${{ matrix.c.sampling }}' MODEL_NAME="${{ matrix.c.name }}" FULL_REPORT="$PWD/full-${{ matrix.c.name }}.md" node tests/trials/full.mjs "${{ matrix.c.cats }}" | tail -20 | tee /tmp/sum.txt
          pkill -INT -f llama-server || true; sleep 8
          RSS=$(grep "Maximum resident" /tmp/rss.txt | awk '{print $NF}')
          echo "RESULT ${{ matrix.c.name }} file=${{ matrix.c.file }} peakRSS_MB=$((RSS/1024)) $(grep FULL /tmp/sum.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo '```'; cat /tmp/sum.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-${{ matrix.c.name }}
          path: full-*
