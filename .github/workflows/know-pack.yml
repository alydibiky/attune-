name: Build a knowledge pack

# v6.16 — the public Knowledge packs (Knowledge → Public packs; Chat looks them up before it answers). Built by
# tools/build_know_pack.py (+ tools/know_sources.py) as ready search databases, published as release know-<id>-v2:
#   world     CIA World Factbook (public domain)            laws      Egyptian Legal Corpus (MIT as declared)
#   numbers   World Bank open data (CC BY 4.0)              cities    GeoNames (CC BY 4.0)
#   science   OpenStax textbooks, CC BY only (CC BY 4.0)    health    MedlinePlus, NLM (public domain)
#   cranes    OSHA crane rules, govinfo CFR (public domain)        quran     Tanzil Quran text + التفسير الميسر (King Fahd Complex)
#   fiqh      الفقه الميسر, the full books (Shamela texts via turath.io)
# No Wikipedia (Ali's rule). Ali approved publishing (10 Oct 2026). Rebuilt on the 1st of every month so the numbers stay
# current; the app installs a newer build by itself.

on:
  schedule:
    - cron: "41 3 1 * *"
  workflow_dispatch:
    inputs:
      packs:
        description: "Packs, space-separated (world laws numbers cities science health cranes quran fiqh), or all"
        default: "all"
      budget_mb:
        description: "Text budget in MB (laws, science)"
        default: "25"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - id: p
        run: |
          packs="${{ github.event.inputs.packs }}"
          if [ -z "$packs" ] || [ "$packs" = "all" ]; then packs="world laws numbers cities science health cranes quran fiqh"; fi
          echo "list=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' "$packs")" >> $GITHUB_OUTPUT

  pack:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.plan.outputs.list) }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          pip install pyarrow
          budget="${{ github.event.inputs.budget_mb }}"; [ -z "$budget" ] && budget=25
          [ "${{ matrix.pack }}" = "laws" ] && budget=$(( budget < 20 ? budget : 20 ))
          python3 tools/build_know_pack.py "${{ matrix.pack }}" out --budget-mb "$budget" | tee build.log
          ls -la out
      - name: Summary
        run: |
          { echo "## Knowledge pack: ${{ matrix.pack }}"; echo; tail -1 build.log; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish (the app installs a newer build by itself)
        run: |
          id=$(python3 -c "import json; print(json.load(open('out/manifest.json'))['id'])")
          name=$(python3 -c "import json; print(json.load(open('out/manifest.json'))['name'])")
          tag="know-$id-v2"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Knowledge pack: $name" --notes "Attune Knowledge pack (search database). Sources and licence are in manifest.json. Rebuilt every month."
          gh release upload "$tag" out/* --clobber
