name: Desktop app (Windows, macOS, Linux)

# Builds the desktop app (desktop/, an Electron shell around the same web app)
# for the three systems, with the model engine (llama.cpp at the app's pinned
# commit) compiled for each: Vulkan + every x64 CPU generation on Windows and
# Linux, Metal on macOS. Each build is smoke-tested on the runner (no graphics
# chip there, so the CPU path): the packaged app starts, installs a 0.8B model,
# and streams an answer through the same bridge the phone uses.
# Installers are UNSIGNED for now (see DESKTOP_PLAN.md, "Signing").
# v6.24 (Ali, 12 Oct 2026: "Windows first"): every push to main that changes the desktop shell or the page
# builds the Windows installer (and Linux, cheap, as a second check). macOS: run by hand with "all systems".
on:
  workflow_dispatch:
    inputs:
      mac:
        description: "Also build macOS"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["desktop/**", "app/src/main/assets/www/**", ".github/workflows/desktop.yml"]

env:
  LLAMA_COMMIT: 7ab4ee7baad2d920464cbacfad4f4b07cf111fd2
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        # Windows + Linux on every push; macOS too when run by hand with "Also build macOS"
        include: ${{ fromJSON(inputs.mac && '[{"os":"windows-latest","name":"windows-x64","variant":"vulkan"},{"os":"ubuntu-latest","name":"linux-x64","variant":"vulkan"},{"os":"macos-latest","name":"macos-arm64","variant":"metal"}]' || '[{"os":"windows-latest","name":"windows-x64","variant":"vulkan"},{"os":"ubuntu-latest","name":"linux-x64","variant":"vulkan"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvulkan-dev glslc spirv-headers xvfb > /dev/null
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true
          stripdown: false

      - name: Cache the engine build
        id: cache
        uses: actions/cache@v4
        with:
          path: desktop/engine
          key: engine-${{ matrix.name }}-${{ matrix.variant }}-${{ env.LLAMA_COMMIT }}-v3

      - name: Build the model engine (llama.cpp, pinned)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp" && git checkout -q "$LLAMA_COMMIT"
          COMMON="-DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=OFF"
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build $COMMON -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_INSTALL_RPATH=@loader_path -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # this SDK has no SPIR-V headers package: build and install them first
            git clone -q --depth 1 https://github.com/KhronosGroup/SPIRV-Headers "$RUNNER_TEMP/spirv-src"
            cmake -S "$RUNNER_TEMP/spirv-src" -B "$RUNNER_TEMP/spirv-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/spirv" -DSPIRV_HEADERS_ENABLE_TESTS=OFF > /dev/null
            cmake --install "$RUNNER_TEMP/spirv-build" > /dev/null
            # v6.25 (Ali's PC: the engine closed at once without a word): ONE self-contained program — the C/C++ runtime
            # built in (/MT), no OpenMP DLL, no ggml/llama DLLs — so a PC without Visual Studio's runtime files runs it.
            # A second, CPU-only engine (no Vulkan) is the fallback when the graphics driver has no Vulkan.
            # No OpenSSL either (libssl/libcrypto DLLs are on GitHub's machines, not on a normal PC; the app downloads models itself).
            WIN="-DLLAMA_OPENSSL=OFF -DBUILD_SHARED_LIBS=OFF -DGGML_OPENMP=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -T ClangCL"
            cmake -S . -B build $COMMON $WIN -DGGML_VULKAN=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/spirv"
            cmake -S . -B build-cpu $COMMON $WIN
          else
            cmake -S . -B build $COMMON -DGGML_VULKAN=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DCMAKE_INSTALL_RPATH='$ORIGIN' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          fi
          set -o pipefail
          cmake --build build --config Release --target llama-server -j 4 > "$RUNNER_TEMP/build.log" 2>&1 || { grep -iE "error|fatal" "$RUNNER_TEMP/build.log" | grep -v "Wunused" | head -40; tail -15 "$RUNNER_TEMP/build.log"; exit 1; }
          OUT="$GITHUB_WORKSPACE/desktop/engine/${{ matrix.variant }}"
          mkdir -p "$OUT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/bin/Release/llama-server.exe "$OUT/"; cp build/bin/Release/*.dll "$OUT/" 2>/dev/null || true
            cmake --build build-cpu --config Release --target llama-server -j 4 > "$RUNNER_TEMP/build-cpu.log" 2>&1 || { grep -iE "error|fatal" "$RUNNER_TEMP/build-cpu.log" | head -40; exit 1; }
            mkdir -p "$GITHUB_WORKSPACE/desktop/engine/cpu"; cp build-cpu/bin/Release/llama-server.exe "$GITHUB_WORKSPACE/desktop/engine/cpu/"; cp LICENSE "$GITHUB_WORKSPACE/desktop/engine/cpu/LICENSE-llama.cpp.txt"
          else cp -a build/bin/. "$OUT/"; fi
          cp LICENSE "$OUT/LICENSE-llama.cpp.txt"
          ls -la "$OUT"

      - name: The Windows engine needs nothing a normal PC lacks
        if: runner.os == 'Windows'
        run: |
          # every DLL each engine asks Windows for; the Visual C++ runtime and OpenMP must NOT be among them
          for exe in desktop/engine/*/llama-server.exe; do
            echo "== $exe"; "/c/Program Files/LLVM/bin/llvm-objdump.exe" -p "$exe" | grep -i "DLL Name" | sort -u | tee "$RUNNER_TEMP/deps.txt"
            # only files every Windows 10/11 PC has (and vulkan-1.dll, which comes with the graphics driver; the CPU engine is the fallback)
            BAD=$(sed 's/.*DLL Name: //' "$RUNNER_TEMP/deps.txt" | tr -d '\r' | grep -viE '^(kernel32|advapi32|crypt32|shell32|ws2_32|user32|gdi32|ole32|oleaut32|bcrypt|ntdll|dbghelp|shlwapi|version|iphlpapi|secur32|userenv|psapi|winmm|vulkan-1)\.dll$' || true)
            if [ -n "$BAD" ]; then echo "::error::$exe needs files a normal PC may not have: $BAD"; exit 1; fi
          done

      - name: Engine sees which devices
        run: |
          cd desktop/engine/${{ matrix.variant }}
          export LD_LIBRARY_PATH="$PWD"
          ./llama-server --version || true
          ./llama-server --list-devices || true

      - name: Install the shell's tools
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Unit checks
        working-directory: desktop
        run: |
          node test/unit.js
          node --no-warnings test/web.js
          node test/reminders.js
          ATTUNE_LIVE=1 node --no-warnings test/packs.js

      - name: Small model for the smoke test
        run: curl -sSL --retry 5 -o "$RUNNER_TEMP/q08.gguf" https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf

      - name: Smoke test from source (streams an answer)
        working-directory: desktop
        run: |
          export ATTUNE_LIVE=1
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a node test/smoke.js "$RUNNER_TEMP/q08.gguf"; else node test/smoke.js "$RUNNER_TEMP/q08.gguf"; fi

      - name: Package (unsigned)
        working-directory: desktop
        run: npx electron-builder --publish never

      - name: Smoke test the packaged app
        working-directory: desktop
        run: |
          export ATTUNE_LIVE=1
          if [ "$RUNNER_OS" = "Linux" ]; then APP="$(ls -d dist/linux-unpacked)/attune-desktop"; [ -x "$APP" ] || APP="$(ls dist/linux-unpacked/* | grep -iv '\.so\|\.pak\|\.dat\|\.bin\|\.json\|\.html' | head -1)"; xvfb-run -a node test/smoke.js "$RUNNER_TEMP/q08.gguf" "$APP"
          elif [ "$RUNNER_OS" = "Windows" ]; then node test/smoke.js "$RUNNER_TEMP/q08.gguf" "dist/win-unpacked/Attune.exe"
          else node test/smoke.js "$RUNNER_TEMP/q08.gguf" "$(ls -d dist/mac*/Attune.app)/Contents/MacOS/Attune"; fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: attune-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz
