ything you keep — it files itself":"كل ما تحفظه — يُرتَّب تلقائيًا","on this day":"في مثل هذا اليوم","a year ago":"قبل سنة","from your past":"من الماضي","Nothing to read in that.":"لا يوجد ما يمكن قراءته هنا.","That payment did not go through, so there is nothing to record.":"لم تتم هذه الدفعة، فلا يوجد ما يُسجَّل.","Sent to Yusr — pick the account and confirm":"أُرسلت إلى يُسر — اختر الحساب وأكّد","Money isn't bundled in this build.":"قسم المال غير مضمَّن في هذه النسخة.","The Yusr document wasn't embedded. On the phone it loads from local assets.":"مستند يُسر غير مضمَّن. على الهاتف يُحمَّل من ملفات التطبيق.","Money & Zakāt":"المال والزكاة","Your ledger and every zakāt ruling live here, unchanged, and free forever. Attune adds memory and plain language on top — it never calculates zakāt and never moves money on its own.":"دفترك وكل أحكام الزكاة هنا كما هي، ومجانًا دائمًا. يضيف Attune الذاكرة والشرح بلغة بسيطة — ولا يحسب الزكاة أبدًا، ولا يحرّك أي مال من تلقاء نفسه.",Connected:"متصل","Starting…":"جارٍ البدء…",Money:"المال","Share a payment":"مشاركة دفعة","An InstaPay confirmation, a bank SMS, a wallet receipt or a photo of one. Attune reads the amount and who it was, then opens your own transaction sheet with it filled in. You pick the account.":"تأكيد InstaPay، أو رسالة من البنك، أو إيصال محفظة، أو صورة لأيٍّ منها. يقرأ Attune المبلغ والطرف الآخر، ثم يفتح نموذج المعاملة مملوءًا. أنت تختار الحساب.","تم تحويل مبلغ 1,500.00 جنيه إلى AHMED MOHAMED. رقم العملية 987654321":"تم تحويل مبلغ 1,500.00 جنيه إلى AHMED MOHAMED. رقم العملية 987654321","Read it":"قراءة","Reading…":"جارٍ القراءة…","From a photo":"من صورة","Three ways, all fine: share the SMS, WhatsApp message or screenshot to Attune from any app (it lands here by itself) · paste it above · or take/pick a photo of the receipt.":"ثلاث طرق: شارك الرسالة أو رسالة واتساب أو لقطة الشاشة مع Attune من أي تطبيق (تصل هنا تلقائيًا) · أو الصقها في الأعلى · أو التقط صورة للإيصال أو اخترها.","read from: “":"قُرئ من: “","· account: you choose, in Yusr":"· الحساب: تختاره أنت في يُسر","Talk to your money":"تحدّث مع أموالك","not saved to memory":"لم يُحفظ في الذاكرة","saved to memory":"حُفظ في الذاكرة","Answered on this device from the figures Yusr calculated. Ask follow-ups — it keeps the thread. For zakāt it is handed the app's own numbers and forbidden from recomputing them: it explains, it does not rule.":"الإجابة من هذا الجهاز بناءً على الأرقام التي حسبها يُسر. يمكنك طرح أسئلة متابعة — يحتفظ بسياق الحديث. في الزكاة يُعطى أرقام التطبيق نفسه ويُمنع من إعادة حسابها: يشرح ولا يُفتي.","figures from Yusr's zakāt engine, not recalculated":"أرقام من محرك الزكاة في يُسر، دون إعادة حساب","ask a follow-up…":"اطرح سؤال متابعة…","Thinking…":"جارٍ التفكير…",Ask:"اسأل","What do you make of this?":"ما رأيك في هذا؟","Load a model in Engine and this answers with no signal.":"حمّل نموذجًا من «المحرك» لتحصل على إجابة بدون إنترنت.","What stands out":"أبرز الملاحظات","Every figure here is one Yusr calculated — the model may not produce a new number.":"كل رقم هنا حسبه يُسر — لا يُسمح للنموذج بإنتاج رقم جديد.","What the AI is allowed to see":"ما يُسمح للذكاء الاصطناعي برؤيته","Sources:":"المصادر:","Added to memory":"أُضيف إلى الذاكرة","Only what you confirmed. Attune records nothing on its own.":"فقط ما أكّدته أنت. لا يسجّل Attune شيئًا من تلقاء نفسه.","No signal, so only your saved places are searchable — nothing matched.":"لا يوجد اتصال، لذلك يقتصر البحث على أماكنك المحفوظة — ولم يتطابق شيء.","Nothing found for that.":"لم يُعثر على شيء.","Saved — it works offline now":"حُفظت — تعمل الآن بدون إنترنت","Map tiles cleared":"تم مسح بيانات الخريطة المحفوظة",Maps:"الخرائط","Every area you look at is kept, so it works again with no signal. You can also download an area before you travel. Place search needs a connection; your own saved places are searchable without one.":"تُحفظ كل منطقة تتصفحها لتعمل لاحقًا بدون اتصال. ويمكنك أيضًا تنزيل منطقة قبل السفر. البحث عن الأماكن يحتاج اتصالًا؛ أما أماكنك المحفوظة فيمكن البحث فيها بدونه.","offline — showing saved tiles":"بدون إنترنت — تُعرض الخريطة المحفوظة","Search a place — مدينة نصر، القاهرة":"ابحث عن مكان — مدينة نصر، القاهرة","Search your saved places":"ابحث في أماكنك المحفوظة",Search:"بحث","· saved":"· محفوظ","not downloaded":"غير مُنزَّل",online:"متصل","File Converter":"محوّل الملفات","Choose a file":"اختر ملفًا","Translate…":"ترجمة…","Translating into {l} — part {n} of {t}…":"جارٍ الترجمة إلى {l} — الجزء {n} من {t}…","{n} piece(s) couldn't be translated and were left as they were.":"تعذّرت ترجمة {n} جزء، فبقيت كما هي.","Translated by the AI on your phone — check important names and numbers.":"تُرجم بالذكاء الاصطناعي على هاتفك — راجع الأسماء والأرقام المهمة.","Translating needs an AI model — open Engine and install one.":"الترجمة تحتاج نموذج ذكاء اصطناعي — افتح «المحرك» وثبّت نموذجًا.","The AI on your phone translates it piece by piece; headings, lists, tables and numbers stay in place. Long files take a few minutes.":"يترجم الذكاء الاصطناعي على هاتفك الملف جزءًا جزءًا؛ وتبقى العناوين والقوائم والجداول والأرقام في مكانها. الملفات الطويلة تستغرق بضع دقائق.",Spanish:"الإسبانية","Unlimited video downloads in the quality you choose":"تنزيل الفيديوهات بلا حدود وبالجودة التي تختارها","Video Downloader":"تنزيل الفيديوهات","Paste a video link, pick the quality, save it to your phone":"الصق رابط الفيديو، واختر الجودة، واحفظه على هاتفك","Copy a video's link, paste it here, pick the quality — it's saved to your phone's Movies folder. Works with direct video links, Google Drive, Dropbox, archive.org, Wikimedia Commons and pages that show a plain video.":"انسخ رابط الفيديو، والصقه هنا، واختر الجودة — يُحفظ في مجلد Movies على هاتفك. يعمل مع روابط الفيديو المباشرة، وGoogle Drive، وDropbox، وarchive.org، وWikimedia Commons، والصفحات التي تعرض فيديو عاديًا.","Find the video":"البحث عن الفيديو","Looking for the video…":"جارٍ البحث عن الفيديو…","Choose the quality":"اختر الجودة",Download:"تنزيل",Downloads:"التنزيلات","Audio only":"الصوت فقط",Video:"فيديو",Original:"الأصلي",Play:"تشغيل","Waiting for the internet…":"في انتظار الاتصال بالإنترنت…","Only download videos you have the right to keep.":"نزّل فقط الفيديوهات التي يحق لك الاحتفاظ بها.","The clipboard is empty — copy the video's link first":"الحافظة فارغة — انسخ رابط الفيديو أولًا","Long-press the box and choose Paste":"اضغط مطولًا على الخانة واختر «لصق»","That isn't a link. Copy the video's link (it starts with https://) and paste it here.":"هذا ليس رابطًا. انسخ رابط الفيديو (يبدأ بـ https://) والصقه هنا.","{site} doesn't allow its videos to be downloaded, so Attune can't save them (Google Play removes apps that do). Links that work: direct video links, Google Drive, Dropbox, archive.org, Wikimedia Commons, and pages that show a plain video file.":"لا يسمح {site} بتنزيل فيديوهاته، لذا لا يستطيع Attune حفظها (تحذف Google Play التطبيقات التي تفعل ذلك). الروابط التي تعمل: روابط الفيديو المباشرة، وGoogle Drive، وDropbox، وarchive.org، وWikimedia Commons، والصفحات التي تعرض ملف فيديو عاديًا.","a streaming service":"خدمة البث هذه","this site":"هذا الموقع","That's a live-stream link (.m3u8) — it's streamed in pieces and can't be saved as one file.":"هذا رابط بث مباشر (.m3u8) — يُرسَل على أجزاء ولا يمكن حفظه كملف واحد.","Downloading works in the Android app.":"التنزيل متاح في تطبيق أندرويد.","Google Drive didn't give the file — make sure it's shared as \"Anyone with the link\".":"لم يُتِح Google Drive الملف — تأكد أنه مشارك مع «أي شخص لديه الرابط».","This page plays a {site} video, which can't be downloaded.":"تعرض هذه الصفحة فيديو من {site}، ولا يمكن تنزيله.","This page streams its video in pieces (HLS), which can't be saved as one file.":"تبث هذه الصفحة الفيديو على أجزاء (HLS)، ولا يمكن حفظه كملف واحد.","No downloadable video was found on that page.":"لم يُعثر على فيديو قابل للتنزيل في هذه الصفحة.","That link didn't give a video file (the site sent {t}).":"لم يُرجع هذا الرابط ملف فيديو (أرسل الموقع {t}).","No downloadable video was found there.":"لم يُعثر على فيد ts and receipts, handles Arabic and English, and a fifth bit of precision over the smaller build is a real quality difference you can feel on long answers.":"الخيار الأفضل إن كان هاتفك يتسع له. يقرأ صور المستندات والإيصالات، ويتعامل مع العربية والإنجليزية، ودقته الأعلى من النسخة الأصغر تُحدث فرقًا حقيقيًا تلاحظه في الإجابات الطويلة.",Arabic:"العربية","Text, images and audio on a flagship phone. Pick this over the Qwen if you want voice notes read back to you.":"نصوص وصور وصوت على هاتف رائد. اختره بدلًا من Qwen إن أردت أن تُقرأ عليك الرسائل الصوتية.",Voice:"الصوت","The sweet spot on an ordinary modern phone. Everything the app does, in under 3 GB.":"الخيار الأمثل لهاتف حديث عادي. كل ما يفعله التطبيق، في أقل من 3 جيجابايت.","The same 4B model squeezed 10% smaller for a 4 GB phone. Slightly slower on older chips, and worth it to get the 4B rather than dropping to the 2B.":"نفس نموذج 4B مضغوط بنسبة 10% لهاتف بذاكرة 4 جيجابايت. أبطأ قليلًا على الشرائح القديمة، ويستحق ذلك للحصول على 4B بدل النزول إلى 2B.","Runs on a cheap phone and still reads photographs. Short answers are good; long reasoning is where you'll notice the size.":"يعمل على هاتف اقتصادي وما زال يقرأ الصور. إجاباته القصيرة جيدة؛ أما في التفكير الطويل فستلاحظ صغر حجمه.","For a phone that can't hold anything else. Useful for tidying and shortening text; don't ask it to reason.":"لهاتف لا يتسع لغيره. مفيد لترتيب النصوص واختصارها؛ لا تطلب منه التفكير.","This device is below what any local model needs":"هذا الجهاز أقل مما يحتاجه أي نموذج محلي","Everything here runs on your own hardware, and the smallest useful model wants about 2 GB of memory to itself. Attune's tools that don't need a model still work.":"كل شيء هنا يعمل على جهازك، وأصغر نموذج مفيد يحتاج نحو 2 جيجابايت من الذاكرة لنفسه. أدوات Attune التي لا تحتاج نموذجًا ما زالت تعمل.","Neural Engine":"المحرك العصبي","prefill + decode":"المعالجة الأولية + التوليد",Rewrite:"إعادة الصياغة","Field docs":"مستندات الموقع","It declined or dodged the question.":"رفض السؤال أو تهرّب منه.","Say why you need it and what you'll do with it, and ask for the part it can answer.":"قل لماذا تحتاجه وماذا ستفعل به، واطلب الجزء الذي يستطيع الإجابة عنه.","It hedged instead of committing.":"تحفّظ بدل أن يلتزم.","Ask it to pick one and defend it: “Choose the single best option and say why the others lose.”":"اطلب منه اختيار خيار واحد والدفاع عنه: «اختر أفضل خيار واحد ووضّح لماذا تتفوق على البقية.»","That's a generic answer — it could have been written without your details.":"هذه إجابة عامة — كان يمكن كتابتها بدون تفاصيلك.","Give it your actual numbers and constraints, and ask it to redo the answer using only those.":"أعطه أرقامك وقيودك الفعلية، واطلب منه إعادة الإجابة باستخدامها فقط.","It spent the answer restating your question.":"قضى الإجابة في إعادة صياغة سؤالك.","Tell it to skip the recap and start at the answer.":"اطلب منه تخطي الإعادة والبدء بالإجابة مباشرة.","It looks cut off.":"يبدو مقطوعًا.","Ask it to continue from where it stopped, not to start again.":"اطلب منه المتابعة من حيث توقف، لا البدء من جديد.","It asked you a question instead of answering.":"سألك سؤالًا بدل أن يجيب.","Answer the question inside your next prompt so it can't stall again.":"أجب عن سؤاله داخل طلبك التالي حتى لا يتوقف مرة أخرى.","This repeats an earlier answer — the conversation is going in circles.":"هذا يكرر إجابة سابقة — المحادثة تدور في حلقة.","Change the angle: ask for what it would do differently, or give it a constraint it hasn't had.":"غيّر الزاوية: اسأل ماذا كان سيفعل بشكل مختلف، أو أعطه قيدًا لم يُعطَ له.",Sharpen:"تدقيق","narrower and more specific — pin it down":"أضيق وأكثر تحديدًا — حدِّدها بدقة",Widen:"توسيع","step back and ask for options you haven't considered":"تراجع خطوة واسأل عن خيارات لم تفكّر فيها",Press:"اعتراض","challenge the answer and make it defend or correct itself":"اعترض على الإجابة واجعله يدافع عنها أو يصحّحها","Reads clean structure well — tags mark where context ends and the task begins.":"يقرأ البنية النظيفة جيدًا — الوسوم تحدد أين  9 بالاتصال بأحمد»، «صحّيني الساعة 6»، «ابعت لمحمود على الواتساب إني هتأخر». وتؤكّد أنت دائمًا أولًا.","Notifications are off for Attune — tap to allow them, or reminders can't appear.":"الإشعارات متوقفة لـ Attune — اضغط للسماح بها، وإلا فلن تظهر التذكيرات.","Reminders may come up to 10 minutes late. Tap to allow “Alarms & reminders” for Attune so they ring on the minute.":"قد تتأخر التذكيرات حتى 10 دقائق. اضغط للسماح بـ«المنبّهات والتذكيرات» لـ Attune لتعمل في موعدها بالدقيقة.","In the browser reminders are only listed — the Android app rings them.":"في المتصفح تُعرض التذكيرات فقط — أما التنبيه فيعمل في تطبيق أندرويد.","Add one":"إضافة تذكير","What to remind you about":"بماذا أذكّرك؟","Add reminder":"إضافة تذكير","Coming up":"القادم","Nothing set.":"لا يوجد شيء مضبوط.","from a promise":"من وعد",Once:"مرة واحدة","Every day":"كل يوم","Every week":"كل أسبوع","Working days (Sun–Thu)":"أيام العمل (الأحد–الخميس)",Reminder:"تذكير",Alarm:"منبّه",Timer:"مؤقّت","Calendar event":"موعد في التقويم","WhatsApp message":"رسالة واتساب","Phone call":"مكالمة","Nothing to do":"لا يوجد ما يُنفَّذ","When? Pick the date and time.":"متى؟ اختر التاريخ والساعة.","That time has already passed — pick a later one.":"هذا الوقت قد مضى — اختر وقتًا لاحقًا.","That is more than a year away — check the date.":"هذا التاريخ بعد أكثر من سنة — تحقّق منه.","Who should it go to?":"لمن تُرسل؟","This doesn't look like something to set on the phone.":"لا يبدو هذا شيئًا يُضبط على الهاتف.","Could not open it":"تعذّر فتحه","No app on this phone can do that.":"لا يوجد تطبيق على هذا الهاتف يستطيع ذلك.","WhatsApp isn't installed — opened the share sheet instead.":"واتساب غير مثبّت — فُتحت قائمة المشاركة بدلًا منه.","Unknown action":"إجراء غير معروف","Alarms, reminders & actions":"منبّهات وتذكيرات وإجراءات",Speed:"السرعة","Use the GPU":"استخدام معالج الرسوميات (GPU)","Running on {g}.":"يعمل على {g}.","Runs the model on the phone's graphics chip (Adreno). Often faster at reading long prompts; test it below. Switches itself back to the CPU if anything goes wrong.":"يشغّل النموذج على شريحة الرسوميات في الهاتف (Adreno). غالبًا أسرع في قراءة الطلبات الطويلة؛ اختبره بالأسفل. ويعود تلقائيًا إلى المعالج (CPU) إذا حدث أي خطأ.","This build has no GPU engine — it will come with the next APK built on GitHub.":"هذه النسخة بلا محرك GPU — سيأتي مع ملف APK التالي المبني على GitHub.","Faster writing (MTP)":"كتابة أسرع (التوقع متعدد الكلمات)","Same answers, faster for code, tables, JSON, emails and summaries; roughly the same or slightly slower for free-form explanations.":"الإجابات نفسها، وأسرع في الأكواد والجداول وملفات البيانات والرسائل والملخصات؛ وبالسرعة نفسها تقريبًا أو أبطأ قليلًا في الشرح الحر.","MTP is on for this model.":"ميزة التوقع متعدد الكلمات مفعّلة لهذا النموذج.","MTP did not start on this phone, so this model runs without it.":"لم تعمل ميزة التوقع متعدد الكلمات على هذا الهاتف، فيعمل النموذج بدونها.","MTP is off for this model.":"ميزة التوقع متعدد الكلمات متوقفة لهذا النموذج.","This model has no MTP layers; install it again from the list to get them.":"لا يحتوي هذا النموذج على طبقات التوقع متعدد الكلمات؛ ثبّته مرة أخرى من القائمة للحصول عليها.","Not recommended: it was slower in our tests. Turn it off.":"غير مُوصى به: كان أبطأ في اختباراتنا. أوقفه.","Faster answers with a draft model":"إجابات أسرع بنموذج مساعد","On: {d} guesses ahead, the main model checks.":"مفعّل: {d} يتوقع الكلمات مسبقًا، ويراجعها النموذج الرئيسي.","Qwen 3.5 0.8B guesses a few words ahead and the main model checks them in one go. Same answers, often faster writing.":"يتوقع Qwen 3.5 0.8B بضع كلمات مسبقًا ويراجعها النموذج الرئيسي دفعة واحدة. الإجابات نفسها، وكتابة أسرع غالبًا.","Only works with a Qwen 3.5 model — the one in use is not.":"يعمل مع نماذج Qwen 3.5 فقط — والنموذج الحالي ليس منها.","Download Qwen 3.5 0.8B as a helper (about 0.5 GB, once). Works with Qwen 3.5 models.":"نزّل Qwen 3.5 0.8B كنموذج مساعد (نحو 0.5 جيجابايت، مرة واحدة). يعمل مع نماذج Qwen 3.5.","Downloading the draft model…":"جارٍ تنزيل النموذج المساعد…","Draft model ready":"النموذج المساعد جاهز","Running the speed test…":"جارٍ اختبار السرعة…","Restarting the engine…":"جارٍ إعادة تشغيل المحرك…","Speed test":"اختبار السرعة","Run it":"تشغيل","The same short task every time (read a site report, write five bullets), so CPU, GPU and draft can be compared on this phone. Takes 10–40 s.":"المهمة القصيرة نفسها في كل مرة (قراءة تقرير موقع وكتابة خمس نقاط)، لتقارن بين CPU وGPU والنموذج المساعد على هذا الهاتف. تستغرق 10–40 ثانية.",draft:"مساعد","writes {w}/s · reads {r}/s":"يكتب {w}/ث · يقرأ {r}/ث","Fastest here so far: {m}":"الأسرع هنا حتى الآن: {m}","This phone has no GPU the engine can use (no OpenCL driver) — it stays on the CPU.":"لا يحتوي هذا الهاتف على GPU يستطيع المحرك استخدامه (لا يوجد تعريف OpenCL) — فيبقى على المعالج (CPU).","Last time, starting on the GPU closed the app. Attune is back on the CPU; you can try the GPU again in Engine → Speed.":"في المرة السابقة أدى التشغيل على GPU إلى إغلاق التطبيق. عاد Attune إلى المعالج (CPU)؛ ويمكنك تجربة GPU مرة أخرى من «المحرك» ← «السرعة».","Planning aid only. The crane's own load chart and computer (LMI), the manufacturer's manuals and a competent lift planner always decide. Every rule here takes the cautious side.":"أداة مساعدة للتخطيط فقط. القرار دائمًا لجدول أحمال الونش نفسه وحاسوبه (LMI) وكتيّبات المصنّع ومخطط رفع مؤهَّل. كل قاعدة هنا تأخذ بالأحوط.",Crane:"الونش","No chart — type the capacity":"بدون جدول — أدخل الحمولة","Chart capacity":"حمولة الجدول","{g} t of {c} t = {p}% of the chart":"{g} طن من {c} طن = {p}% من الجدول","Spare: {s} t":"الهامش: {s} طن","Company limits":"حدود الشركة",Ground:"الأرض","Outrigger force: {t} t = {k} kN":"قوة رجل التثبيت: {t} طن = {k} كيلونيوتن","Estimated as 75% of crane + counterweight + load on one corner — cautious; use the real figure when you have it.":"تقديرها 75% من (الونش + الثقل المعاكس + الحمل) على ركن واحد — تقدير حذِر؛ استخدم الرقم الحقيقي عند توفره.","Pressure on the ground: {p} kN/m² (allowed {q})":"الضغط على الأرض: {p} كيلونيوتن/م² (المسموح {q})","Mat needed: at least {a} m² — e.g. {s} × {s} m":"المطلوب لوح توزيع (Mat) لا تقل مساحته عن {a} م² — مثلًا {s} × {s} م","The mat must be stiff enough to spread the load over its whole area (timber or steel mats of the right thickness).":"يجب أن يكون لوح التوزيع صلبًا بما يكفي لتوزيع الحمل على كامل مساحته (ألواح خشب أو حديد بالسُّمك المناسب).","{n} leg":"{n} فرع","Angle of each leg from vertical: {a}° (between legs: {b}°)":"زاوية كل فرع عن الرأسي: {a}° (بين الفرعين: {b}°)","All legs share the load (engineered, balanced lift only)":"كل الفروع تتقاسم الحمل (رفع هندسي متزن فقط)","Each leg carries {t} t":"يحمل كل فرع {t} طن","Angle factor ×{f} · counted as {c} legs carrying":"معامل الزاوية ×{f} · محسوب على {c} فروع حاملة","3- and 4-leg slings are rated as if only 2 legs carry the load — they rarely share it evenly.":"تُحسب الأسلاك ذات 3 و4 فروع كأن فرعين فقط يحملان — فنادرًا ما تتقاسم الحمل بالتساوي.","Above 45° the tension rises fast — use longer slings or a spreader beam.":"فوق 45° يزداد الشدّ بسرعة — استخدم أسلاكًا أطول أو عارضة توزيع (Spreader).","More than 60° from vertical is not allowed — longer slings or a spreader beam.":"لا يُسمح بأكثر من 60° عن الرأسي — استخدم أسلاكًا أطول أو عارضة توزيع.","Choose slings whose rated load (WLL) is at least this, for the way they are used (straight, choke, basket).":"اختر أسلاكًا حملها المقنَّن (WLL) لا يقل عن هذا، حسب طريقة الاستخدام (مستقيم، خنق، سلة).","Load shape (drag coefficient)":"شكل الحمل (معامل السحب)","Round (pipe, tank) · 0.8":"دائري (ماسورة، خزان) · 0.8","Box or panel · 1.2 (usual)":"صندوق أو لوح · 1.2 (المعتاد)","Open steel / complex shape · 1.6":"حديد مفتوح / شكل معقد · 1.6","Wind at the boom tip: about {v} m/s (Beaufort {b})":"الرياح عند رأس البوم: نحو {v} م/ث (بوفورت {b})","Highest wind for this lift: {v} m/s":"أقصى رياح لهذا الرفع: {v} م/ث","Reduced from the chart's {c} m/s: this load catches {p} m² of wind per tonne (charts assume 1.2).":"مخفَّضة من {c} م/ث في الجدول: هذا الحمل يواجه {p} م² من الرياح لكل طن (الجداول تفترض 1.2).","The chart's limit applies — the load is compact enough.":"حد الجدول هو المطبَّق — الحمل مدمج بما يكفي.","Now: OK, {m} m/s in hand.":"الآن: مقبول، والهامش {m} م/ث.","Now: TOO WINDY for this load — wait, or lift a smaller face into the wind.":"الآن: الرياح أقوى من المسموح لهذا الحمل — انتظر، أو وجّه وجهًا أصغر من الحمل نحو الرياح.","Wind force on the load ≈ {f} kN.":"قوة الرياح على الحمل ≈ {f} كيلونيوتن.","Pre-lift checklist":"قائمة فحص ما قبل الرفع","Gross load":"الحمل الإجمالي","{d} of {t} checked":"{d} من {t} تم فحصه","Start again":"البدء من جديد","Give the crane a name":"أعطِ الونش اسمًا","Paste the load chart first":"الصق جدول الأحمال أولًا","Chart saved":"حُفظ الجدول","Your cranes' load charts":"جداول أحمال أوناشك","None yet. Add each crane's chart once — copy it from the manufacturer's table (PDF or the crane's manual).":"لا شيء بعد. أضف جدول كل ونش مرة واحدة — انسخه من جدول المصنّع (ملف PDF أو كتيّب الونش).","{r} radii × {b} boom lengths":"{r} أنصاف أقطار × {b} أطوال بوم","Add a chart":"إضافة جدول","Crane, e.g. Liebherr LTM 1100-4.2 · unit 3":"الونش، مثلًا Liebherr LTM 1100-4.2 · الوحدة 3","Configuration, e.g. 22 t counterweight · outriggers 7.0 × 7.0 m · 360°":"التجهيز، مثلًا: ثقل معاكس 22 طنًا · أرجل تثبيت 7.0 × 7.0 م · 360°","First row: boom lengths (m). Each next row: radius (m), then the capacity (t) for each boom length. “-” where the chart has no value. One chart per configuration.":"الصف الأول: أطوال البوم (م). كل صف بعده: نصف القطر (م)، ثم الحمولة (طن) لكل طول بوم. «-» حيث لا توجد قيمة في الجدول. جدول لكل تجهيز.","Save chart":"حفظ الجدول","Check the preview against the printed chart before relying on it. Charts are kept on this phone and in your backups.":"طابق المعاينة مع الجدول المطبوع قبل الاعتماد عليها. الجداول محفوظة على هذا الهاتف وفي نسخك الاحتياطية.","Paste at least a header row of boom lengths and one row of capacities.":"الصق على الأقل صف عناوين بأطوال البوم وصفًا واحدًا من الأحمال.","The first row must be boom lengths in metres.":"الصف الأول يجب أن يكون أطوال البوم بالمتر.","Skipped a row that doesn't start with a radius: ":"تم تخطي صف لا يبدأ بنصف قطر: ","Radii must go up from top to bottom.":"أنصاف الأقطار يجب أن تزيد من أعلى لأسفل.","Boom lengths must go up from left to right.":"أطوال البوم يجب أن تزيد من اليسار لليمين.","No chart for this crane.":"لا يوجد جدول لهذا الونش.","Give the radius and the boom length.":"أدخل نصف القطر وطول البوم.","Closer than the chart's smallest radius — check the chart.":"أقرب من أصغر نصف قطر في الجدول — راجع الجدول.","Beyond the chart's largest radius — not permitted.":"أبعد من أكبر نصف قطر في الجدول — غير مسموح.","This boom length is outside the chart.":"طول البوم هذا خارج الجدول.","The chart has no value there — the crane may not lift at this radius with this boom.":"لا توجد قيمة في الجدول هنا — لا يجوز للونش الرفع عند نصف القطر هذا بهذا البوم.","Between chart points — the lowest surrounding value is used.":"بين نقاط الجدول — تُستخدم أقل قيمة محيطة.","Enter the load's weight.":"أدخل وزن الحمل.","No chart capacity for this radius/boom.":"لا توجد حمولة في الجدول لنصف القطر/البوم هذا.","Soft clay / made ground":"طين لين / ردم","Firm clay":"طين متماسك","Stiff clay":"طين صلب","Loose sand":"رمل مفكّك","Medium-dense sand":"رمل متوسط الكثافة","Dense gravel / compacted crushed stone":"حصى كثيف / كسر حجارة مدموك","Sound reinforced concrete slab (check design)":"بلاطة خرسانة مسلحة سليمة (راجع التصميم)","Weathered rock":"صخر متآكل بالتجوية","Give the outrigger force, or the crane mass and load to estimate it.":"أدخل قوة رجل التثبيت، أو وزن الونش والحمل لتقديرها.","Enter the load.":"أدخل الحمل.","Legs: 1 to 4.":"الفروع: من 1 إلى 4.","The angle from vertical must be 0–89°.":"الزاوية عن الرأسي يجب أن تكون 0–89°.","Enter the chart's wind limit, the load mass and its largest face area.":"أدخل حد الرياح في الجدول، ووزن الحمل، ومساحة أكبر وجه فيه.","Load weight confirmed (drawing, weighbridge or manufacturer) — not guessed":"وزن الحمل مؤكَّد (رسم هندسي، أو ميزان، أو المصنّع) — وليس تخمينًا","Radius and boom length checked on the load chart for the exact configuration (counterweight, outrigger spread)":"نصف القطر وطول البوم مُراجَعان على جدول الأحمال للتجهيز نفسه (الثقل المعاكس، فتحة الأرجل)","Lift plan / method statement approved; critical lifts (> 75 % of chart) signed off":"خطة الرفع / بيان الطريقة معتمدة؛ والرفعات الحرجة (> 75% من الجدول) موقَّعة","Permit to work issued where required":"تصريح العمل صادر حيث يلزم","Daily inspection done; defects reported and cleared":"تم الفحص اليومي؛ وأُبلغ عن العيوب وعولجت","LMI / rated capacity limiter set for the actual configuration and tested":"جهاز LMI / محدِّد الحمولة مضبوط على التجهيز الفعلي ومُختبَر","Wire ropes, hook, safety latch and sheaves in good condition":"الأسلاك والخطاف ولسان الأمان والبكرات في حالة جيدة","Crane level within the manufacturer's limit":"استواء الونش ضمن حد المصنّع","Ground and outriggers":"الأرض وأرجل التثبيت","Ground bearing capacity known; no services, voids or fresh backfill under the pads":"قدرة تحمّل الأرض معروفة؛ ولا توجد مرافق أو فراغات أو ردم حديث تحت القواعد","Outriggers fully extended as the chart requires, pins locked":"أرجل التثبيت ممدودة بالكامل كما يطلب الجدول، والمسامير مقفلة","Mats of the right size and strength, centred under each pad":"ألواح توزيع بالمقاس والقوة المناسبين، في منتصف كل قاعدة","Slings, shackles and spreader rated for the load and angle; tags legible":"الأسلاك والشكالات وعارضة التوزيع مقنَّنة للحمل والزاوية؛ والبطاقات مقروءة","Sling angle within limits (not more than 60° from vertical)":"زاوية الأسلاك ضمن الحدود (لا تزيد عن 60° عن الرأسي)","Sharp edges protected; load secured and balanced; tag lines fitted":"الحواف الحادة محمية؛ والحمل مربوط ومتزن؛ وحبال التوجيه مركَّبة","Area and people":"المنطقة والأفراد","Exclusion zone set up; nobody under the load or in the swing path":"منطقة المنع محدَّدة؛ لا أحد تحت الحمل أو في مسار الدوران","Overhead power lines: minimum clearance kept (spotter if near)":"خطوط الكهرباء العلوية: المسافة الدنيا محفوظة (مراقب إن كانت قريبة)","Banksman / signaller appointed and competent":"مُشير (Banksman) معيَّن ومؤهَّل","Weather and communication":"الطقس والاتصال","Wind at boom-tip height below the limit for this load's size":"الرياح عند ارتفاع رأس البوم أقل من الحد لحجم هذا الحمل","Visibility and light adequate":"الرؤية والإضاءة كافية","Radio check done; signals agreed; stop signal understood by all":"تم اختبار اللاسلكي؛ والإشارات متفق عليها؛ وإشارة التوقف مفهومة للجميع",Lift:"الرفع",Slings:"الأسلاك",Wind:"الرياح",Checklist:"قائمة الفحص",Charts:"الجداول",Rigging:"التربيط","3-second gust from the crane's anemometer or a meter.":"هبّة 3 ثوانٍ من مقياس الرياح في الونش أو جهاز قياس.","Anything else under the tip":"أي شيء آخر تحت رأس البوم","Best: from the manufacturer's outrigger calculator for this lift. Leave empty to estimate.":"الأفضل: من حاسبة أرجل المصنّع لهذا الرفع. اتركها فارغة للتقدير.","Boom length":"طول البوم","Boom tip height":"ارتفاع رأس البوم","Chart capacity at this radius":"حمولة الجدول عند نصف القطر هذا","Chart's wind limit":"حد الرياح في الجدول",Counterweight:"الثقل المعاكس","Crane mass":"وزن الونش","From the crane's load chart for the exact configuration.":"من جدول أحمال الونش للتجهيز نفسه.","Heaviest outrigger force":"أكبر قوة على رجل","Hook block":"بلوك الخطاف","Lift plan above":"خطة رفع فوق","Load (with spreader, if any)":"الحمل (مع السبريدر إن وُجد)","Load mass":"وزن الحمل",Load:"الحمل","Load's largest face":"أكبر وجه في الحمل","Mat length":"طول لوح التوزيع","Mat width":"عرض لوح التوزيع","Measured at height":"مُقاس على ارتفاع","Or the allowable pressure from a site investigation":"أو الضغط المسموح من تقرير تربة","Printed on the load chart (often 9.8 m/s).":"مطبوع على جدول الأحمال (غالبًا 9.8 م/ث).",Radius:"نصف القطر","Slings, shackles, spreader":"الأسلاك، والشكالات، وعارضة التوزيع","Stop above":"توقف فوق","Typical values are the low end of published ranges — a geotechnical figure always wins.":"القيم النموذجية هي الحد الأدنى من المدى المنشور — رقم التربة من المختص هو المعتمد دائمًا.","Wind is stronger higher up.":"الرياح أقوى كلما ارتفعت.","Wind now":"الرياح الآن","e.g. jib stowed on the boom, if the chart says to add it":"مثلًا: الذراع الإضافي المطوي على البوم، إن كان الجدول يطلب إضافته","Crane toolkit":"أدوات الرافعات","Load charts, ground, slings, wind":"جداول الأحمال، الأرض، الأسلاك، الرياح","Within the chart with margin.":"ضمن الجدول بهامش أمان.","Critical lift: over {a}% — needs a written lift plan and sign-off.":"رفع حرج: أكثر من {a}% — يحتاج خطة رفع مكتوبة وتوقيعًا.","Over {b}%: too close to the limit — replan (shorter radius, bigger crane, lighter rigging).":"أكثر من {b}%: قريب جدًا من الحد — أعِد التخطيط (نصف قطر أقصر، ونش أكبر، تربيط أخف).","OVER THE CHART — this lift is not allowed.":"فوق الجدول — هذا الرفع غير مسموح.",m:"م",t:"طن","m/s":"م/ث","m²":"م²","kN/m²":"كيلونيوتن/م²","%":"%",Planning:"التخطيط","Text size":"حجم الخط","Worked out on the phone — exact, instant, no model":"محسوبة على الهاتف — دقيقة وفورية وبدون نموذج","Ask the model":"سؤال النموذج","unusually slow — why?":"بطيء بشكل غير عادي — لماذا؟","Why is it slow?":"لماذا هو بطيء؟","Check now":"الفحص الآن","Send this report":"إرسال هذا التقرير","Not available in this build":"غير متاح في هذه النسخة","Reads the phone's heat, battery saver, free memory and the engine's own log, and says in plain words what is slowing answers down.":"يقرأ حرارة الهاتف وموفّر البطارية والذاكرة الحرة وسجل المحرك، ويقول بكلمات بسيطة ما الذي يبطئ الإجابات.","The phone is hot — it slows the processor down on purpose. Let it cool, take it out of its case, don't charge while asking.":"الهاتف ساخن — ويُبطئ المعالج عمدًا. اتركه يبرد، وأخرجه من غطائه، ولا تشحنه أثناء السؤال.","Battery saver is on — it caps the processor. Turn it off while using Attune.":"موفّر البطارية مفعّل — ويحدّ من المعالج. أوقفه أثناء استخدام Attune.","Free memory is low for this model — close other apps (games, camera, many browser tabs).":"الذاكرة الحرة قليلة لهذا النموذج — أغلق التطبيقات الأخرى (الألعاب، الكاميرا، تبويبات المتصفح الكثيرة).","The model is read from storage instead of RAM — update to the latest Attune APK (it loads the model into RAM).":"يُقرأ النموذج من التخزين بدلًا من الذاكرة — حدّث Attune إلى أحدث إصدار (فهو يحمّل النموذج في الذاكرة).","The engine is using its slowest processor path (no dotprod). Send this report.":"المحرك يستخدم أبطأ مسار للمعالج (بدون dotprod). أرسل هذا التقرير.","The phone is critically hot — Attune stops an answer in progress and keeps what was written. Let it cool for a few minutes.":"الهاتف ساخن إلى درجة خطرة — يوقف التطبيق الإجابة الجارية ويحتفظ بما كُتب. اتركه يبرد بضع دقائق.","The phone is very hot — Attune waits up to 20 seconds before each new answer so it can cool, and uses fewer threads the next time the model starts.":"الهاتف ساخن جدًا — ينتظر التطبيق حتى 20 ثانية قبل كل إجابة جديدة ليبرد، ويستخدم عددًا أقل من المسارات عند تشغيل النموذج في المرة القادمة.","The phone is getting warm — long answers may slow down soon. Short breaks between answers keep it fast.":"بدأ الهاتف يسخن — قد تبطؤ الإجابات الطويلة قريبًا. فترات راحة قصيرة بين الإجابات تحافظ على سرعته.","Only {n} threads are used for writing.":"يُستخدم {n} مسارات فقط للكتابة.","This is a big model for a phone — Qwen 3.5 4B is about 2–3× faster.":"هذا نموذج كبير على الهاتف — Qwen 3.5 4B أسرع بنحو 2–3 مرات.","Nothing obvious — the phone may have slowed Attune while it was in the background. The new APK keeps it at full speed while writing.":"لا يوجد سبب واضح — ربما أبطأ الهاتف Attune أثناء عمله في الخلفية. الإصدار الجديد يُبقيه بأقصى سرعة أثناء الكتابة.","Nothing is holding it back.":"لا يوجد ما يعيقه.","Payment · Ask":"دفعة · سؤال","Money tools":"أدوات المال","Gemma 4 E2B · fast engine (GPU)":"Gemma 4 E2B · المحرك السريع (GPU)","Gemma 4 E4B · fast engine (GPU)":"Gemma 4 E4B · المحرك السريع (GPU)","The fast one. Runs on the phone's graphics chip: the first words appear in under a second and it writes faster than you can read. Reads photos, English and Arabic. For hard reasoning, the E4B below is stronger.":"النموذج السريع. يعمل على شريحة الرسوميات في الهاتف: تظهر أولى الكلمات في أقل من ثانية، ويكتب أسرع مما تقرأ. يقرأ الصور، بالعربية والإنجليزية. وللتفكير الصعب، نموذج E4B بالأسفل أقوى.","The stronger fast one: noticeably better answers than the E2B, still on the graphics chip — first words in about a second, then roughly 20–45 words a second on a flagship.":"السريع الأقوى: إجابات أفضل بوضوح من E2B، ويعمل أيضًا على شريحة الرسوميات — أولى الكلمات في نحو ثانية، ثم نحو 20–45 كلمة في الثانية على هاتف رائد.","⚡ fast engine · first words in ~1 s":"⚡ محرك سريع · أولى الكلمات في ~ثانية","Stronger ·":"أقوى ·","This model is large for this phone. It works, but answers come slowly and the phone gets warm. For quick answers use Gemma 4 E2B on the fast engine — reads photos, first words in about a second.":"هذا النموذج كبير على هذا الهاتف. يعمل، لكن الإجابات بطيئة والهاتف يسخن. للإجابات السريعة استخدم Gemma 4 E2B على المحرك السريع — يقرأ الصور، وتظهر أولى الكلمات في نحو ثانية.","Fast engine on the graphics chip":"المحرك السريع على شريحة الرسوميات","Fast engine on the CPU":"المحرك السريع على المعالج (CPU)","multi-token prediction on":"التوقع متعدد الكلمات: مفعّل","Use the graphics chip":"استخدام شريحة الرسوميات","On: the model runs on the GPU — first words in about a second. Off: the CPU, slower, only for phones whose GPU driver misbehaves.":"عند التفعيل: يعمل النموذج على GPU — أولى الكلمات في نحو ثانية. عند الإيقاف: على المعالج، وهو أبطأ، ويُستخدم فقط للهواتف التي يسبب فيها تعريف GPU مشكلات.","Switch to the fast engine":"الانتقال إلى المحرك السريع","Gemma 4 E2B on the graphics chip: first words in about a second, many times faster than this engine. {s} GB, once.":"Gemma 4 E2B على شريحة الرسوميات: أولى الكلمات في نحو ثانية، وأسرع من هذا المحرك بكثير. {s} جيجابايت، مرة واحدة.","The fast engine is running on the CPU, not the graphics chip — turn on “Use the graphics chip” above. If it switched itself off, the phone's GPU driver refused it: send this report.":"يعمل المحرك السريع على المعالج لا على شريحة الرسوميات — فعّل «استخدام شريحة الرسوميات» بالأعلى. وإذا توقف تلقائيًا، فمعناه أن تعريف GPU في الهاتف رفضه: أرسل هذا التقرير.","The biggest speed-up on this phone is the fast engine: Gemma 4 E2B on the graphics chip — first words in about a second. Tap “Switch to the fast engine” above.":"أكبر تسريع على هذا الهاتف هو المحرك السريع: Gemma 4 E2B على شريحة الرسوميات — أولى الكلمات في نحو ثانية. اضغط «الانتقال إلى المحرك السريع» بالأعلى.","The GPU would not start, so the fast engine is on the CPU. ":"لم يعمل GPU، فالمحرك السريع يعمل على المعالج. ","Last time, starting the fast engine on the GPU closed the app. It is on the CPU now; you can try the GPU again in Engine → Speed.":"في المرة السابقة أدى تشغيل المحرك السريع على GPU إلى إغلاق التطبيق. هو الآن على المعالج؛ ويمكنك تجربة GPU مرة أخرى من «المحرك» ← «السرعة».","Preparing the fast engine (the first start on the GPU takes longest)":"جارٍ تجهيز المحرك السريع (التشغيل الأول على GPU يستغرق وقتًا أطول)","Build & test":"الكتابة والاختبار",Change:"تعديل","Change it… e.g. “also show the total in EGP”":"عدّله… مثلًا «اعرض الإجمالي بالجنيه أيضًا»","Changed {n} place(s) in the code.":"تم تعديل {n} موضع في الكود.","Check the page":"فحص الصفحة",Code:"الكود","Code that is tested before you get it":"كود يُختبر قبل أن يصلك",Failed:"فشل","Fix it automatically":"الإصلاح تلقائيًا","From chat":"من المحادثة","Hide preview":"إخفاء المعاينة",JavaScript:"JavaScript","Make this program work correctly.":"اجعل هذا البرنامج يعمل بشكل صحيح.","Making the change…":"جارٍ إجراء التعديل…",New:"جديد","Not passing yet":"لم ينجح بعد","Passed its {n} tests":"نجح في {n} اختبارات",Preview:"معاينة","Programs tested on your phone":"برامج تُختبر على هاتفك",Python:"Python","Python could not start: {e}":"تعذّر تشغيل Python: {e}","Python is not in this build — JavaScript and web pages still work.":"Python غير متوفر في هذه النسخة — ما زالت JavaScript وص  about 20 seconds a picture on the CPU. 512 px. For phones with 8 GB RAM or more.":"أسرع وأوضح من Turbo، ويطابق طلبك بدقة أكبر: نحو 20 ثانية للصورة على المعالج. 512 بكسل. للهواتف بذاكرة 8 جيجابايت أو أكثر.","Pro · best quality":"Pro · أعلى جودة","Pro on this phone's CPU: 10–20 min a picture":"Pro على معالج هذا الهاتف: 10–20 دقيقة للصورة","This phone's graphics chip isn't working with Studio, so the Pro model would take 10–20 minutes a picture on the CPU. Studio Turbo makes a picture in about a minute.":"شريحة الرسوميات في هذا الهاتف لا تعمل مع «الاستوديو»، لذا سيستغرق نموذج Pro من 10 إلى 20 دقيقة للصورة على المعالج. أما «الاستوديو Turbo» فينشئ الصورة في نحو دقيقة.","Fast pictures on any phone: about a minute without a graphics chip, seconds with one. 512 px — great for ideas, drafts and posts.":"صور سريعة على أي هاتف: نحو دقيقة بدون شريحة رسوميات، وثوانٍ معها. 512 بكسل — ممتازة للأفكار والمسودات والمنشورات.","The best photo quality: people, places, products and text in pictures, 1024 px. Also edits a photo you give it (“make it night”, “remove the car”). Needs a working graphics chip — on the CPU a picture takes 10–20 minutes.":"أعلى جودة للصور: أشخاص وأماكن ومنتجات ونصوص داخل الصور، بدقة 1024 بكسل. ويعدّل أيضًا صورة تعطيه إياها («اجعلها ليلًا»، «أزِل السيارة»). يحتاج شريحة رسوميات تعمل — فعلى المعالج تستغرق الصورة 10–20 دقيقة.","Studio Pro at full precision: finer detail, cleaner faces, hands and text. Also edits your photos by instruction. Needs a working graphics chip and 12 GB RAM.":"الاستوديو Pro بدقة كاملة: تفاصيل أدق، ووجوه وأيدٍ ونصوص أوضح. ويعدّل صورك بالتعليمات. يحتاج شريحة رسوميات تعمل وذاكرة 12 جيجابايت.","Still working — nothing is stuck. Turbo takes about 1–2 minutes on the CPU. Keep Attune open; Stop cancels it.":"ما زال يعمل — لا شيء متوقف. يستغرق Turbo نحو 1–2 دقيقة على المعالج. اترك Attune مفتوحًا؛ والإيقاف يلغي العملية.","Still working — nothing is stuck. Without the graphics chip a Pro picture takes 10–20 minutes (edits take longer). For speed, pick Turbo. Keep Attune open; Stop cancels it.":"ما زال يعمل — لا شيء متوقف. بدون شريحة الرسوميات تستغرق صورة Pro من 10 إلى 20 دقيقة (والتعديل أطول). للسرعة اختر Turbo. اترك Attune مفتوحًا؛ والإيقاف يلغي العملية.","Delete this chat?":"حذف هذه المحادثة؟","This can't be undone.":"لا يمكن التراجع عن ذلك.","Delete this reminder?":"حذف هذا التذكير؟","Delete this project?":"حذف هذا المشروع؟","Remove this crane from the fleet?":"إزالة هذه الرافعة من الأسطول؟","Remove this from the project?":"إزالة هذا من المشروع؟","Delete this picture?":"حذف هذه الصورة؟","Delete this place?":"حذف هذا المكان؟","Forget this correction?":"نسيان هذا التصحيح؟",Forget:"نسيان","Delete this action?":"حذف هذا الإجراء؟","RAM: needs {n} GB · smooth from {s} GB":"الذاكرة: يحتاج {n} جيجابايت · يعمل بسلاسة من {s} جيجابايت","runs smoothly on this device ({n} GB)":"يعمل بسلاسة على هذا الجهاز ({n} جيجابايت)","runs on this device ({n} GB), slower":"يعمل على هذا الجهاز ({n} جيجابايت)، لكن أبطأ","this device has {n} GB — too little":"ذاكرة هذا الجهاز {n} جيجابايت — غير كافية","Spark (helper)":"Spark (مساعد)","Only works with Spark, Glow, Core and Zenith — not with the model in use.":"يعمل فقط مع Spark وGlow وCore وZenith — وليس مع النموذج الحالي.","Download Spark as a helper (about 0.5 GB, once). Works with Glow, Core and Zenith.":"نزّل Spark كمساعد (نحو 0.5 جيجابايت، مرة واحدة). يعمل مع Glow وCore وZenith.","This is a big model for a phone — Core is about 2–3× faster.":"هذا نموذج كبير على الهاتف — Core أسرع بنحو 2–3 مرات.","Everest with a huge memory: it holds a whole book, contract or a year of notes at once. The best for very long documents. Computer-class.":"Everest بذاكرة ضخمة: يستوعب كتابًا كاملًا أو عقدًا أو ملاحظات سنة كاملة دفعة واحدة. الأفضل للمستندات الطويلة جدًا. للحواسيب.","The most knowledgeable: a very large model that answers at the speed of a small one (mixture of experts). Near top-tier answers. Computer-class.":"الأوسع معرفة: نموذج ضخم يجيب بسرعة نموذج صغير (خليط الخبراء). إجابات قريبة من أعلى مستوى. للحواسيب.","The strongest single model here: deep reasoning, expert writing, reads photos. Computer-class.":"أقوى نموذج منفرد هنا: تفكير عميق، وكتابة بمستوى خبير، ويقرأ الصور. للحواسيب.","Close to Apex+ quality at a much higher speed. Reads photos. For strong laptops.":"جودة قريبة من Apex+ وبسرعة أعلى بكثير. يقرأ الصور. للحواسيب المحمولة القوية.","Expert level, and reads text, photos and audio. Comfortable on a laptop or a 16 GB phone.":"مستوى خبير، ويقرأ النصوص والصور والصوت. مريح على حاسوب محمول أو هاتف بذاكرة 16 جيجابايت.","The strongest model a 12 GB phone can run: expert answers, and the best at reading documents and photos.":"أقوى نموذج يمكن تشغيله على هاتف بذاكرة 12 جيجابايت: إجابات بمستوى خبير، والأفضل في قراءة المستندات والصور.","The fast one: runs on the phone's graphics chip — the first words appear in under a second. Reads photos, English and Arabic. For harder questions, Blaze+ is stronger.":"السريع: يعمل على شريحة الرسوميات في الهاتف — تظهر أولى الكلمات في أقل من ثانية. يقرأ الصور والإنجليزية والعربية. وللأسئلة الأصعب، Blaze+ أقوى.","The stronger fast one: noticeably better answers than Blaze, still on the graphics chip — first words in about a second.":"السريع الأقوى: إجابات أفضل بوضوح من Blaze، ويعمل أيضًا على شريحة الرسوميات — أولى الكلمات في نحو ثانية.","The best everyday choice if your phone can hold it: reads photos of documents and receipts, Arabic and English, with extra precision for long answers.":"أفضل خيار يومي إن كان هاتفك يتسع له: يقرأ صور المستندات والإيصالات، بالعربية والإنجليزية، مع دقة أعلى للإجابات الطويلة.","Text, photos and audio on a flagship phone — pick it if you want voice notes understood.":"نصوص وصور وصوت على هاتف رائد — اختره إن أردت فهم الرسائل الصوتية.","The sweet spot on an ordinary modern phone: everything the app does, in under 3 GB.":"الخيار الأمثل لهاتف حديث عادي: كل ما يفعله التطبيق، في أقل من 3 جيجابايت.","Core made 10% smaller for a 4 GB phone — worth it over Glow.":"Core بحجم أصغر بنسبة 10% لهاتف بذاكرة rding pass and receipts.":"أرسله إلى خدمة عملاء الشركة (بالبريد الإلكتروني أو نموذج المطالبات لديهم). احتفظ ببطاقة الصعود والإيصالات.","From (city or code)":"من (مدينة أو رمز)",To:"إلى","Flight number":"رقم الرحلة","Told how many days before?":"أُبلغت قبلها بكم يوم؟","Hours late at arrival":"ساعات التأخير عند الوصول",Passengers:"المسافرون","The reason they gave":"السبب الذي ذكروه","You are owed":"يحق لك","You are probably owed":"يحق لك على الأرجح","per passenger":"لكل مسافر","Ask the airline for the reason: weather or an air-traffic strike would cancel it; a technical fault or crew shortage would not.":"اسأل شركة الطيران عن السبب: سوء الطقس أو إضراب المراقبة الجوية يلغي الحق؛ أما العطل الفني أو نقص الطاقم فلا يلغيه.","Write the claim":"اكتب المطالبة","No compensation":"لا تعويض","Worked out from the published rules (EU 261, UK 261, Canada's APPR). Airlines sometimes refuse at first — a polite second letter or the national enforcement body usually settles it.":"محسوب من القواعد المنشورة (أوروبا 261، بريطانيا 261، لوائح كندا). قد ترفض شركات الطيران في البداية — وغالبًا ما تحسم الأمر رسالة ثانية مهذبة أو الجهة الرقابية في البلد.","What you're owed":"ما يحق لك","Flight delayed or cancelled?":"تأخرت رحلتك أو أُلغيت؟","See what the airline owes you — up to €600 — and get the letter":"اعرف ما تدين لك به شركة الطيران — حتى 600 يورو — واحصل على الرسالة","Write the request":"اكتب الطلب","Ask for it back":"اطلب استرداده","See what I'm owed":"ما الذي يحق لي؟","A technical problem with the plane":"عطل فني في الطائرة","Crew shortage or the airline's own staff strike":"نقص الطاقم أو إضراب موظفي شركة الطيران","Overbooking / operational reasons":"حجز زائد / أسباب تشغيلية","Bad weather":"سوء الأحوال الجوية","Air-traffic control or airport strike":"مراقبة الحركة الجوية أو إضراب في المطار","Security, political unrest, a bird strike, medical emergency":"أمن، اضطرابات سياسية، اصطدام طائر، حالة طبية طارئة","I don't know / they didn't say":"لا أعرف / لم يذكروا السبب","Which airport did you
